xpected-loss calculations.", "ai": "scale_pos_weight = neg/pos = 99 balances the classes while keeping predicted probabilities calibrated, so the outputs can go straight into expected-loss math.", "verdict": "wrong", "bug": "Class re-weighting distorts probabilities", "fix": "Either don't reweight (optimize logloss, tune threshold), or recalibrate on a held-out set (Platt/isotonic), or analytically correct odds by the weight factor.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Reweighting the classes moves the 'thermostat' of the probabilities.", "mech": "Making positives 99× heavier makes the model think fraud is about 50% common, so its probabilities inflate.", "breaks": "Fine for ranking, wrong for expected-value math unless you recalibrate.", "contrast": "Without reweighting, log-loss-trained probabilities are usually close to calibrated.", "details": "Up-weighting positives 99× makes the model act as if the prior were about 50%, so predicted probabilities are badly inflated. XGBoost's docs say that if you care about predicting the right probability, you can't re-balance the dataset this way. Weighting can help ranking (AUC), but probabilities need recalibration (or don't reweight at all) before they go into expected-value math.", "why": "Class re-weighting distorts probabilities", "flaws": ["Upweighting positives inflates probabilities", "scale_pos_weight should be √99 ≈ 10 instead", "It changes ranking but leaves probabilities", "scale_pos_weight caps the maximum tree depth"]}, {"id": "gbm-21", "sub": "Imbalance & calibration", "difficulty": "Medium", "title": "Metric for rare positives", "prompt": "With 0.5% positives, which offline metric should drive model selection for a GBM fraud model reviewed in priority order?", "ai": "PR-AUC (average precision), or precision/recall at the operating capacity (e.g. the top 500 alerts a day). ROC-AUC can look great when positives are rare because the false-positive rate is diluted by the huge number of negatives. Accuracy is useless here.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "When positives are rare, judge the model by its alarm quality.", "mech": "PR-AUC looks at precision versus recall, which is where rare-event performance shows.", "breaks": "ROC's false-positive rate gets diluted by a huge pile of negatives.", "contrast": "With balanced classes, ROC-AUC is fine.", "details": "That's correct. With rare positives, PR curves show performance in the region that matters (Saito & Rehmsmeier 2015). Tying the metric to review capacity is even better.", "why": "PR-AUC looks at precision versus recall, which is where rare-event performance shows."}, {"id": "gbm-22", "sub": "Constraints & tuning", "difficulty": "Medium", "title": "Monotonic constraints", "prompt": "Risk wants predicted default probability to never go **down** as `debt_to_income` goes up. What does the AI suggest?", "ai": "Set a monotone constraint on that feature, e.g. XGBoost `monotone_constraints={'debt_to_income': 1}` (LightGBM `monotone_constraints` with +1). This guarantees the prediction is non-decreasing in debt_to_income when all other features are held fixed. It can cost a little accuracy but makes the model more defensible and robust.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "A guard rail: the prediction can only go one way as this feature rises.", "mech": "The constraint forces predictions to be non-decreasing in debt-to-income, holding the other features fixed.", "breaks": "More defensible, at a small cost in accuracy.", "contrast": "It doesn't force the raw marginal data trend.", "details": "That's correct, and it's the use case the XGBoost and LightGBM docs describe. The guarantee holds with other features fixed (ceteris paribus), not along the raw marginal relationship in the data.", "why": "The constraint forces predictions to be non-decreasing in debt-to-income, holding the other features fixed."}, {"id": "gbm-23", "sub": "Imbalance & calibration", "difficulty": "Medium", "title": "Calibrating a GBM", "prompt": "A GBM's probabilities look over-confident. The AI fits isotonic regression to fix it.", "ai": "Fit `IsotonicRegression` on the model's predictions on the **training set** against y_train, then apply it to new predictions. Isotonic is non-parametric, so it fixes any miscalibration.", "verdict": "wrong", "bug": "Calibrating on the training predictions", "fix": "Fit the calibrator on held-out/OOF predictions; check a reliability diagram and Brier score on a separate test set.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Don't calibrate a scale with the weights it was built on.", "mech": "Training predictions are overconfident, so a calibrator fit on them learns the wrong mapping.", "breaks": "Fit on held-out or out-of-fold predictions.", "contrast": "With lots of held-out data, isotonic is great. With little, use Platt.", "details": "Training-set predictions are over-fit and more extreme than out-of-sample ones, so a calibrator fit on them learns the wrong mapping. Use a held-out calibration set or cross-validated predictions (sklearn `CalibratedClassifierCV` with cv). Isotonic also needs a fair amount of data (with small samples, Platt/sigmoid scaling is safer) and can overfit.", "why": "Calibrating on the training predictions", "flaws": ["Fit on train predictions, which are overfit", "Isotonic needs more trees to calibrate well", "Platt scaling is required for GBM outputs", "Isotonic can't handle over-confident scores"]}, {"id": "gbm-24", "sub": "Constraints & tuning", "difficulty": "Medium", "title": "A sane tuning order", "prompt": "You have limited compute. Outline a GBM tuning strategy.", "ai": "1) Fix a fairly high learning rate (~0.05–0.1) and use early stopping to choose the number of rounds. 2) Tune tree complexity (max_depth/num_leaves, min_child_weight/min_data_in_leaf). 3) Tune sampling (subsample, colsample) and regularization (lambda, alpha, gamma). 4) Lower the learning rate and re-run early stopping for the final model. Use Bayesian optimization or random search over a CV split that matches deployment (time-based if needed), not a full grid.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "Rough in the frame, then fine-tune the details.", "mech": "Fix a fast learning rate with early stopping, tune structure, then randomness and penalties, then slow down for the final fit.", "breaks": "Random or Bayesian search beats grids. Features and leakage matter more than tuning.", "contrast": "Grid-searching n_estimators wastes compute; early stopping does it for free.", "details": "This staged approach is standard and appears in community guides and the LightGBM parameter-tuning docs. Random or Bayesian search beats grid search when only a few hyperparameters matter (Bergstra & Bengio 2012).", "why": "Fix a fast learning rate with early stopping, tune structure, then randomness and penalties, then slow down for the final fit."}, {"id": "gbm-25", "sub": "XGBoost vs LightGBM vs CatBoost", "difficulty": "Medium", "title": "Can XGBoost grow leaf-wise?", "prompt": "\"What's the difference in how XGBoost and LightGBM grow trees?\"", "ai": "LightGBM grows leaf-wise (best-first) and XGBoost grows level-wise (depth-wise). XGBoost **cannot** grow trees leaf-wise, which is the main reason LightGBM is more accurate.", "verdict": "wrong", "bug": "XGBoost supports grow_policy='lossguide'", "fix": "Defaults: XGBoost depthwise, LightGBM leaf-wise; XGBoost can do leaf-wise via grow_policy='lossguide'. Neither is universally more accurate.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "XGBoost's default is careful level-by-level growth, but it has a greedy mode too.", "mech": "grow_policy='lossguide' gives leaf-wise growth like LightGBM.", "breaks": "Neither library is universally more accurate. Validate.", "contrast": "LightGBM can be constrained to grow more like depth-wise.", "details": "The defaults are right, but XGBoost has `grow_policy='lossguide'` (with the hist method) for leaf-wise growth, plus max_leaves. Leaf-wise growth also isn't automatically more accurate. It reaches lower loss with the same number of leaves, but it can overfit small data. Differences in speed and accuracy between tuned libraries are usually small and depend on the dataset.", "why": "XGBoost supports grow_policy='lossguide'", "flaws": ["XGBoost can grow leaf-wise via 'lossguide'", "Leaf-wise growth is patented by LightGBM", "grow_policy only takes effect on GPU training", "LightGBM is level-wise; XGBoost is leaf-wise"]}, {"id": "gbm-26", "sub": "Fundamentals", "difficulty": "Medium", "title": "Forecasting a growing trend", "prompt": "Monthly credits grew linearly from 100 to 340 over 24 months. The AI trains a GBM on `month_index` and forecasts month 30.", "ai": "The GBM picked up the upward trend, so it'll predict about 400 for month 30, continuing the line.", "verdict": "wrong", "bug": "Tree ensembles can't extrapolate beyond the training range", "fix": "Prediction ≈ last-leaf value (~340). Model the trend separately (e.g. predict growth/differences) and let the GBM handle residual structure.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Trees can only repeat answers they've seen. They can't draw the line further.", "mech": "Past the last split, every future month falls in the last leaf, so the forecast flattens.", "breaks": "Model the trend separately (differences, ratios) and let the GBM learn what's left.", "contrast": "Linear models extrapolate, sometimes too eagerly.", "details": "Tree predictions are piecewise constant. For any month_index beyond the last split, the prediction stays at the value of the last leaf, about 340. GBMs flatten out instead of extrapolating. Detrend first (model differences or ratios), use a linear base learner or linear_tree, or a model built for forecasting.", "why": "Tree ensembles can't extrapolate beyond the training range", "vis": "<figure class=\"vis\"><svg viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"Training data: linear growth 100 to 340 over 24 months\" class=\"chart\"><path class=\"ax\" d=\"M30,10 L30,145 L330,145\"/><text class=\"tx\" x=\"330\" y=\"162\" text-anchor=\"end\">month</text><text class=\"tx\" x=\"34\" y=\"14\">credits</text><path class=\"ln\" d=\"M30.0,132.5 L39.8,128.3 L49.7,124.2 L59.5,120.0 L69.3,115.8 L79.2,111.7 L89.0,107.5 L98.8,103.3 L108.7,99.2 L118.5,95.0 L128.3,90.8 L138.2,86.7 L148.0,82.5 L157.8,78.3 L167.7,74.2 L177.5,70.0 L187.3,65.8 L197.2,61.7 L207.0,57.5 L216.8,53.3 L226.7,49.2 L236.5,45.0 L246.3,40.8 L256.2,36.7 L266.0,32.5\"/><circle class=\"dot\" cx=\"325\" cy=\"7.5\" r=\"4\"/><text class=\"tx\" x=\"319\" y=\"24.0\" text-anchor=\"end\">month 30?</text></svg><figcaption>Training data: linear growth 100 to 340 over 24 months</figcaption></figure>", "flaws": ["Trees can't extrapolate; it'll flatline ~340", "Needs more trees to follow the linear trend", "Learning rate is too high to fit the slope", "Needs lag features to capture seasonality"]}, {"id": "gbm-27", "sub": "Fundamentals", "difficulty": "Medium", "title": "More trees, worse test error?", "prompt": "On a small, noisy dataset, a teammate says: \"Adding trees to a GBM can't hurt. It's like a random forest, where more trees only stabilize things.\" The AI responds:", "ai": "That's not right for boosting. Each new tree fits what's left of the training error, and eventually what's left is mostly noise, so test error goes down, bottoms out, and then rises. Random forests are different: their trees are independent and averaged, so adding more just stabilizes the average. Boosting needs a stopping rule such as early stopping.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "A relay team of weak learners, each one fixing the last one's mistakes.", "mech": "Each new runner fixes what's left. Eventually what's left is mostly noise, and fitting it hurts the test score.", "breaks": "That's why boosting needs early stopping. Random-forest trees don't chase each other, so adding more is safe.", "contrast": "With a tiny learning rate it takes longer to overfit, but it still does.", "details": "", "why": "Each new runner fixes what's left.", "evis": "<figure class=\"vis\"><svg viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"Training error keeps falling; test error bottoms out, then rises\" class=\"chart\"><path class=\"ax\" d=\"M30,10 L30,145 L330,145\"/><text class=\"tx\" x=\"330\" y=\"162\" text-anchor=\"end\">boosting rounds</text><text class=\"tx\" x=\"34\" y=\"14\">error</text><path class=\"ln mut\" d=\"M30.0,35.0 L34.9,41.9 L39.8,48.3 L44.8,54.3 L49.7,59.9 L54.6,65.1 L59.5,70.0 L64.4,74.6 L69.3,78.9 L74.2,82.9 L79.2,86.7 L84.1,90.2 L89.0,93.5 L93.9,96.6 L98.8,99.5 L103.8,102.2 L108.7,104.7 L113.6,107.0 L118.5,109.2 L123.4,111.3 L128.3,113.2 L133.2,115.0 L138.2,116.7 L143.1,118.3 L148.0,119.8 L152.9,121.2 L157.8,122.5 L162.8,123.7 L167.7,124.8 L172.6,125.9 L177.5,126.9 L182.4,127.8 L187.3,128.7 L192.2,129.5 L197.2,130.2 L202.1,130.9 L207.0,131.6 L211.9,132.2 L216.8,132.8 L221.8,133.4 L226.7,133.9 L231.6,134.3 L236.5,134.8 L241.4,135.2 L246.3,135.6 L251.2,136.0 L256.2,136.3 L261.1,136.6 L266.0,136.9 L270.9,137.2 L275.8,137.5 L280.8,137.7 L285.7,137.9 L290.6,138.1 L295.5,138.3 L300.4,138.5 L305.3,138.7 L310.2,138.9 L315.2,139.0 L320.1,139.2 L325.0,139.3\"/><path class=\"ln\" d=\"M30.0,26.2 L34.9,32.2 L39.8,37.5 L44.8,42.3 L49.7,46.7 L54.6,50.5 L59.5,54.0 L64.4,57.1 L69.3,59.9 L74.2,62.4 L79.2,64.5 L84.1,66.5 L89.0,68.2 L93.9,69.7 L98.8,71.0 L103.8,72.1 L108.7,73.0 L113.6,73.8 L118.5,74.5 L123.4,75.0 L128.3,75.4 L133.2,75.7 L138.2,75.9 L143.1,76.1 L148.0,76.1 L152.9,76.0 L157.8,75.9 L162.8,75.7 L167.7,75.4 L172.6,75.1 L177.5,74.7 L182.4,74.3 L187.3,73.8 L192.2,73.2 L197.2,72.6 L202.1,72.0 L207.0,71.3 L211.9,70.6 L216.8,69.8 L221.8,69.0 L226.7,68.2 L231.6,67.3 L236.5,66.4 L241.4,65.4 L246.3,64.5 L251.2,63.4 L256.2,62.4 L261.1,61.3 L266.0,60.2 L270.9,59.1 L275.8,57.9 L280.8,56.8 L285.7,55.5 L290.6,54.3 L295.5,53.0 L300.4,51.7 L305.3,50.4 L310.2,49.1 L315.2,47.7 L320.1,46.3 L325.0,44.8\"/><circle class=\"dot\" cx=\"124.4\" cy=\"75.10706486685311\" r=\"4\"/><text class=\"tx\" x=\"323\" y=\"133.303963368072\" text-anchor=\"end\">train</text><text class=\"tx g\" x=\"323\" y=\"39.75\" text-anchor=\"end\">test</text><text class=\"tx\" x=\"124.4\" y=\"93.10706486685311\" text-anchor=\"middle\">early stop</text></svg><figcaption>Training error keeps falling; test error bottoms out, then rises</figcaption></figure>"}, {"id": "gbm-28", "sub": "Loss & gradients", "difficulty": "Medium", "title": "Residuals for every loss?", "prompt": "\"In gradient boosting, every tree is fit to the raw residuals $y - \\text{prediction}$, whatever the loss.\" The AI agrees:", "ai": "Yes. That's what 'gradient' boosting means. Every tree fits $y - F$, whether the loss is squared error, absolute error, or log loss.", "verdict": "wrong", "bug": "Raw residuals only for squared error", "fix": "Each tree fits the negative gradient of the chosen loss: $y - F$ for squared error, $\\operatorname{sign}(y - F)$ for absolute error, $y - p$ for log loss (XGBoost also uses the Hessian).", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "A relay team of weak learners, each one fixing the last one's mistakes.", "mech": "Each runner fixes the 'downhill direction' of the chosen loss. Only for squared error is that the plain residual.", "breaks": "For absolute error it's just the sign of the error. For log loss it's actual minus predicted probability.", "contrast": "Knowing this explains why the loss choice changes what trees learn.", "details": "", "why": "Raw residuals only for squared error", "flaws": ["y − F is the negative gradient only for MSE", "Hessians replace gradients for every loss", "Gradients are used only in XGBoost, not GBM", "Log loss trees fit y − F on the logit scale"]}, {"id": "gbm-29", "sub": "Tree structure", "difficulty": "Medium", "title": "LightGBM on 2,000 rows", "prompt": "With only 2,000 training rows, the AI recommends LightGBM with default settings \"because it overfits less than XGBoost.\"", "ai": "LightGBM's leaf-wise growth is more conservative, so it's the safer choice on small data with default settings.", "verdict": "wrong", "bug": "Leaf-wise growth overfits small data more readily", "fix": "On small data, constrain LightGBM: lower num_leaves, raise min_data_in_leaf, set max_depth, and use early stopping. Or compare against depth-wise XGBoost/CatBoost with CV.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "A greedy explorer digs deep fast, and on a small map it digs into noise.", "mech": "Leaf-wise growth makes deep, lopsided trees that memorize small data.", "breaks": "Constrain num_leaves and min_data_in_leaf, or compare libraries with CV.", "contrast": "On big data, leaf-wise growth is often an advantage.", "details": "", "why": "Leaf-wise growth overfits small data more readily", "flaws": ["Leaf-wise growth overfits small data faster", "2,000 rows needs at least 1,000 boost rounds", "Learning rate must be ≥ 0.3 for small data", "Small data needs more leaves per tree, not fewer"]}, {"id": "gbm-30", "sub": "Feature importance", "difficulty": "Medium", "title": "Why does a random ID rank high?", "prompt": "A random `row_uuid_hash` column (pure noise, thousands of unique values) shows up in the top 5 of a tree model's gain/impurity importance. The AI explains:", "ai": "That's expected. A feature with many unique values offers lots of possible split points, so on the training data it can almost always find a split that happens to reduce loss, purely by chance. Gain and impurity importance are measured on the training data, so they reward that. Check with permutation importance on held-out data, which should show it's useless.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "A feature with a thousand doors will find one that looks good by luck.", "mech": "Many unique values mean many candidate splits, and on training data one will reduce loss by chance.", "breaks": "Gain is measured in-sample, so it rewards luck. Holdout permutation importance exposes it.", "contrast": "A truly informative feature keeps its importance on holdout data.", "details": "", "why": "Many unique values mean many candidate splits, and on training data one will reduce loss by chance."}, {"id": "gbm-31", "sub": "Feature importance", "difficulty": "Medium", "title": "Big SHAP → pull that lever?", "prompt": "`discount_offered` has the largest mean |SHAP| in a renewal model. The AI recommends raising discounts to boost renewals.", "ai": "SHAP shows how much each feature changes the prediction, so raising discount_offered will raise renewals by roughly its SHAP contribution.", "verdict": "wrong", "bug": "SHAP explains the model, not the world", "fix": "Treat it as a hypothesis; estimate the causal effect with an experiment (randomize discounts) or a causal design.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "SHAP explains the model's reasoning, not how the world responds.", "mech": "High SHAP means the model leans on the feature, maybe because discounts go to accounts that were already likely to renew.", "breaks": "Changing the feature may not change the outcome. Test causally.", "contrast": "In a randomized experiment on discounts, model attributions line up better with effects.", "details": "", "why": "SHAP explains the model, not the world", "flaws": ["SHAP explains the model, not causal effects", "TreeSHAP values are biased for deep trees", "Permutation importance should replace SHAP", "SHAP ignores interactions with other features"]}, {"id": "gbm-32", "sub": "Feature importance", "difficulty": "Hard", "title": "Permutation importance with twins", "prompt": "`seats` and `licensed_users` are almost identical. Permutation importance on holdout says each one barely matters. The AI explains:", "ai": "When you shuffle one twin, the model can still get the same information from the other, so performance barely drops and each looks unimportant. Together they may matter a lot. Permute them as a group, or drop one and retrain to see the real value.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "Shuffle one twin and the other covers for it.", "mech": "The model gets the same information from the remaining twin, so performance barely drops.", "breaks": "Permute correlated features as a group to see their joint value.", "contrast": "Uncorrelated features don't have this problem.", "details": "", "why": "The model gets the same information from the remaining twin, so performance barely drops."}, {"id": "gbm-33", "sub": "Categorical & target encoding", "difficulty": "Medium", "title": "Smoothing fixes leakage?", "prompt": "The AI target-encodes `account_id` on the **whole** training set before cross-validation, with heavy smoothing toward the global mean, and says that's leak-free.", "ai": "Smoothing shrinks rare categories toward the global mean, so the target can't leak. Computing it once on the full training set is fine.", "verdict": "wrong", "bug": "Smoothing reduces variance, not leakage", "fix": "Cross-fit: compute encodings out-of-fold inside each CV fold (sklearn TargetEncoder does this in fit_transform), or use CatBoost's ordered TS.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Smoothing turns down the volume on the answer key. It's still in the room.", "mech": "Each row's encoding still includes its own label, just shrunk.", "breaks": "Only out-of-fold encoding actually removes the leakage.", "contrast": "Smoothing is still useful for variance, combined with cross-fitting.", "details": "", "why": "Smoothing reduces variance, not leakage", "flaws": ["Smoothing cuts noise, but labels still leak", "More smoothing increases leakage, not less", "Leakage only happens with one-hot encoding", "The global mean should come from the test set"]}, {"id": "ci-01", "sub": "Estimands", "difficulty": "Medium", "title": "What does 1:1 matching estimate?", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. You match each adopter to its nearest non-adopter and average the treated-minus-matched-control differences. What estimand is that?", "ai": "It's the **ATE**, the average effect of CodePilot across all 9,000 accounts, because matching makes the groups comparable.", "verdict": "wrong", "bug": "Matching controls to treated units targets the ATT", "fix": "$\\text{ATT} = E[\\,Y(1) - Y(0) \\mid D = 1\\,]$. ATE requires matching in both directions (Matching::Match estimand='ATE').", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Build a look-alike control group: non-adopters who looked just like the adopters before adoption.", "mech": "Matching finds a twin for each adopter, so you learn what adoption did for adopters (ATT).", "breaks": "The ATE would also need twins for non-adopters, who may be very different (small accounts).", "contrast": "Matching in both directions targets the ATE.", "details": "Finding a control for every treated unit estimates the **ATT**, $E[\\,Y(1) - Y(0) \\mid \\text{adopted}\\,]$, the effect on the kind of accounts that adopted. The ATE would also need to impute $Y(1)$ for the non-adopters, which can be very different (e.g. small accounts). For a decision like whether CodePilot paid off for adopters, the ATT is usually the right target. For whether to push it to everyone, you'd want the ATE or ATC.", "why": "Matching controls to treated units targets the ATT", "flaws": ["Matching controls to adopters estimates ATT", "1:1 matching yields the ATC, not the ATE", "Needs replacement to estimate any effect", "1:1 matching can't give valid standard errors"]}, {"id": "ci-02", "sub": "Potential outcomes", "difficulty": "Medium", "title": "Decomposing the naive difference", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Write the naive adopter-vs-non-adopter difference in mean credits in potential-outcomes terms.", "ai": "$$\\underbrace{E[Y \\mid D{=}1] - E[Y \\mid D{=}0]}_{\\text{naive gap}} = \\text{ATT} + \\underbrace{E[Y(0) \\mid D{=}1] - E[Y(0) \\mid D{=}0]}_{\\text{selection bias}}$$ The second term is selection bias: how different adopters' credits would have been from non-adopters' even without CodePilot. It's 0 only if treatment is as good as random with respect to $Y(0)$.", "verdict": "correct", "fix": "naive = ATT + selection bias", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "The data come from a hidden machine that decides who adopts.", "mech": "The raw gap = the real effect + how different adopters would have been anyway.", "breaks": "The second part vanishes only when adoption is as good as random.", "contrast": "In a randomized rollout, the raw gap is the effect.", "details": "That's correct (Mixtape ch. 4, Angrist & Pischke). In a simulation with ATT = 50 and adopters who would have used 300 more credits anyway, the naive difference is about 350.", "why": "The raw gap = the real effect + how different adopters would have been anyway."}, {"id": "ci-03", "sub": "Selection bias", "difficulty": "Medium", "title": "Adopters burn more credits", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Adopters averaged 2,400 credits/month after launch and non-adopters averaged 1,100. Adopters were mostly large engineering-heavy accounts.", "ai": "The effect of CodePilot is **+1,300 credits/month** per adopting account. The groups were measured over the same period, so time trends cancel.", "verdict": "wrong", "bug": "Naive comparison = effect + selection bias", "fix": "Compare against matched controls with similar pre-period credits, seats, and growth, or use DiD; +1,300 is an upper-bound-ish descriptive gap, not an effect.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Big accounts adopt and big accounts burn credits. That's selection, not effect.", "mech": "The +1,300 mixes the effect with the fact that adopters were already heavy users.", "breaks": "Same calendar window ≠ same kind of account. Compare against look-alikes.", "contrast": "Matched controls with similar pre-period usage would shrink the gap toward the true effect.", "details": "Large engineering-heavy accounts would have used more credits without CodePilot. That's the selection-bias term $E[Y(0) \\mid D{=}1] - E[Y(0) \\mid D{=}0]$. Having the same calendar window removes common shocks but not differences in composition. You need to adjust for pre-adoption size and usage (matching on lagged credits, DiD, etc.).", "why": "Naive comparison = effect + selection bias", "vis": "<figure class=\"vis\"><pre class=\"mermaid\">flowchart TD\n  S[Account size and engineering headcount] --> D[Adopts CodePilot]\n  S --> Y[Monthly credits]\n  D -. effect? .-> Y</pre><figcaption>Size drives both adoption and credits, a backdoor path.</figcaption></figure>", "flaws": ["Adopters were bigger already; that's selection", "+1,300 isn't significant at this sample size", "Should compare medians since credits skew", "Same-period comparison double-counts trends"]}, {"id": "ci-04", "sub": "Matching methods", "difficulty": "Medium", "title": "What propensity scores fix", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. The AI proposes propensity-score matching on seats, industry, region, and 6 months of lagged credits.", "ai": "Propensity score matching makes adopters and non-adopters comparable on **all** characteristics, observed and unobserved, just like a randomized experiment, so there's no remaining confounding.", "verdict": "wrong", "bug": "PS only balances observed covariates", "fix": "PS matching balances observed X; unconfoundedness given X is an untestable assumption → do sensitivity analysis (Rosenbaum bounds / E-values).", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "A propensity score compresses what you measured, not what you didn't.", "mech": "Matching on it balances the observed covariates. Hidden drivers like an internal AI mandate stay unbalanced.", "breaks": "Lagged outcomes help as proxies, but the 'no hidden confounders' assumption remains.", "contrast": "Only randomization balances the unobserved too.", "details": "The propensity score is a balancing score for the covariates in the model (Rosenbaum & Rubin 1983). Conditioning on it balances observed X in expectation. Unobserved confounders such as an internal AI mandate at the customer, or an engineering leader's enthusiasm, stay unbalanced unless they're captured by X (lagged outcomes help, which is why we include them). Identification still rests on conditional ignorability.", "why": "PS only balances observed covariates", "flaws": ["Propensity scores balance only observed traits", "Propensity matching removes the need for overlap", "Propensity matching estimates the ATE by default", "Lagged credits can't go into a propensity model"]}, {"id": "ci-05", "sub": "Matching methods", "difficulty": "Hard", "title": "What GenMatch optimizes", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Explain GenMatch (Diamond & Sekhon 2013; R package `Matching`).", "ai": "GenMatch generalizes Mahalanobis distance matching by adding a weight for each covariate (it can include the propensity score as a covariate). A **genetic algorithm** searches over those weights. For each candidate it runs the matching and checks covariate balance, by default minimizing the largest imbalance across covariates using p-values from t-tests and KS tests. The weights that give the best balance are then used in `Match()`.", "verdict": "correct", "fix": "—", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "Build a look-alike control group: non-adopters who looked just like the adopters before adoption. GenMatch tunes the definition of 'look-alike' until the groups look most alike.", "mech": "A genetic algorithm tries different weights for each covariate in the distance, runs the matching, and keeps the weights that give the best balance.", "breaks": "Targets what you actually need (balance), not a propensity model. Doesn't touch unobserved confounders.", "contrast": "Plain Mahalanobis matching uses fixed weights.", "details": "That's correct. GenMatch tries to optimize balance directly instead of hoping a propensity model is correctly specified. It's an algorithm for finding good matches, not a different identification strategy, so ignorability is still required.", "why": "A genetic algorithm tries different weights for each covariate in the distance, runs the matching, and keeps the weights that give the best balance."}, {"id": "ci-06", "sub": "Matching methods", "difficulty": "Hard", "title": "Does GenMatch look at Y?", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. A teammate tunes GenMatch's `BalanceMatrix` and `fit.func`, and adds the post-period credit outcome to the balance matrix \"so matches are better predictors of credits.\"", "ai": "Good idea. GenMatch finds the weights that best predict the outcome, so including post-period credits improves the estimate's precision.", "verdict": "wrong", "bug": "Matching must be outcome-blind; post-period Y in balance = cheating", "fix": "BalanceMatrix = pre-treatment covariates only (incl. lagged credits, interactions/squared terms); look at Y only after the matched set is frozen.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Design the experiment before you look at the results.", "mech": "Putting post-period credits in the balance matrix forces outcomes to match, which pushes the effect toward 0.", "breaks": "Matching must be outcome-blind. Pre-period credits are fine.", "contrast": "Lagged (pre-period) credits are exactly what you should include.", "details": "GenMatch optimizes **covariate balance**, not outcome prediction, and the design stage should never see post-treatment outcomes (Rubin's design-then-analyze principle). Balancing on post-period credits forces adopters and controls to have similar outcomes, which pushes the estimate toward 0 and makes the analysis open to specification searching. Pre-period credits (lags) are fine and encouraged.", "why": "Matching must be outcome-blind; post-period Y in balance = cheating", "flaws": ["Post-period Y makes matching outcome-aware", "fit.func should optimize outcome fit instead", "Post-period credits are fine if they're lagged", "BalanceMatrix can't take more than 10 columns"]}, {"id": "ci-07", "sub": "Balance diagnostics", "difficulty": "Easy", "title": "Standardized mean difference", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. After matching, mean pre-period credits are 1,050 (adopters) vs 1,000 (controls). SDs are 400 and 380. What's the SMD, and is that acceptable?", "ai": "$$\\text{SMD} = \\frac{1050 - 1000}{\\sqrt{(400^2 + 380^2)/2}} = \\frac{50}{390.1} \\approx 0.128$$ That's above the common 0.1 rule of thumb, so lagged credits aren't quite balanced yet. Refine the matching (calipers, more weight on that covariate) before estimating.", "verdict": "correct", "fix": "SMD ≈ 0.128", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "SMD measures the gap in standard-deviation units, so it's comparable across variables.", "mech": "A 50-credit gap on a spread of about 390 is about 0.13 SD, just over the usual 0.1 bar.", "breaks": "It doesn't depend on sample size, unlike a p-value.", "contrast": "Below 0.1 is commonly considered balanced (on means).", "details": "That's correct. The SMD is scale-free and doesn't depend on n, unlike a t-test. Common thresholds are 0.1 (strict) and 0.25 (lenient). Also check variance ratios and KS statistics.", "why": "A 50-credit gap on a spread of about 390 is about 0.13 SD, just over the usual 0.1 bar."}, {"id": "ci-08", "sub": "Balance diagnostics", "difficulty": "Hard", "title": "Balance via p-values", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. After matching, the AI runs t-tests on every covariate between adopters and matched controls.", "ai": "All p-values are above 0.05, so the groups are balanced and we can proceed. With p > 0.05 there's no significant difference, which is the definition of balance.", "verdict": "wrong", "bug": "Balance is a sample property; p-values depend on n", "fix": "Report SMD (<0.1), variance ratios (~0.5–2), KS/eCDF stats, and Love plots before vs after matching.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Balance is a property of this sample, not a hypothesis about a population.", "mech": "p-values rise as you throw away units, so balance can 'improve' while the gaps get worse.", "breaks": "Judge balance by SMD, variance ratios, and KS.", "contrast": "GenMatch uses p-values only as an internal search score.", "details": "Balance describes the matched sample, not a population hypothesis (Imai, King & Stuart 2008). p-values grow when you discard units, so you can 'improve' balance by shrinking the sample while the actual mean gaps get worse. Judge balance with SMDs, variance ratios, and eCDF/KS distances. GenMatch uses p-values internally only as an optimization loss across matchings at a fixed n.", "why": "Balance is a sample property; p-values depend on n", "flaws": ["p-values track n, not the size of imbalance", "p-values should be below 0.05 for balance", "Balance t-tests need a Bonferroni correction", "t-tests need at least 5,000 pairs to be valid"]}, {"id": "ci-09", "sub": "Balance diagnostics", "difficulty": "Medium", "title": "Means match, distributions don't", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. After matching, mean lagged credits are identical (SMD = 0.00). Adopters' credits are concentrated at 800–1,200, while the matched controls are a mix of very small and very large accounts.", "ai": "SMD is 0, so lagged credits are perfectly balanced and the comparison is valid.", "verdict": "wrong", "bug": "Mean balance ≠ distributional balance", "fix": "Also check variance ratio, KS / eCDF max difference, and QQ plots; balance higher moments (squares, interactions) or use calipers.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Same average height doesn't mean same team. One could be all medium, the other giants and toddlers.", "mech": "Equal means can hide very different spreads and shapes.", "breaks": "If the outcome reacts nonlinearly, that bias matters. Check variance ratios and KS too.", "contrast": "With variance ratio ≈ 1 and a small KS, the distributions are similar.", "details": "Equal means can hide very different distributions. Here the variance ratio is far from 1 and the KS statistic would be large. If credits affect the outcome non-linearly (e.g. big accounts grow differently), the estimate is biased. That's why GenMatch checks KS tests as well as mean tests.", "why": "Mean balance ≠ distributional balance", "evis": "<figure class=\"vis\"><svg viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"Same mean (SMD = 0), completely different shapes\" class=\"chart\"><path class=\"ax\" d=\"M30,10 L30,145 L330,145\"/><text class=\"tx\" x=\"330\" y=\"162\" text-anchor=\"end\">lagged credits</text><text class=\"tx\" x=\"34\" y=\"14\"></text><path class=\"ln\" d=\"M30.0,145.0 L34.9,145.0 L39.8,145.0 L44.8,145.0 L49.7,145.0 L54.6,145.0 L59.5,145.0 L64.4,145.0 L69.3,145.0 L74.2,145.0 L79.2,145.0 L84.1,145.0 L89.0,145.0 L93.9,145.0 L98.8,144.9 L103.8,144.8 L108.7,144.6 L113.6,144.1 L118.5,143.1 L123.4,141.4 L128.3,138.4 L133.2,133.7 L138.2,126.7 L143.1,116.9 L148.0,104.4 L152.9,89.6 L157.8,73.5 L162.8,57.8 L167.7,44.6 L172.6,35.6 L177.5,32.5 L182.4,35.6 L187.3,44.6 L192.2,57.8 L197.2,73.5 L202.1,89.6 L207.0,104.4 L211.9,116.9 L216.8,126.7 L221.8,133.7 L226.7,138.4 L231.6,141.4 L236.5,143.1 L241.4,144.1 L246.3,144.6 L251.2,144.8 L256.2,144.9 L261.1,145.0 L266.0,145.0 L270.9,145.0 L275.8,145.0 L280.8,145.0 L285.7,145.0 L290.6,145.0 L295.5,145.0 L300.4,145.0 L305.3,145.0 L310.2,145.0 L315.2,145.0 L320.1,145.0 L325.0,145.0\"/><path class=\"ln mut\" d=\"M30.0,138.1 L34.9,133.8 L39.8,127.9 L44.8,120.2 L49.7,111.2 L54.6,101.3 L59.5,91.7 L64.4,83.6 L69.3,78.2 L74.2,76.2 L79.2,78.2 L84.1,83.6 L89.0,91.7 L93.9,101.3 L98.8,111.2 L103.8,120.2 L108.7,127.9 L113.6,133.8 L118.5,138.1 L123.4,141.0 L128.3,142.8 L133.2,143.8 L138.2,144.4 L143.1,144.7 L148.0,144.9 L152.9,145.0 L157.8,145.0 L162.8,145.0 L167.7,145.0 L172.6,145.0 L177.5,145.0 L182.4,145.0 L187.3,145.0 L192.2,145.0 L197.2,145.0 L202.1,145.0 L207.0,144.9 L211.9,144.7 L216.8,144.4 L221.8,143.8 L226.7,142.8 L231.6,141.0 L236.5,138.1 L241.4,133.8 L246.3,127.9 L251.2,120.2 L256.2,111.2 L261.1,101.3 L266.0,91.7 L270.9,83.6 L275.8,78.2 L280.8,76.2 L285.7,78.2 L290.6,83.6 L295.5,91.7 L300.4,101.3 L305.3,111.2 L310.2,120.2 L315.2,127.9 L320.1,133.8 L325.0,138.1\"/><text class=\"tx g\" x=\"177.5\" y=\"26.5\" text-anchor=\"middle\">adopters</text><text class=\"tx\" x=\"74.25\" y=\"70.25\" text-anchor=\"middle\">controls</text><text class=\"tx\" x=\"280.75\" y=\"70.25\" text-anchor=\"middle\">controls</text></svg><figcaption>Same mean (SMD = 0), completely different shapes</figcaption></figure>", "flaws": ["Equal means can hide very different spreads", "SMD of 0.00 suggests the matching overfit", "KS tests are too strict for skewed credits", "Means are all that matter for any outcome"]}, {"id": "ci-10", "sub": "Common support", "difficulty": "Medium", "title": "Trimming the giants", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. The 40 largest adopters have no comparable non-adopters, so the AI drops them (common-support trimming) and reports \"CodePilot's ATT across all adopters = +180 credits.\"", "ai": "Trimming units off support is standard, and the result is still the ATT for all adopters.", "verdict": "wrong", "bug": "Trimming changes the estimand", "fix": "Report it as the ATT for on-support adopters (n = 1,160), describe the 40 excluded, and optionally bound or model them separately.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Who you drop changes who you're talking about.", "mech": "Trimming adopters without look-alikes changes the estimand to 'adopters with comparable controls.'", "breaks": "Often wise. Just name it.", "contrast": "Trimming controls (not treated) doesn't change the ATT estimand.", "details": "Trimming is often wise, since extrapolating to unmatched giants relies on modeling. But the estimate becomes the ATT for adopters **within common support**, and the excluded 40 might have the largest effects. Say so explicitly and describe who was dropped.", "why": "Trimming changes the estimand", "flaws": ["Dropping 40 giants changes who the ATT is for", "Trimming always reduces bias and variance", "Trimming affects only the SE, not the estimate", "Should trim controls instead of adopters"]}, {"id": "ci-11", "sub": "Lagged outcomes", "difficulty": "Medium", "title": "Why match on lagged credits?", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Why does the design match on each account's monthly credits for the 6 months before adoption (a \"lagged control\")?", "ai": "Pre-period outcomes summarize many hard-to-measure factors like workload, team size, and growth trajectory that also drive post-period credits. Matching on the trajectory (levels **and** trend), not just one month, makes it more plausible that matched controls are what adopters would have looked like without CodePilot. It also lets us check pre-period fit directly, like a placebo test.", "verdict": "correct", "fix": "—", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "An account's past credit history is its fingerprint.", "mech": "Pre-period trajectories summarize hard-to-measure drivers (workload, growth), so matching on them finds real look-alikes.", "breaks": "Breaks if something new happens right at adoption, like a hiring push.", "contrast": "Matching only on firmographics misses these dynamics.", "details": "That's correct. Lagged outcomes are often the strongest confounder proxies. It's the same idea behind synthetic control and the case for conditioning on pre-trends. They don't fix confounders that only show up at adoption time (e.g. a new hiring push).", "why": "Pre-period trajectories summarize hard-to-measure drivers (workload, growth), so matching on them finds real look-alikes.", "evis": "<figure class=\"vis\"><pre class=\"mermaid\">flowchart TD\n  U[Hidden factors: workload, team size, growth] --> L[Credits in the 6 months before]\n  U --> D[Adopts CodePilot]\n  U --> Y[Credits after]\n  D --> Y</pre><figcaption>Lagged credits act as a proxy for the hidden factors</figcaption></figure>"}, {"id": "ci-12", "sub": "Regression to the mean", "difficulty": "Medium", "title": "Before/after on adopters only", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Many accounts adopted CodePilot right after a usage spike. Average adopter credits were 1,500 in the month before adoption and 1,350 three months later.", "ai": "Credits **fell 10%** after adoption, so CodePilot makes engineers more efficient and cuts consumption.", "verdict": "wrong", "bug": "Regression to the mean + no control group", "fix": "Compare to controls matched on the full pre-period trajectory (incl. the spike), or DiD with an event-study plot.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "A spike is a sneeze. It passes whether or not you take medicine.", "mech": "Accounts adopt after a spike, which fades anyway, so before/after shows a fake drop.", "breaks": "You need a control group with similar spikes.", "contrast": "Matching on the full pre-period trajectory handles it.", "details": "Accounts chosen right after a spike will tend to drift back toward their usual level even if nothing happens (regression to the mean). Seasonality and other trends are also uncontrolled. Without matched controls who had similar spikes, the drop can't be attributed to CodePilot.", "why": "Regression to the mean + no control group", "flaws": ["Post-spike dip is mean reversion; no control", "Before/after should compare medians, not means", "Seasonality is the only issue to adjust for", "A 10% drop is too small to be meaningful"]}, {"id": "ci-13", "sub": "Regression to the mean", "difficulty": "Medium", "title": "Selected on a spike", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Each account's monthly credits = stable account level + independent monthly noise (equal variances). Accounts are chosen because last month was in the top 10%. Nobody gets any treatment. What happens next month?", "ai": "On average, next month's credits come back down toward the mean. They stay above the overall average (since the stable level is higher too), but noticeably below the selection month. With equal variances, roughly half of the selection-month excess disappears.", "verdict": "correct", "fix": "$E[\\text{next} - \\text{mean} \\mid \\text{selected}] \\approx 0.5 \\times (\\text{selection month} - \\text{mean})$", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "Extreme months are partly luck, and luck doesn't repeat.", "mech": "Selecting on a high month picks accounts with high luck, which reverts. About half the excess fades when luck and level vary equally.", "breaks": "The more reliable the measure, the less it reverts.", "contrast": "Selecting on a long-run average reverts much less.", "details": "That's correct. The expected next value is shrunk by the reliability, var(level)/var(total) = 0.5. A simulation shows about half of the excess goes away.", "why": "Selecting on a high month picks accounts with high luck, which reverts.", "evis": "<figure class=\"vis\"><svg viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"Selected on a spike, the next month falls about halfway back\" class=\"chart\"><path class=\"ax\" d=\"M30,10 L30,145 L330,145\"/><text class=\"tx\" x=\"330\" y=\"162\" text-anchor=\"end\">month</text><text class=\"tx\" x=\"34\" y=\"14\">credits</text><path class=\"ax2\" d=\"M30,95.0 L330,95.0\"/><text class=\"tx\" x=\"326\" y=\"91.0\" text-anchor=\"end\">overall mean</text><path class=\"ln\" d=\"M74.2,88.8 L148.0,85.0 L221.8,26.2 L295.5,60.0\"/><circle class=\"dot\" cx=\"221.75\" cy=\"26.25\" r=\"4\"/><circle class=\"dot\" cx=\"295.5\" cy=\"60.0\" r=\"4\"/><text class=\"tx\" x=\"221.75\" y=\"18.25\" text-anchor=\"middle\">selected spike</text><text class=\"tx\" x=\"295.5\" y=\"80.0\" text-anchor=\"middle\">next month</text></svg><figcaption>Selected on a spike, the next month falls about halfway back</figcaption></figure>"}, {"id": "ci-14", "sub": "Difference-in-differences", "difficulty": "Easy", "title": "DiD arithmetic", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Matched adopters: 1,000 → 1,300 credits (pre → post). Matched controls: 980 → 1,180. What's the DiD estimate?", "ai": "$$(1300 - 1000) - (1180 - 980) = 300 - 200 = +100$$ **+100 credits/month**, assuming parallel trends.", "verdict": "correct", "fix": "+100", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "Subtract the control group's change to strip out what would have happened anyway.", "mech": "Adopters' change minus the controls' change leaves the effect.", "breaks": "Relies on parallel trends.", "contrast": "If the controls didn't change at all, DiD equals the simple before/after.", "details": "That's correct. DiD subtracts the control group's change to remove common time shocks and fixed level differences.", "why": "Adopters' change minus the controls' change leaves the effect.", "vis": "| Group | Pre | Post | Change |\n|---|---:|---:|---:|\n| Matched adopters | 1,000 | 1,300 | +300 |\n| Matched controls | 980 | 1,180 | +200 |"}, {"id": "ci-15", "sub": "Difference-in-differences", "difficulty": "Medium", "title": "Proving parallel trends", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. The AI runs an event-study regression and finds pre-period coefficients near zero and not significant.", "ai": "This proves the parallel trends assumption holds, so the DiD estimate is unbiased.", "verdict": "wrong", "bug": "Pre-trends can't verify post-period counterfactual trends", "fix": "'Pre-trends are consistent with parallel trends' + power/sensitivity analysis (HonestDiD bounds).", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Parallel trends is a claim about a future you never see.", "mech": "Flat pre-trends are encouraging, but a shock at adoption time can still break the assumption.", "breaks": "Pre-tests are often underpowered. Add sensitivity bounds.", "contrast": "A big pre-trend is a red flag; a flat one isn't a guarantee.", "details": "Parallel trends is about the **post-period counterfactual**, which you never see. Flat pre-trends are supportive but don't prove it: a shock at adoption time could break it, and pre-trend tests are often underpowered (Roth 2022). Conditioning on passing a pre-test can even add bias. Report the test along with a sensitivity analysis (e.g. Rambachan & Roth's honest DiD).", "why": "Pre-trends can't verify post-period counterfactual trends", "flaws": ["Flat pre-trends can't prove post-period trends", "The pre-trend test needs at least 12 periods", "Should test a placebo outcome instead of leads", "Event studies can't include pre-period leads"]}, {"id": "ci-16", "sub": "Staggered adoption", "difficulty": "Hard", "title": "TWFE with staggered adoption", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Accounts adopted CodePilot in different months from April to September. The AI runs `credits ~ adopted + account FE + month FE` (two-way fixed effects).", "ai": "TWFE handles staggered timing automatically. The `adopted` coefficient is a clean average treatment effect on the treated.", "verdict": "wrong", "bug": "TWFE uses already-treated units as controls; negative weights", "fix": "Use heterogeneity-robust estimators (Callaway & Sant'Anna 2021, Sun & Abraham 2021, imputation à la Borusyak et al.), with never- or not-yet-treated controls.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "TWFE quietly uses already-treated accounts as controls.", "mech": "If effects grow over time, those 'controls' are moving because of their own treatment, and the subtraction goes wrong.", "breaks": "The estimate can even flip sign. Use modern staggered estimators.", "contrast": "With one adoption date and constant effects, TWFE is fine.", "details": "With staggered timing and effects that vary or grow over time, the TWFE coefficient is a weighted average of all 2×2 DiDs, including comparisons that use **already-treated** accounts as controls. Some weights can be negative, so the estimate can even have the wrong sign (Goodman-Bacon 2021, de Chaisemartin & D'Haultfœuille 2020).", "why": "TWFE uses already-treated units as controls; negative weights", "evis": "| 2×2 comparison | Control group used | Weight can be |\n|---|---|---|\n| Early vs never adopters | never treated | positive |\n| Late vs never adopters | never treated | positive |\n| Late vs early (already treated) | **already treated** | **negative** |", "flaws": ["TWFE uses early adopters as controls for late", "Needs account × month interaction fixed effects", "Standard errors should be clustered by month", "Staggered timing only affects the standard error"]}, {"id": "ci-17", "sub": "Staggered adoption", "difficulty": "Hard", "title": "A better staggered design", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. How should you estimate effects with staggered adoption months?", "ai": "Group adopters into cohorts by adoption month. For each cohort, estimate group-time ATTs against never-treated or not-yet-treated accounts (Callaway & Sant'Anna), and then aggregate into an event-study curve (effect by months since adoption) and an overall ATT. For matching, match each adopter on lags measured *relative to its own adoption month*, using controls who haven't adopted by then.", "verdict": "correct", "fix": "—", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "Line every adopter up on its own adoption day, and compare only with accounts that haven't adopted yet.", "mech": "Estimate effects cohort by cohort with clean controls, then average.", "breaks": "Avoids forbidden comparisons. Needs enough not-yet-treated accounts.", "contrast": "Never-treated controls work too if they're comparable.", "details": "That's correct. Lining each adopter up on its own adoption date, with clean controls, avoids the TWFE 'forbidden comparisons'.", "why": "Estimate effects cohort by cohort with clean controls, then average."}, {"id": "ci-18", "sub": "Synthetic control", "difficulty": "Hard", "title": "When synthetic control fits", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. One giant strategic customer (Orion Corp, fictional) adopted CodePilot company-wide. Leadership asks what it did to Orion's credits.", "ai": "Use synthetic control. Build a weighted combination of non-adopting accounts, with non-negative weights that sum to 1, chosen so the combination tracks Orion's pre-period credits closely. The gap after adoption is the effect estimate. Check pre-period fit, run placebo (in-space) tests by re-running the method on each donor, and compare Orion's post/pre RMSPE ratio with the placebo distribution.", "verdict": "correct", "fix": "—", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "Build a Frankenstein twin from pieces of other accounts.", "mech": "A weighted blend of non-adopters tracks Orion's history. After adoption, the gap is the effect.", "breaks": "Great for one or a few treated units with a long pre-period. Breaks with poor pre-fit.", "contrast": "For thousands of adopters, matching or DiD is the better fit.", "details": "That's correct (Abadie, Diamond & Hainmueller 2010, Mixtape ch. 10). It suits one or a few treated units with long pre-periods. Convex weights avoid extrapolation, and inference comes from placebos rather than standard errors.", "why": "A weighted blend of non-adopters tracks Orion's history."}, {"id": "ci-19", "sub": "Post-treatment bias", "difficulty": "Medium", "title": "Matching on queries run", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. To \"control for activity,\" the AI matches on each account's number of queries **in the post-adoption quarter** along with pre-period covariates.", "ai": "More covariates means better matching. Query volume strongly predicts credits, so adding it reduces noise and bias.", "verdict": "wrong", "bug": "Conditioning on a mediator (post-treatment variable)", "fix": "Match on pre-adoption query volume instead; analyze queries as a mediator/secondary outcome if needed.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Don't control for what the treatment changes.", "mech": "Post-period queries are part of how CodePilot raises credits, so matching on them erases the effect.", "breaks": "Only match on things fixed before adoption.", "contrast": "Pre-period query volume is a good covariate.", "details": "Post-period queries are likely **caused by** CodePilot (more generated code → more queries → more credits). Matching on it blocks the mediating path and can open collider paths, which biases the total effect, typically toward 0. Only pre-treatment covariates belong in the matching set.", "why": "Conditioning on a mediator (post-treatment variable)", "vis": "<figure class=\"vis\"><pre class=\"mermaid\">flowchart TD\n  X[Pre-period covariates] --> D[Adopts CodePilot]\n  X --> Y[Credits]\n  D --> Q[Post-period queries]\n  Q --> Y\n  D -. direct .-> Y</pre><figcaption>Post-period queries sit downstream of adoption.</figcaption></figure>", "flaws": ["Post-period queries are a mediator of adoption", "Should also match on post-period credits", "Matching on queries only reduces variance", "Query counts need log scaling before matching"]}, {"id": "ci-20", "sub": "SUTVA & interference", "difficulty": "Medium", "title": "Spillovers within an org", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Some customer orgs have several accounts (dev, prod, analytics), and only some of them adopted CodePilot. The AI uses non-adopting accounts in the **same org** as controls.", "ai": "That's risky because it violates SUTVA. Code written with CodePilot in the dev account may run in the org's prod account, and teams share practices, so 'control' accounts are partly treated. That usually biases the estimate toward zero. Define treatment at the org level, or pick controls from orgs with no adopters.", "verdict": "correct", "fix": "—", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "If the 'control' account shares a kitchen with the treated one, it gets some of the food.", "mech": "Same-org controls get spillover, so the gap shrinks toward 0.", "breaks": "Define treatment at the level where spillover happens.", "contrast": "Controls from untouched orgs are clean.", "details": "That's correct. SUTVA requires no interference between units. Clustering the treatment definition at the level where spillovers happen is the standard fix.", "why": "Same-org controls get spillover, so the gap shrinks toward 0."}, {"id": "ci-21", "sub": "Sensitivity analysis", "difficulty": "Hard", "title": "Interpreting Rosenbaum's Γ", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. A Rosenbaum sensitivity analysis on the matched pairs finds the result stays significant up to Γ = 2.", "ai": "Γ = 2 means the effect is **twice as large** as the estimate, i.e. CodePilot doubles credits.", "verdict": "wrong", "bug": "Γ is about hidden-bias odds, not effect size", "fix": "'Significance holds unless an unobserved factor changes adoption odds within pairs by more than 2×.' (rbounds / sensitivitymv in R)", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Γ is how big a hidden thumb on the scale would have to be to overturn the result.", "mech": "Γ = 2 means: even if hidden factors doubled adoption odds within pairs, the conclusion holds.", "breaks": "It's about robustness, not effect size.", "contrast": "Γ = 1 means no hidden bias.", "details": "$\\Gamma$ bounds how much an unobserved confounder could change the odds of treatment between two matched units that look the same on X. $\\Gamma = 2$ means the conclusion holds even if hidden bias made one unit in a pair up to 2× as likely to adopt. Larger $\\Gamma$ = more robust conclusion. It says nothing about the size of the effect.", "why": "Γ is about hidden-bias odds, not effect size", "flaws": ["Γ is hidden-bias odds, not the effect size", "Γ measures imbalance left after matching", "Γ = 2 means the p-value is twice as large", "Γ = 2 means half the effect is confounded"]}, {"id": "ci-22", "sub": "Sensitivity analysis", "difficulty": "Hard", "title": "E-value", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. The matched analysis finds adopters are 1.5× as likely (risk ratio) to move to a higher credit tier. What's the E-value for the point estimate?", "ai": "$$E = RR + \\sqrt{RR\\,(RR - 1)} = 1.5 + \\sqrt{0.75} \\approx 2.37$$ An unmeasured confounder would need a risk-ratio association of at least 2.37 with **both** adoption and tier upgrade (beyond the measured covariates) to fully explain away the effect.", "verdict": "correct", "fix": "≈ 2.37", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "The E-value is the strength a hidden confounder would need to explain everything away.", "mech": "For RR = 1.5, a confounder would need associations of about 2.4 with both adoption and the outcome.", "breaks": "It quantifies fragility. It doesn't prove anything.", "contrast": "Report it for the confidence limit too.", "details": "That's correct (VanderWeele & Ding 2017). Also report the E-value for the confidence limit closest to 1.", "why": "For RR = 1.5, a confounder would need associations of about 2.4 with both adoption and the outcome."}, {"id": "ci-23", "sub": "Inference after matching", "difficulty": "Hard", "title": "Standard errors after matching", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. After 1:1 nearest-neighbor matching **with replacement** (some controls used many times), the AI computes the SE by bootstrapping accounts and re-running the matching each time.", "ai": "Bootstrapping the whole matching procedure is the gold standard and gives valid standard errors for any matching estimator.", "verdict": "wrong", "bug": "The bootstrap is invalid for NN matching with replacement", "fix": "Report Abadie–Imbens SEs (Match() default), optionally with bias adjustment (BiasAdjust=TRUE).", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Resampling look-alikes reshuffles who is whose twin in ways real sampling never would.", "mech": "Nearest-neighbor matching jumps abruptly as data changes, and that breaks the bootstrap's logic.", "breaks": "Use Abadie–Imbens SEs.", "contrast": "Smooth estimators (weighting) can be bootstrapped.", "details": "Abadie & Imbens (2008) show the standard bootstrap is generally inconsistent for nearest-neighbor matching estimators with a fixed number of matches, because matching is non-smooth. Use the Abadie–Imbens (2006) analytic variance, which `Matching::Match` reports as 'AI SE', or a wild/weighted bootstrap built for matching, or regression on the matched sample with cluster-robust SEs (for matching without replacement).", "why": "The bootstrap is invalid for NN matching with replacement", "flaws": ["Bootstrap fails for NN matching w/ replacement", "SE should come from a simple paired t-test", "Matching estimators have no sampling variance", "Bootstrap needs 10,000 draws to be valid here"]}, {"id": "ci-24", "sub": "Matching methods", "difficulty": "Medium", "title": "With vs without replacement", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. What's the trade-off of matching controls **with replacement**?", "ai": "With replacement, each adopter gets its closest control even if another adopter already used it. Match quality improves, so bias goes down, but variance goes up because fewer distinct controls are used. Analyses must use the frequency weights, and the SEs must account for reuse.", "verdict": "correct", "fix": "—", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "Letting a great twin serve several adopters improves the matches but puts more weight on that one account.", "mech": "Reuse lowers bias and raises variance, so you need weights and the right SEs.", "breaks": "Most helpful when good controls are scarce.", "contrast": "Without replacement, you get worse matches but more independent ones.", "details": "That's correct (Stuart 2010). It helps most when there are few good controls for some treated units.", "why": "Reuse lowers bias and raises variance, so you need weights and the right SEs."}, {"id": "ci-25", "sub": "Lagged outcomes", "difficulty": "Hard", "title": "Matching + DiD: always safer?", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. The AI proposes matching on pre-period credit **levels**, then running DiD on the matched sample.", "ai": "Matching on pre-period levels before DiD can only reduce bias. It removes level differences and keeps everything DiD already handles, so it's always at least as good as plain DiD.", "verdict": "wrong", "bug": "Matching on pre-period levels can induce regression-to-the-mean bias in DiD", "fix": "Matching+DiD is not automatically safer; reason about the selection mechanism, use multiple lags/trajectory, and run placebo-period checks.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "Matching on noisy levels can pick controls who were having an unusual month.", "mech": "If the groups have permanently different levels, matched controls revert toward their own group's mean, creating a fake effect.", "breaks": "Matching on lags and DiD tend to bracket the truth. Run both.", "contrast": "If selection is driven by temporary spikes, matching on lags is the better choice.", "details": "If adopters and non-adopters come from populations with different long-run means, matching on noisy pre-period levels picks controls who happened to be unusually high or low. Those controls then regress toward *their* group's mean after the cutoff, which creates a fake DiD effect (Daw & Hatfield 2018). Matching helps when selection really depends on the pre-period levels and hurts when it doesn't. Match on several lags or trends, check post-period placebo windows, and compare with plain DiD.", "why": "Matching on pre-period levels can induce regression-to-the-mean bias in DiD", "flaws": ["Matching on levels can induce mean reversion", "DiD no longer needs parallel trends after it", "Matching on levels removes all mean reversion", "Should match on post-period levels instead"]}, {"id": "ci-26", "sub": "Matching methods", "difficulty": "Medium", "title": "Does GenMatch fix hidden confounding?", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. After GenMatch reaches excellent balance on 30 covariates, the AI concludes:", "ai": "GenMatch optimized balance, so confounding is solved, including anything we didn't measure, like each account's internal AI mandate.", "verdict": "wrong", "bug": "Balance only on observed covariates", "fix": "Say: 'balanced on 30 observed covariates; remaining risk = unmeasured confounders' and run a sensitivity analysis plus placebo outcomes.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "A perfect match on the things you measured says nothing about what you didn't.", "mech": "GenMatch balances the covariates you gave it, and nothing else.", "breaks": "Hidden confounders remain. Run sensitivity analyses.", "contrast": "Randomization is the only thing that balances the unmeasured.", "details": "", "why": "Balance only on observed covariates", "flaws": ["Balance covers only the 30 measured traits", "Genetic search balances unobservables too", "Adding the propensity score fixes hidden bias", "30 covariates is too many for GenMatch to fit"]}, {"id": "ci-27", "sub": "Regression to the mean", "difficulty": "Hard", "title": "Spiky adopters and naive DiD", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Accounts tend to adopt CodePilot right after a temporary usage spike. CodePilot has **no** real effect. The AI predicts what a simple DiD (adopters vs all non-adopters, last pre-month vs post) will show.", "ai": "It will show a spurious **negative** effect. The adopters' pre-period value is inflated by the spike, which fades on its own afterward, while the controls had no spike to fade. Matching adopters to controls with similar recent spikes, or using a longer pre-period baseline, removes most of it.", "verdict": "correct", "fix": "—", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "A spike is a sneeze, and DiD blames the medicine for the sneeze ending.", "mech": "Adopters' pre-period is inflated, so their decline looks like a negative effect.", "breaks": "Match on recent trajectories or use a longer baseline.", "contrast": "If adopters had no spike, DiD wouldn't show this.", "details": "", "why": "Adopters' pre-period is inflated, so their decline looks like a negative effect."}, {"id": "ci-28", "sub": "Sensitivity analysis", "difficulty": "Medium", "title": "E-value of 4 = proof?", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. The matched estimate has an E-value of 4.0. The AI writes in the summary:", "ai": "An E-value of 4 proves the effect of CodePilot is causal.", "verdict": "wrong", "bug": "E-values measure robustness, not proof", "fix": "'Only an unmeasured confounder associated with both adoption and the outcome by a risk ratio ≥ 4 could fully explain this away.' That's a judgment call, not proof.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "A sturdy bridge isn't proof of anything; it's a measure of how much weight it takes to break it.", "mech": "An E-value of 4 says it would take a strong hidden confounder to explain the result away.", "breaks": "Strong confounders do exist. It's a judgment call.", "contrast": "Combine it with placebo tests and domain knowledge.", "details": "", "why": "E-values measure robustness, not proof", "flaws": ["E-values gauge robustness; they don't prove", "An E-value of 4 is the risk-ratio effect size", "E-values only apply to randomized trials", "E-value must exceed 10 to support causality"]}, {"id": "ci-29", "sub": "Inference after matching", "difficulty": "Hard", "title": "Why Abadie–Imbens SEs?", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. Why does `Matching::Match` report Abadie–Imbens standard errors instead of a plain t-test on matched-pair differences?", "ai": "When controls are matched with replacement, one control can stand in for many adopters, so the pair differences aren't independent. Its noise counts several times. The Abadie–Imbens variance accounts for how often each control is reused, and for the uncertainty in the outcomes conditional on covariates. A plain t-test treats the pairs as independent and is usually too optimistic.", "verdict": "correct", "fix": "—", "topic": "Causal inference", "track": "causal", "lang": "text", "bug": "", "model": "A control used five times counts its noise five times.", "mech": "Abadie–Imbens accounts for reuse and for outcome noise given covariates.", "breaks": "Plain t-tests assume independent pairs and come out too optimistic.", "contrast": "Without replacement, pair-level methods are closer to OK.", "details": "", "why": "Abadie–Imbens accounts for reuse and for outcome noise given covariates."}, {"id": "ci-30", "sub": "Matching methods", "difficulty": "Medium", "title": "A propensity model with AUC 0.97", "prompt": "**Scenario:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. About 1,200 of 9,000 customer accounts adopted it in Q2. You want to know whether adoption changes monthly compute credits. The AI is proud that its adoption propensity model reaches AUC 0.97 and says this makes it ideal for matching.", "ai": "A higher AUC means the propensity score is more accurate, so matching on it will remove more bias.", "verdict": "wrong", "bug": "Propensity models are for balance, not prediction", "fix": "Check overlap (propensity histograms by group), trim or restrict to common support, and judge by covariate balance, not AUC.", "topic": "Causal inference", "track": "causal", "lang": "text", "model": "If you can predict adopters perfectly, there are no look-alikes left.", "mech": "A propensity AUC of 0.97 means adopters and non-adopters barely overlap.", "breaks": "The goal is balance and overlap, not prediction accuracy.", "contrast": "A moderate AUC with good overlap is ideal.", "details": "", "why": "Propensity models are for balance, not prediction", "flaws": ["High AUC means weak overlap, not less bias", "A high AUC guarantees good covariate balance", "Propensity AUC should be above 0.99 to work", "Should use a GBM for the propensity model"]}, {"id": "x-ab-01", "topic": "A/B testing", "sub": "Variance", "title": "CTR per pageview, randomized per user", "prompt": "A ranking test randomizes **users** 50/50. The metric is click-through rate. Control: 2.00M pageviews, 80,000 clicks (4.00%). Treatment: 2.02M pageviews, 83,840 clicks (4.15%). About 100k users per arm, and heavy users see hundreds of pages.", "ai": "Treat each pageview as a Bernoulli trial:\n\n$$SE = \\sqrt{\\frac{p_1(1-p_1)}{n_1} + \\frac{p_2(1-p_2)}{n_2}} \\approx 0.0002$$\n\nThe lift of 0.15 pp is about 7.5 SEs, so $p < 10^{-12}$. Ship it.", "verdict": "wrong", "why": "SE computed per pageview when randomization is per user", "flaws": ["SE treats pageviews as independent units", "Unequal pageviews (2.00M vs 2.02M) imply SRM", "A one-sided test should be used for a lift", "Pooled p should be used in the SE formula"], "model": "Your sample size is the number of coins you flipped, not the number of times each coin landed.", "mech": "Users were randomized, so users are the independent units. One heavy user's 500 pageviews share a single taste for clicking, so they move together. Counting them as 500 separate trials makes the noise look far smaller than it is.", "breaks": "The per-pageview formula works only when every view is an independent draw. With clustered views the honest SE is often 2 to 5 times larger. Use the delta method on per-user clicks and views, or a user-level bootstrap.", "contrast": "If the test had randomized each pageview independently, the per-pageview SE would be valid.", "details": "The ratio metric $\\bar{C}/\\bar{V}$ (clicks per user over views per user) has variance from the delta method:\n\n$$\\operatorname{Var}\\left(\\frac{\\bar C}{\\bar V}\\right) \\approx \\frac{1}{n\\,\\mu_V^2}\\left(\\sigma_C^2 - 2r\\,\\sigma_{CV} + r^2\\sigma_V^2\\right),\\quad r=\\mu_C/\\mu_V$$\n\nwhere $n$ is the number of **users**. The design effect is roughly $1 + (m-1)\\rho$, where $m$ is views per user and $\\rho$ is the within-user correlation. With $m=20$ and $\\rho=0.1$ the variance is about 3× larger.", "fix": "Aggregate to one row per user (clicks, views) and use the delta-method SE for the ratio, or bootstrap over users. The result may still be significant, but the z is closer to 3 to 4, not 7.5.", "track": "general", "difficulty": "Expert", "lang": "text", "bug": "SE computed per pageview when randomization is per user"}, {"id": "x-ab-02", "topic": "A/B testing", "sub": "Variance reduction", "title": "CUPED with a convenient covariate", "prompt": "You want a tighter CI on 14-day revenue per user in a checkout test. A teammate suggests CUPED using each user's **number of sessions during the test** as the covariate, since it correlates 0.7 with revenue.", "ai": "Great choice. CUPED's adjustment is\n\n$$Y^{cv} = Y - \\theta\\,(X - \\bar X),\\quad \\theta = \\frac{\\operatorname{Cov}(X,Y)}{\\operatorname{Var}(X)}$$\n\nWith $\\rho = 0.7$, variance drops by $\\rho^2 = 49\\%$, so you need about half the sample. CUPED stays unbiased because $\\theta$ is the same for both arms.", "verdict": "wrong", "why": "The covariate is measured after treatment, so the treatment can move it", "flaws": ["Sessions during the test are post-treatment", "θ must be estimated separately in each arm", "CUPED cuts variance by ρ, not by ρ² as claimed", "CUPED needs a binary covariate to be valid"], "model": "CUPED subtracts the part of Y you could have predicted before the coin flip. Anything measured after the flip might contain the effect itself.", "mech": "If the new checkout makes
