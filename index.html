tures delayed conversion, not just same-session). **Secondary:** % of saved items later purchased, save rate. **Guardrails:** same-session checkout conversion (cannibalization: saving instead of buying now), revenue per user, cart page latency. **Test:** user-level randomization, run ≥ 2 full weeks to capture the delayed-purchase window.", "verdict": "correct", "fix": "—", "lang": "text", "bug": "", "track": "general", "model": "Goal → behavior → metric → guardrail.", "mech": "Pick a primary metric that captures the delayed payoff, and guard against cannibalizing purchases now.", "breaks": "A metric with the wrong time window misses delayed value.", "contrast": "For an instant-gratification feature, a short window is fine.", "details": "It follows goal → primary → secondary → guardrails and picks a primary metric whose time window fits the feature's delayed payoff. It also names the main risk: people saving items instead of buying them now.", "why": "Pick a primary metric that captures the delayed payoff, and guard against cannibalizing purchases now."}, {"id": "pm-04", "topic": "Product & metrics", "sub": "Metric definitions", "difficulty": "Medium", "title": "ARPU this month", "prompt": "This month: 10,000 active users, of whom 1,000 paid. Total revenue \\$50,000. What's ARPU?", "ai": "ARPU = revenue / paying users = \\$50,000 / 1,000 = **\\$50**.", "verdict": "wrong", "bug": "Wrong denominator (that's ARPPU)", "fix": "ARPU = \\$50,000 / 10,000 = **\\$5**. ARPPU = \\$50. Payer conversion = 10%.", "lang": "text", "track": "general", "model": "ARPU spreads revenue over everyone; ARPPU spreads it over payers only.", "mech": "Dividing by payers overstates per-user revenue whenever most users don't pay.", "breaks": "Name the denominator.", "contrast": "ARPPU is the right metric when you're asking how much payers spend.", "details": "ARPU divides by **all** active users, and dividing by paying users gives ARPPU. Mixing them up overstates per-user monetization 10× here.", "why": "Wrong denominator (that's ARPPU)", "vis": "| Count | Value |\n|---|---:|\n| Active users | 10,000 |\n| Paying users | 1,000 |\n| Revenue | \\$50,000 |"}, {"id": "pm-05", "topic": "Product & metrics", "sub": "Case", "difficulty": "Hard", "title": "Measuring cannibalization of a new tier", "prompt": "A streaming service launches a cheaper ad-supported tier. Leadership asks whether it's growing revenue or just cannibalizing the premium tier. How would you measure it? Evaluate the AI.", "ai": "Run a geo or holdout experiment where the ad tier is offered in some markets/users and not others. Measure **total** revenue per eligible user (subscriptions + ads) and net subscriber count, not just ad-tier sign-ups. Decompose: (a) incremental new subs who wouldn't have joined, (b) downgrades from premium (revenue lost = price gap − ad revenue per user), (c) churn changes. Track for several billing cycles, since downgrades and churn lag. If a holdout isn't possible, use a synthetic control on markets or a diff-in-diff around launch, and say plainly that those assumptions are weaker.", "verdict": "correct", "fix": "—", "lang": "text", "bug": "", "track": "general", "model": "Cannibalization is the net change in the whole pie, not just the new slice.", "mech": "Measure total revenue across all eligible users, broken into new customers, downgrades, and churn.", "breaks": "Looking only at the new tier's revenue ignores where it came from.", "contrast": "With no overlap with existing tiers, cannibalization is minimal.", "details": "It measures the net effect on the right denominator (all eligible users), breaks it into acquisition, downgrades, and churn, and offers sensible fallback methods.", "why": "Measure total revenue across all eligible users, broken into new customers, downgrades, and churn."}, {"id": "pm-06", "topic": "Product & metrics", "sub": "Causality", "difficulty": "Hard", "title": "Feature users retain 2× better", "prompt": "Users who created a playlist in week 1 have 2× the 90-day retention of users who didn't. Evaluate the AI's recommendation.", "ai": "Playlist creation doubles retention. We should force every new user to create a playlist during onboarding, which should roughly double our overall retention.", "verdict": "wrong", "bug": "Correlation ≠ causation (selection bias)", "fix": "Treat it as a hypothesis. Test a nudge (e.g. a playlist prompt) with user-level randomization and measure 30/90-day retention for all users in each arm. Meanwhile, control for early engagement in observational analysis (matching or regression) to see how much of the gap is left.", "lang": "text", "track": "general", "model": "Eager users do everything more, so the feature gets credit for their eagerness.", "mech": "Engaged users both make playlists and stay. The feature didn't cause the engagement.", "breaks": "Forcing the behavior changes who does it, and the gap won't carry over. Test it.", "contrast": "A randomized nudge to make playlists would show the causal effect.", "details": "Users who make playlists early were already more engaged, so motivation drives both the playlist and the retention. Forcing it changes who creates playlists, and the 2× gap won't carry over. It may even hurt onboarding completion.", "why": "Correlation ≠ causation (selection bias)"}, {"id": "ml-01", "topic": "ML basics", "sub": "Evaluation", "difficulty": "Easy", "title": "99% accurate fraud model", "prompt": "A fraud model has 99% accuracy on a test set where 1% of transactions are fraud. Evaluate the AI's verdict.", "ai": "99% accuracy is excellent, so the model is ready for production.", "verdict": "wrong", "bug": "Accuracy on imbalanced data", "fix": "Report precision, recall, and PR-AUC (or recall at a fixed false-positive rate), plus the confusion matrix at the chosen threshold. Then set the threshold based on the cost of missed fraud vs false alarms.", "lang": "text", "track": "general", "model": "Always guessing the majority class can look like a genius when the classes are imbalanced.", "mech": "At 1% fraud, predicting 'never fraud' scores 99%.", "breaks": "Use precision/recall or PR-AUC.", "contrast": "With balanced classes, accuracy is meaningful.", "details": "A model that always predicts 'not fraud' also scores 99%. Accuracy tells you nothing at a 1% base rate.", "why": "Accuracy on imbalanced data"}, {"id": "ml-02", "topic": "ML basics", "sub": "Regression", "difficulty": "Medium", "title": "Logistic regression coefficient", "prompt": "In a churn logistic regression, the coefficient on `has_support_ticket` (0/1) is 0.7. Interpret it.", "ai": "Holding other features constant, having a support ticket multiplies the **odds** of churn by $e^{0.7} \\approx$ **2.01**, roughly doubling the odds. That's not the same as doubling the probability, and it's an association, not necessarily causal.", "verdict": "correct", "fix": "Odds ratio ≈ 2.01", "lang": "text", "bug": "", "track": "general", "model": "Logistic coefficients live in log-odds land. Exponentiate to come home.", "mech": "exp(coef) is the multiplicative change in odds per unit of the feature.", "breaks": "Odds aren't probabilities, and association isn't causation.", "contrast": "For rare outcomes, odds ratios approximate risk ratios.", "details": "Coefficients are log-odds, so exponentiate to get an odds ratio. The answer also correctly separates odds from probability and association from causation.", "why": "exp(coef) is the multiplicative change in odds per unit of the feature."}, {"id": "ml-03", "topic": "ML basics", "sub": "Leakage", "difficulty": "Medium", "title": "Churn model with 0.99 AUC", "prompt": "A churn model gets AUC 0.99. Its top features are `days_since_last_login`, `account_closed_date_is_null`, and `num_support_tickets`. The label is 'churned in the next 30 days', and features were pulled from the current warehouse snapshot. Evaluate the AI.", "ai": "AUC 0.99 shows the features are highly predictive. `account_closed_date_is_null` is the strongest signal, so ship it.", "verdict": "wrong", "bug": "Target leakage", "fix": "Build features as of a prediction cutoff date (point-in-time joins), with the label from the 30 days after that cutoff. Drop fields that are filled in by the outcome, and validate on a later time period.", "lang": "text", "track": "general", "model": "If the exam paper includes the answers, a perfect score means nothing.", "mech": "account_closed_date exists because the user churned, so the model is reading the label.", "breaks": "Build features 'as of' prediction time. A suspiciously high AUC is a leakage alarm.", "contrast": "Features captured before the churn window are legit.", "details": "`account_closed_date` is filled in *because* the user churned, so it encodes the label. Pulling features from today's snapshot also leaks post-prediction information (e.g. days_since_last_login measured after the churn window). An AUC that high is a red flag, not a win.", "why": "Target leakage"}, {"id": "ml-04", "topic": "ML basics", "sub": "Evaluation", "difficulty": "Medium", "title": "Precision, recall, F1", "prompt": "Confusion matrix: TP = 80, FP = 20, FN = 40, TN = 860. Compute precision, recall, and F1.", "ai": "$$\\text{Precision} = \\tfrac{80}{80+20} = 0.80 \\qquad \\text{Recall} = \\tfrac{80}{80+40} = 0.667$$ $$F_1 = \\frac{2PR}{P+R} = \\frac{2 \\times 0.8 \\times 0.667}{1.467} \\approx 0.727$$", "verdict": "correct", "fix": "0.80 / 0.667 / 0.727", "lang": "text", "bug": "", "track": "general", "model": "Precision: of the alarms, how many were real? Recall: of the real ones, how many did we catch?", "mech": "F1 balances the two with a harmonic mean, which punishes imbalance.", "breaks": "F1 ignores true negatives and the costs of each error type.", "contrast": "With different error costs, pick the threshold by cost instead.", "details": "All three are correct. Note F1 is the harmonic mean, which is lower than the arithmetic mean (0.733).", "why": "F1 balances the two with a harmonic mean, which punishes imbalance.", "vis": "| | Predicted + | Predicted − |\n|---|---:|---:|\n| **Actual +** | TP = 80 | FN = 40 |\n| **Actual −** | FP = 20 | TN = 860 |"}, {"id": "ml-05", "topic": "ML basics", "sub": "Regression", "difficulty": "Hard", "title": "Insignificant coefficient → drop the feature?", "prompt": "In a linear model for house price, `sqft` and `num_rooms` have correlation 0.95. `num_rooms` has p = 0.4. Evaluate the AI.", "ai": "`num_rooms` isn't significant (p = 0.4), which means room count has no relationship with price. Drop it and tell stakeholders rooms don't matter.", "verdict": "wrong", "bug": "Misreading coefficients under multicollinearity", "fix": "Say 'given sqft, extra rooms add little detectable information'. Check VIFs and a model with num_rooms alone. Pick features based on prediction goals (CV error) or use regularization, not individual p-values.", "lang": "text", "track": "general", "model": "Twins split the credit, so each looks unimportant on its own.", "mech": "With correlated predictors, each coefficient measures the effect holding the other fixed, and the SEs blow up.", "breaks": "The feature can matter a lot alone and still be 'insignificant' next to its twin.", "contrast": "Drop one twin, and the other becomes significant.", "details": "With highly correlated predictors, the standard errors inflate ($\\text{VIF} \\approx 1/(1-0.95^2) \\approx 10$), and each coefficient only measures the effect *holding the other fixed*. num_rooms can be strongly tied to price on its own and still be insignificant next to sqft.", "why": "Misreading coefficients under multicollinearity"}, {"id": "ml-06", "topic": "ML basics", "sub": "Regularization", "difficulty": "Hard", "title": "L1 vs L2", "prompt": "When would you choose L1 (lasso) over L2 (ridge) regularization? Evaluate the AI.", "ai": "L1 penalizes $|\\beta|$, and its corners push some coefficients to exactly zero, so it does feature selection. Pick it when you expect few true signals among many features or need a sparse, interpretable model. L2 penalizes $\\beta^2$, shrinking coefficients smoothly without zeroing them, and handles correlated features better (it spreads weight across them, while lasso picks one somewhat arbitrarily). For many correlated features with some sparsity, elastic net combines both. Standardize features first in every case, since the penalty depends on scale.", "verdict": "correct", "fix": "—", "lang": "text", "bug": "", "track": "general", "model": "L1 is a lasso that pulls coefficients all the way to zero; L2 is a leash that pulls them toward zero.", "mech": "L1's sharp corner at zero makes exact zeros likely. L2 is smooth and only shrinks.", "breaks": "Standardize features first, or the penalty is unfair across scales.", "contrast": "Elastic net blends the two.", "details": "It covers sparsity, behavior with correlated features, elastic net, and the need to standardize. That's a complete senior-level answer.", "why": "L1's sharp corner at zero makes exact zeros likely."}, {"id": "ab-11", "topic": "A/B testing", "sub": "Novelty & duration", "difficulty": "Medium", "title": "Ship after 3 days?", "prompt": "A redesigned home feed shows +6% clicks in its first 3 days (p = 0.001). The AI recommends shipping now.", "ai": "It's highly significant and the effect is large, so ship it. Running longer just wastes time.", "verdict": "wrong", "bug": "Ignores novelty effect and weekly cycles", "fix": "Run ≥ 1–2 full weeks; check the treatment effect over time and for new vs. returning users before deciding.", "track": "general", "lang": "text", "model": "Shiny new things get clicks, and the shine wears off.", "mech": "Early lifts often fade as users get used to the change, and 3 days misses weekly cycles.", "breaks": "Run full weeks and watch whether the effect decays over time.", "contrast": "A change with no visible UI (like faster load) has little novelty effect.", "details": "Early lifts on UI changes are often novelty effects that fade, and 3 days doesn't cover a full weekly cycle. Run at least 1–2 full weeks, plot the effect by day, and compare new vs returning users (or cohort by first exposure) to see whether it decays.", "why": "Ignores novelty effect and weekly cycles"}, {"id": "ab-14", "topic": "A/B testing", "sub": "Interference", "difficulty": "Hard", "title": "Testing a rider discount", "prompt": "A ride-share company wants to test a rider discount that should increase ride requests. The AI's design:", "ai": "User-level randomization would be biased here. Treated riders take more rides and use up shared driver supply, which hurts control riders, so the measured lift is inflated. Use switchback (time-sliced) or geo-cluster randomization so supply effects stay inside each unit, and accept the bigger variance.", "verdict": "correct", "fix": "—", "track": "general", "lang": "text", "bug": "", "model": "In a marketplace, treating one person changes the world for everyone else.", "mech": "Discounted riders use up shared drivers, so control riders get worse service and the gap is inflated.", "breaks": "Randomize in chunks that contain the spillover (time slices or cities).", "contrast": "For a feature with no shared resources, user-level randomization is fine.", "details": "That's correct. Marketplace interference violates SUTVA, and switchbacks or clusters are the standard fix.", "why": "Discounted riders use up shared drivers, so control riders get worse service and the gap is inflated."}, {"id": "ab-16", "topic": "A/B testing", "sub": "Hypothesis tests", "difficulty": "Easy", "title": "Not significant = no effect?", "prompt": "A test of a new checkout button gives p = 0.30, and the 95% CI for lift is [−1.5%, +4.0%].", "ai": "p = 0.30 proves the button has no effect, so we can say it doesn't change conversion.", "verdict": "wrong", "bug": "Absence of evidence ≠ evidence of absence", "fix": "'Inconclusive: effect between −1.5% and +4.0%.' Use equivalence testing to claim no effect.", "track": "general", "lang": "text", "model": "Not finding the keys doesn't prove they aren't in the room.", "mech": "A non-significant result with a wide CI is compatible with both 'nothing' and 'something meaningful.'", "breaks": "To claim 'no meaningful effect,' run an equivalence test against a margin.", "contrast": "A narrow CI tightly around 0 is evidence of no meaningful effect.", "details": "Failing to reject doesn't prove the null. The CI still includes a meaningful +4% lift. To claim 'no meaningful effect,' run an equivalence test (TOST) against a pre-set margin, or get more power.", "why": "Absence of evidence ≠ evidence of absence"}, {"id": "st-11", "topic": "Stats & probability", "sub": "Conditional probability", "difficulty": "Medium", "title": "Monty Hall", "prompt": "You pick door 1 of 3. The host, who knows where the car is, always opens a goat door you didn't pick (door 3) and offers a switch. Should you switch?", "ai": "There are two doors left, so each has a 1/2 chance. Switching doesn't matter.", "verdict": "wrong", "bug": "Ignores host's informed choice", "fix": "Switch: P(win) = 2/3", "track": "general", "lang": "text", "model": "The host isn't random. His door choice carries information.", "mech": "Your first pick is right 1/3 of the time. When it's wrong (2/3), the host is forced to reveal the other goat, so switching wins.", "breaks": "If the host opened a door at random and happened to show a goat, it really would be 50/50.", "contrast": "With 100 doors and 98 opened, the intuition gets obvious.", "details": "Your first pick has a 1/3 chance of being right, and the host's informed reveal moves the remaining 2/3 onto the other closed door. Switching wins **2/3** of the time (simulated).", "why": "Ignores host's informed choice"}, {"id": "st-12", "topic": "Stats & probability", "sub": "Distributions", "difficulty": "Medium", "title": "What the CLT says", "prompt": "Revenue per user is very right-skewed. The AI explains why a t-test on mean revenue with 50,000 users per arm is still OK.", "ai": "By the Central Limit Theorem, with n = 50,000 the **revenue data itself** becomes normally distributed, so the t-test's normality assumption holds.", "verdict": "wrong", "bug": "CLT is about the sampling distribution of the mean, not the data", "fix": "The sample mean is ~normal for large n (finite variance), so the t-test/z-test on means is OK; the raw data stays skewed.", "track": "general", "lang": "text", "model": "The CLT is about the average of many draws, not the draws themselves.", "mech": "Each sample stays skewed, but the sample mean, over repeated experiments, looks bell-shaped.", "breaks": "That's what t-tests rely on. Very heavy tails make it slower to kick in.", "contrast": "A histogram of the raw revenue will never look normal.", "details": "The data stays skewed no matter how big n gets. The CLT says the **sampling distribution of the mean** becomes approximately normal, which is what the t-test needs. With extreme heavy tails (whales), convergence can be slow, so consider capping or winsorizing, or a bootstrap.", "why": "CLT is about the sampling distribution of the mean, not the data"}, {"id": "st-13", "topic": "Stats & probability", "sub": "Correlation", "difficulty": "Medium", "title": "Zero correlation", "prompt": "$X \\sim \\text{Uniform}(-1, 1)$ and $Y = X^2$. The AI computes $\\operatorname{corr}(X, Y)$.", "ai": "corr(X, Y) = 0, so X and Y are **independent**.", "verdict": "wrong", "bug": "Zero correlation ≠ independence", "fix": "Uncorrelated but strongly dependent (Y is a function of X).", "track": "general", "lang": "text", "model": "Correlation is a straight-line detector.", "mech": "$X^2$ is completely determined by $X$, but rises on both sides of 0, so the straight-line fit is flat.", "breaks": "Zero correlation means no linear relationship, not no relationship.", "contrast": "For jointly normal variables, zero correlation does mean independence.", "details": "The correlation is 0 (by symmetry), but Y is completely determined by X. Pearson correlation only measures linear association. It implies independence only in special cases, e.g. jointly Gaussian variables.", "why": "Zero correlation ≠ independence", "vis": "<figure class=\"vis\"><svg viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"Y is fully determined by X, yet symmetric around 0\" class=\"chart\"><path class=\"ax\" d=\"M30,10 L30,145 L330,145\"/><text class=\"tx\" x=\"330\" y=\"162\" text-anchor=\"end\">X<\/text><text class=\"tx\" x=\"34\" y=\"14\">Y = X²<\/text><path class=\"ln\" d=\"M30.0,26.2 L37.4,37.2 L44.8,47.6 L52.1,57.5 L59.5,66.7 L66.9,75.5 L74.2,83.6 L81.6,91.2 L89.0,98.2 L96.4,104.7 L103.8,110.6 L111.1,116.0 L118.5,120.8 L125.9,125.0 L133.2,128.6 L140.6,131.7 L148.0,134.2 L155.4,136.2 L162.8,137.6 L170.1,138.5 L177.5,138.8 L184.9,138.5 L192.2,137.6 L199.6,136.2 L207.0,134.2 L214.4,131.7 L221.8,128.6 L229.1,125.0 L236.5,120.8 L243.9,116.0 L251.2,110.6 L258.6,104.7 L266.0,98.2 L273.4,91.2 L280.8,83.6 L288.1,75.5 L295.5,66.7 L302.9,57.5 L310.2,47.6 L317.6,37.2 L325.0,26.2\"/><path class=\"ax2\" d=\"M177.5,12 L177.5,145\"/><text class=\"tx\" x=\"34\" y=\"160\" text-anchor=\"start\">−1<\/text><text class=\"tx\" x=\"325\" y=\"160\" text-anchor=\"end\">1<\/text><\/svg><figcaption>Y is fully determined by X, yet symmetric around 0<\/figcaption><\/figure>"}, {"id": "st-14", "topic": "Stats & probability", "sub": "Expectation", "difficulty": "Medium", "title": "Expected max of two dice", "prompt": "Roll two fair dice. What's the expected value of the maximum?", "ai": "$P(\\max = k) = \\frac{2k - 1}{36}$, so $$E[\\max] = \\sum_{k=1}^{6} k\\,\\frac{2k-1}{36} = \\frac{161}{36} \\approx 4.47$$", "verdict": "correct", "fix": "$161/36 \\approx 4.47$", "track": "general", "lang": "text", "bug": "", "model": "The max is at most k only if both dice are at most k.", "mech": "$P(\\max \\le k) = (k/6)^2$. Take differences to get $P(\\max = k)$, then average.", "breaks": "The 'CDF first' trick works for any max or min of independent draws.", "contrast": "For the min, use P(min > k) instead.", "details": "That's correct. $P(\\max \\le k) = (k/6)^2$, so $P(\\max = k) = \\frac{k^2 - (k-1)^2}{36}$.", "why": "P(max ≤ k) = (k/6)²."}, {"id": "st-15", "topic": "Stats & probability", "sub": "Distributions", "difficulty": "Easy", "title": "No incidents this hour", "prompt": "Pager incidents arrive as a Poisson process averaging 3 per hour. What's P(zero incidents in the next hour)?", "ai": "$P(0) = e^{-3} \\approx$ **0.050**.", "verdict": "correct", "fix": "≈ 0.0498", "track": "general", "lang": "text", "bug": "", "model": "A Poisson process is a stream of random arrivals with no memory.", "mech": "With an average of 3 per hour, $P(\\text{none}) = e^{-3} \\approx 5\\%$.", "breaks": "It assumes independent arrivals at a constant rate. Incident storms break it.", "contrast": "The wait until the next incident has the same answer, from the exponential view.", "details": "That's correct. Equivalently, the wait until the first event is Exponential(rate 3/hr), and $P(T > 1) = e^{-3}$.", "why": "With an average of 3 per hour, P(none) = e^(−3) ≈ 5%."}, {"id": "st-16", "topic": "Stats & probability", "sub": "Expectation", "difficulty": "Easy", "title": "+50% then −50%", "prompt": "A metric rises 50% one month and falls 50% the next. What's the net change?", "ai": "+50% − 50% = **0%**. The metric is back where it started.", "verdict": "wrong", "bug": "Percent changes compound multiplicatively", "fix": "−25%", "track": "general", "lang": "text", "model": "Percentages multiply. They don't add.", "mech": "+50% then −50% means ×1.5 × 0.5 = 0.75.", "breaks": "Average growth rates with a geometric mean.", "contrast": "−50% then +100% gets you back to where you started.", "details": "1.5 × 0.5 = 0.75, so the net change is **−25%**. Average growth rates over time with a geometric mean, not an arithmetic one.", "why": "Percent changes compound multiplicatively", "evis": "| Step | Multiplier | Value |\n|---|---:|---:|\n| Start | | 100 |\n| +50% | ×1.5 | 150 |\n| −50% | ×0.5 | **75** |"}, {"id": "ml-07", "topic": "ML basics", "sub": "Bias-variance", "difficulty": "Easy", "title": "99% train, 70% validation", "prompt": "A model scores 99% train accuracy and 70% validation accuracy. The AI's next step:", "ai": "The model is underfitting, so add more features and make it more complex.", "verdict": "wrong", "bug": "That's overfitting (high variance), not underfitting", "fix": "Overfitting → regularize / simplify / more data.", "track": "general", "lang": "text", "model": "A student who memorized the practice test aces it, then fails the real one.", "mech": "A big train-validation gap means overfitting (high variance).", "breaks": "Regularize, simplify, add data, or stop early. More complexity makes it worse.", "contrast": "Low train and low validation scores would mean underfitting.", "details": "A big gap between train and validation means high variance. Regularize, simplify, add data, or use early stopping. More complexity makes it worse.", "why": "That's overfitting (high variance), not underfitting", "evis": "<figure class=\"vis\"><svg viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"99% train vs 70% validation sits on the overfitting side\" class=\"chart\"><path class=\"ax\" d=\"M30,10 L30,145 L330,145\"/><text class=\"tx\" x=\"330\" y=\"162\" text-anchor=\"end\">model complexity<\/text><text class=\"tx\" x=\"34\" y=\"14\">error<\/text><path class=\"ln mut\" d=\"M30.0,38.7 L34.9,44.4 L39.8,49.8 L44.8,54.8 L49.7,59.6 L54.6,64.0 L59.5,68.3 L64.4,72.3 L69.3,76.0 L74.2,79.6 L79.2,82.9 L84.1,86.1 L89.0,89.1 L93.9,91.9 L98.8,94.6 L103.8,97.1 L108.7,99.4 L113.6,101.7 L118.5,103.8 L123.4,105.7 L128.3,107.6 L133.2,109.4 L138.2,111.0 L143.1,112.6 L148.0,114.1 L152.9,115.5 L157.8,116.8 L162.8,118.0 L167.7,119.2 L172.6,120.3 L177.5,121.4 L182.4,122.4 L187.3,123.3 L192.2,124.2 L197.2,125.0 L202.1,125.8 L207.0,126.5 L211.9,127.2 L216.8,127.9 L221.8,128.5 L226.7,129.1 L231.6,129.6 L236.5,130.1 L241.4,130.6 L246.3,131.1 L251.2,131.5 L256.2,131.9 L261.1,132.3 L266.0,132.7 L270.9,133.0 L275.8,133.3 L280.8,133.6 L285.7,133.9 L290.6,134.2 L295.5,134.5 L300.4,134.7 L305.3,134.9 L310.2,135.2 L315.2,135.4 L320.1,135.5 L325.0,135.7\"/><path class=\"ln\" d=\"M30.0,51.2 L34.9,56.7 L39.8,61.7 L44.8,66.3 L49.7,70.5 L54.6,74.3 L59.5,77.7 L64.4,80.9 L69.3,83.7 L74.2,86.3 L79.2,88.6 L84.1,90.6 L89.0,92.5 L93.9,94.1 L98.8,95.5 L103.8,96.8 L108.7,97.9 L113.6,98.8 L118.5,99.6 L123.4,100.2 L128.3,100.8 L133.2,101.2 L138.2,101.4 L143.1,101.6 L148.0,101.7 L152.9,101.7 L157.8,101.6 L162.8,101.4 L167.7,101.1 L172.6,100.7 L177.5,100.3 L182.4,99.8 L187.3,99.2 L192.2,98.6 L197.2,97.9 L202.1,97.1 L207.0,96.3 L211.9,95.5 L216.8,94.5 L221.8,93.6 L226.7,92.5 L231.6,91.5 L236.5,90.4 L241.4,89.2 L246.3,88.0 L251.2,86.7 L256.2,85.4 L261.1,84.1 L266.0,82.7 L270.9,81.3 L275.8,79.9 L280.8,78.4 L285.7,76.8 L290.6,75.3 L295.5,73.7 L300.4,72.0 L305.3,70.4 L310.2,68.6 L315.2,66.9 L320.1,65.1 L325.0,63.3\"/><circle class=\"dot\" cx=\"295.5\" cy=\"73.67375648799583\" r=\"4\"/><text class=\"tx\" x=\"295.5\" y=\"66.0\" text-anchor=\"middle\">you are here<\/text><text class=\"tx\" x=\"323\" y=\"129.0\" text-anchor=\"end\">train<\/text><\/svg><figcaption>99% train vs 70% validation sits on the overfitting side<\/figcaption><\/figure>"}, {"id": "ml-08", "topic": "ML basics", "sub": "Evaluation", "difficulty": "Medium", "title": "What ROC-AUC means", "prompt": "Give an intuitive definition of ROC-AUC = 0.82.", "ai": "If you pick one random positive and one random negative, the model scores the positive higher 82% of the time (ties count half). It measures ranking only, so it says nothing about calibration and doesn't depend on a threshold.", "verdict": "correct", "fix": "—", "track": "general", "lang": "text", "bug": "", "model": "Pick a random positive and a random negative. AUC is how often the model ranks them correctly.", "mech": "It only cares about order, not the actual probability values.", "breaks": "It's blind to calibration and to the costs at a particular threshold.", "contrast": "PR-AUC is more informative for rare positives.", "details": "That's correct. It's equivalent to the Mann–Whitney U statistic, normalized.", "why": "It only cares about order, not the actual probability values.", "evis": "<figure class=\"vis\"><svg viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"AUC = 0.82: area under this curve; diagonal = coin flip\" class=\"chart\"><path class=\"ax\" d=\"M30,10 L30,175 L190,175\"/><text class=\"tx\" x=\"190\" y=\"192\" text-anchor=\"end\">FPR<\/text><text class=\"tx\" x=\"34\" y=\"14\">TPR<\/text><path class=\"ax2\" d=\"M30,175 L190,15\"/><path class=\"ln\" d=\"M30.0,175.0 L34.0,162.5 L38.0,150.8 L42.0,139.7 L46.0,129.2 L50.0,119.4 L54.0,110.1 L58.0,101.5 L62.0,93.3 L66.0,85.8 L70.0,78.7 L74.0,72.2 L78.0,66.1 L82.0,60.5 L86.0,55.3 L90.0,50.6 L94.0,46.2 L98.0,42.2 L102.0,38.6 L106.0,35.4 L110.0,32.4 L114.0,29.8 L118.0,27.4 L122.0,25.4 L126.0,23.5 L130.0,21.9 L134.0,20.6 L138.0,19.4 L142.0,18.4 L146.0,17.6 L150.0,16.9 L154.0,16.4 L158.0,15.9 L162.0,15.6 L166.0,15.4 L170.0,15.2 L174.0,15.1 L178.0,15.0 L182.0,15.0 L186.0,15.0 L190.0,15.0\"/><\/svg><figcaption>AUC = 0.82: area under this curve; diagonal = coin flip<\/figcaption><\/figure>"}, {"id": "ml-09", "topic": "ML basics", "sub": "Evaluation", "difficulty": "Easy", "title": "Raising the threshold", "prompt": "You raise a classifier's decision threshold from 0.5 to 0.8. What usually happens?", "ai": "Fewer items get flagged as positive, so recall goes down (or stays the same) and precision usually goes up. Precision isn't guaranteed to be monotonic, though.", "verdict": "correct", "fix": "—", "track": "general", "lang": "text", "bug": "", "model": "A stricter bouncer lets fewer people in, so fewer mistakes get in and fewer real guests do too.", "mech": "Raising the threshold flags fewer items: recall drops, precision usually rises.", "breaks": "Precision can wiggle because it's a ratio of small numbers.", "contrast": "Lowering the threshold does the reverse.", "details": "That's correct. Recall can't increase, while precision usually rises but can bounce around.", "why": "Raising the threshold flags fewer items: recall drops, precision usually rises."}, {"id": "ml-11", "topic": "ML basics", "sub": "Validation", "difficulty": "Medium", "title": "CV for forecasting", "prompt": "To validate a model forecasting next week's demand, the AI uses shuffled 5-fold cross-validation.", "ai": "Shuffled K-fold uses all the data efficiently and gives a reliable error estimate.", "verdict": "wrong", "bug": "Leaks the future into training", "fix": "TimeSeriesSplit / rolling-origin evaluation with a gap ≥ feature horizon.", "track": "general", "lang": "text", "model": "You can't study with tomorrow's newspaper.", "mech": "Shuffled folds put future weeks in training, and lag features leak across folds.", "breaks": "Use forward-chaining splits, with a gap.", "contrast": "For truly i.i.d. data, shuffled K-fold is fine.", "details": "Shuffling puts future weeks in the training folds, and lag and rolling features leak across folds, so the error estimate is too optimistic. Use forward-chaining (time-series split) with a gap.", "why": "Leaks the future into training"}, {"id": "ab-10", "topic": "A/B testing", "sub": "Peeking", "difficulty": "Hard", "title": "Peeking with always-valid p-values", "prompt": "The team wants to check results every day and stop as soon as there's a clear winner. The AI proposes a fix.", "ai": "Use a sequential method built for continuous monitoring, like mSPRT always-valid p-values or a group-sequential design with an alpha-spending function (O'Brien–Fleming). These keep the false-positive rate at 5% no matter how often you look, in exchange for needing somewhat more data to detect the same effect.", "verdict": "correct", "fix": "—", "track": "general", "lang": "text", "bug": "", "model": "Peeking is fine if the rulebook expects you to peek.", "mech": "Sequential tests spend the 5% error budget across looks, so stopping early stays honest.", "breaks": "The cost is a bit more data for the same power.", "contrast": "Plain fixed-horizon p-values checked daily do not have this guarantee.", "details": "", "why": "Sequential tests spend the 5% error budget across looks, so stopping early stays honest."}, {"id": "ab-12", "topic": "A/B testing", "sub": "Segments", "difficulty": "Medium", "title": "The Android-only win", "prompt": "Overall lift is flat (p = 0.4). The AI slices by 12 segments (platform × region × new/returning) and finds Android users +4% (p = 0.03).", "ai": "Ship to Android only. The overall result hid a real win in that segment.", "verdict": "wrong", "bug": "Post-hoc segment fishing", "fix": "Treat it as a hypothesis: correct for 12 looks (or pre-register segments) and confirm with a new Android-only test.", "track": "general", "lang": "text", "model": "Slice enough ways and something will look significant.", "mech": "12 segments give about a 46% chance that at least one crosses p < 0.05 by luck.", "breaks": "Treat segment wins as hypotheses: correct for multiple looks, then confirm with a new test.", "contrast": "A segment pre-registered before the test is legitimate.", "details": "", "why": "Post-hoc segment fishing", "vis": "| Slice | Lift | p |\n|---|---:|---:|\n| Overall | ~0% | 0.40 |\n| Android (1 of 12 slices) | +4% | 0.03 |\n| Other 11 slices | mixed | > 0.05 |"}, {"id": "ab-13", "topic": "A/B testing", "sub": "Power", "difficulty": "Medium", "title": "Halving the detectable effect", "prompt": "A test powered to detect a 2% lift needs 50k users per arm. How many are needed to detect a 1% lift at the same power?", "ai": "About **200k per arm**, 4× as many. Noise shrinks with the square root of the sample, so halving the effect you can detect takes 4× the data.", "verdict": "correct", "fix": "$n \\propto 1/\\text{MDE}^2$, so 4×", "track": "general", "lang": "text", "bug": "", "model": "Precision improves with the square root of the data, so twice as sharp costs 4× the data.", "mech": "Halving the effect you want to detect means the noise has to shrink by half, which takes 4× the users.", "breaks": "This is why tiny effects need huge tests.", "contrast": "Halving the variance (e.g. CUPED) halves n.", "details": "", "why": "Halving the effect you want to detect means the noise has to shrink by half, which takes 4× the users."}, {"id": "ab-15", "topic": "A/B testing", "sub": "Long-term effects", "difficulty": "Hard", "title": "Will the lift last?", "prompt": "An aggressive notification change lifts 2-week engagement by 3%. Leadership worries it will cause long-term fatigue and more opt-outs.", "ai": "Keep a small long-term holdout (e.g. 5% of users never get the change) for a few months, and track opt-outs and uninstalls as guardrails alongside engagement. Short-term tests can't see effects that build up slowly, like fatigue or learning.", "verdict": "correct", "fix": "—", "track": "general", "lang": "text", "bug": "", "model": "Short tests see sugar highs, not the slow build-up of fatigue.", "mech": "A long-running holdout keeps a clean comparison for months, which catches slow effects like opt-outs.", "breaks": "It costs some lost upside for the holdout group.", "contrast": "Fast feedback (2 weeks) is fine for effects that don't build up.", "details": "", "why": "A long-running holdout keeps a clean comparison for months, which catches slow effects like opt-outs."}, {"id": "st-10", "topic": "Stats & probability", "sub": "Expectation", "difficulty": "Medium", "title": "Collecting every face", "prompt": "How many rolls of a fair die, on average, until you've seen all six faces?", "ai": "Split it into stages. With k faces still missing, each roll is a new face with probability k/6, so that stage takes 6/k rolls on average. Total = 6(1 + 1/2 + … + 1/6) = **14.7 rolls**.", "verdict": "correct", "fix": "14.7", "track": "general", "lang": "text", "bug": "", "model": "Collecting stickers gets slower as you go. The last one takes forever.", "mech": "Each stage waits for a new face. With k faces left, that takes about 6/k rolls, and the stages add up.", "breaks": "The same logic sizes 'see every item at least once' problems.", "contrast": "Waiting for one specific face takes 6 rolls on average.", "details": "", "why": "Each stage waits for a new face."}, {"id": "ml-10", "topic": "ML basics", "sub": "Preprocessing", "difficulty": "Easy", "title": "Scaling for a random forest", "prompt": "Before training a random forest, the AI insists on standardizing every feature.", "ai": "You must standardize the features first, or features with large ranges will dominate the splits.", "verdict": "wrong", "bug": "Tree models are invariant to monotone feature scaling", "fix": "Skip scaling for trees/GBMs; do it for distance-based, linear-regularized, or neural models.", "track": "general", "lang": "text", "model": "Trees ask yes/no questions about order, so rescaling doesn't change the answers.", "mech": "Splits depend on rank, so a monotone rescaling gives the same trees.", "breaks": "Scaling matters for distance-based, penalized linear, and neural models.", "contrast": "For k-NN or Lasso, scaling is essential.", "details": "", "why": "Tree models are invariant to monotone feature scaling"}, {"id": "ml-12", "topic": "ML basics", "sub": "Calibration", "difficulty": "Medium", "title": "AUC 0.9 → use the probabilities?", "prompt": "A model has AUC 0.90. The AI plugs its predicted probabilities straight into an expected-revenue formula.", "ai": "An AUC of 0.90 means the model is accurate, so its probabilities are trustworthy and can go straight into the formula.", "verdict": "wrong", "bug": "Discrimination ≠ calibration", "fix": "Check a reliability curve / Brier score on held-out data; recalibrate (Platt/isotonic) if needed.", "track": "general", "lang": "text", "model": "Ranking well and being honest about odds are different skills.", "mech": "AUC measures ordering. Calibration measures whether a '30%' really happens 30% of the time.", "breaks": "Probabilities that feed into money calculations need calibration checks.", "contrast": "A well-calibrated model with mediocre AUC can still be useful for expected-value math.", "details": "", "why": "Discrimination ≠ calibration"}, {"id": "gbm-01", "sub": "Fundamentals", "difficulty": "Medium", "title": "Boosting vs bagging", "prompt": "An interviewer asks: \"What's the core difference between bagging (e.g. random forest) and gradient boosting, in bias–variance terms?\"", "ai": "Bagging trains trees **sequentially**, each one correcting the last, so it mainly reduces **bias**. Boosting trains many deep trees **independently** on bootstrap samples and averages them, so it mainly reduces **variance**.", "verdict": "wrong", "bug": "Swapped bagging and boosting", "fix": "Bagging: parallel, independent deep trees, averaged → variance reduction. Boosting: sequential, additive shallow trees fit to the negative gradient of the loss → bias reduction (overfits if you run too many rounds without shrinkage or early stopping).", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Bagging is a committee voting independently. Boosting is a relay team fixing each other's mistakes.", "mech": "Bagging averages many deep, jittery trees, so the jitter cancels out (less variance). Boosting stacks small, simple trees, each correcting what the team still gets wrong (less bias).", "breaks": "Boosting keeps fitting until it's fitting noise, so it needs a stopping rule. Bagging's trees don't chase each other, so adding more is safe.", "contrast": "Random forests add feature randomness on top of bagging to decorrelate the trees further.", "details": "It's reversed. Bagging fits deep, low-bias, high-variance trees in parallel on bootstrap samples and averages them, which reduces variance. Boosting fits shallow, high-bias learners sequentially, each fit to the current errors (negative gradients), which mainly reduces bias. Shrinkage and subsampling then keep variance under control.", "why": "Swapped bagging and boosting"}, {"id": "gbm-02", "sub": "Loss & gradients", "difficulty": "Medium", "title": "Why 'fit the residuals'?", "prompt": "Explain why gradient boosting with squared-error loss is often described as \"fitting trees to residuals.\" Targets are y = [3, 5, 10] and the initial prediction is the mean. What does the first tree fit?", "ai": "With $L = \\tfrac12 (y - F)^2$, the negative gradient with respect to the prediction $F$ is $-\\partial L/\\partial F = y - F$, which is exactly the residual. $F_0 = \\text{mean}(y) = 6$, so the first tree is fit to the pseudo-residuals **[−3, −1, 4]**. For other losses, the tree fits the negative gradient, which is not a plain residual.", "verdict": "correct", "fix": "Pseudo-residuals: $y - F_0 = [3, 5, 10] - 6 = [-3, -1, 4]$", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "A relay team of weak learners, each one fixing the last one's mistakes.", "mech": "Start with the average. Each new tree looks at how far off the team is for each row and learns a small correction in that direction. For squared error, 'how far off' is literally the residual.", "breaks": "Works because each step moves predictions downhill on the loss. For other losses, the 'direction' isn't the plain residual.", "contrast": "For log loss, the tree fits 'actual minus predicted probability' instead.", "details": "That's right. Boosting is functional gradient descent: each tree approximates the negative gradient of the loss at the current predictions. For squared error that's the ordinary residual. For absolute error it's $\\operatorname{sign}(y - F)$, and for log loss it's $y - p$.", "why": "Start with the average."}, {"id": "gbm-03", "sub": "Loss & gradients", "difficulty": "Hard", "title": "Gradient and Hessian of log loss", "prompt": "For binary classification, XGBoost works on the raw score $F$ (log-odds) with $p = \\sigma(F)$. What are the per-row gradient $g$ and Hessian $h$ of the log loss with respect to $F$?", "ai": "$$L = -[\\,y \\log p + (1-y)\\log(1-p)\\,]$$ Differentiating with respect to $F$ gives $g = p - y$ and $h = p(1 - p)$. So the tree targets $-g = y - p$, and rows where the model is unsure ($p \\approx 0.5$) have the largest Hessian.", "verdict": "correct", "fix": "$g = p - y,\\quad h = p(1-p)$", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "The gradient says which way to move. The Hessian says how sure you can be about the step size.", "mech": "For log loss, the push is 'predicted probability minus truth.' The curvature is largest where the model is unsure (around 50/50) and tiny where it's confident.", "breaks": "XGBoost uses both to size each leaf's step (Newton's method). Confident rows barely count, which is why min_child_weight behaves oddly on imbalanced data.", "contrast": "Squared error has constant curvature (1), so every row counts equally.", "details": "Both are right. The second-order (Newton) step in XGBoost uses these g and h values. The optimal leaf weight is $-\\sum g / (\\sum h + \\lambda)$, and `min_child_weight` limits $\\sum h$, not the row count.", "why": "For log loss, the push is 'predicted probability minus truth.' The curvature is largest where the model is unsure (around 50/50) and tiny where it's confident."}, {"id": "gbm-04", "sub": "Learning rate & trees", "difficulty": "Medium", "title": "Halving the learning rate", "prompt": "A model with learning_rate = 0.1 and early stopping picks ~500 trees. A teammate drops learning_rate to 0.05 but keeps n_estimators fixed at 500. What should they expect?", "ai": "Basically the same model. The learning rate only scales each tree's contribution, so over 500 trees the total is the same, and generalization should be identical or slightly better.", "verdict": "wrong", "bug": "Ignores the learning_rate × n_estimators trade-off", "fix": "Lower learning_rate → raise n_estimators (≈ proportionally) and re-select the round count with early stopping on a validation set.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "A smaller step size means you need more steps to cover the same ground.", "mech": "The learning rate scales each tree's contribution. Halve it, and 500 trees only get you about halfway.", "breaks": "Small steps generalize slightly better, but only if you add trees to match. Let early stopping choose.", "contrast": "Doubling the trees along with halving the rate gets you to a similar (often slightly better) model.", "details": "Shrinkage and the number of rounds trade off against each other. At half the step size, 500 trees will usually underfit, because training loss hasn't come down as far. You typically need about 2× the rounds, around 1000. Smaller learning rates usually generalize a little better (Friedman 2001), but only when you add trees to match, ideally chosen with early stopping.", "why": "Ignores the learning_rate × n_estimators trade-off", "evis": "<figure class=\"vis\"><svg viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"Half the learning rate needs about twice the trees to reach its minimum\" class=\"chart\"><path class=\"ax\" d=\"M30,10 L30,145 L330,145\"/><text class=\"tx\" x=\"330\" y=\"162\" text-anchor=\"end\">trees<\/text><text class=\"tx\" x=\"34\" y=\"14\">val loss<\/text><path class=\"ln mut\" d=\"M30.0,26.2 L34.9,35.0 L39.8,43.0 L44.8,50.2 L49.7,56.7 L54.6,62.5 L59.5,67.8 L64.4,72.6 L69.3,76.9 L74.2,80.8 L79.2,84.3 L84.1,87.4 L89.0,90.3 L93.9,92.8 L98.8,95.1 L103.8,97.2 L108.7,99.1 L113.6,100.7 L118.5,102.3 L123.4,103.6 L128.3,104.8 L133.2,105.9 L138.2,106.9 L143.1,107.7 L148.0,108.5 L152.9,109.2 L157.8,109.8 L162.8,110.3 L167.7,110.8 L172.6,111.2 L177.5,111.6 L182.4,111.9 L187.3,112.2 L192.2,112.4 L197.2,112.6 L202.1,112.8 L207.0,112.9 L211.9,113.1 L216.8,113.2 L221.8,113.2 L226.7,113.3 L231.6,113.3 L236.5,113.3 L241.4,113.4 L246.3,113.3 L251.2,113.3 L256.2,113.3 L261.1,113.3 L266.0,113.2 L270.9,113.2 L275.8,113.1 L280.8,113.1 L285.7,113.0 L290.6,112.9 L295.5,112.8 L300.4,112.7 L305.3,112.7 L310.2,112.6 L315.2,112.5 L320.1,112.4 L325.0,112.3\"/><path class=\"ln\" d=\"M30.0,28.8 L34.9,33.3 L39.8,37.5 L44.8,41.6 L49.7,45.5 L54.6,49.2 L59.5,52.7 L64.4,56.0 L69.3,59.2 L74.2,62.2 L79.2,65.0 L84.1,67.7 L89.0,70.3 L93.9,72.7 L98.8,75.1 L103.8,77.3 L108.7,79.4 L113.6,81.4 L118.5,83.3 L123.4,85.1 L128.3,86.8 L133.2,88.4 L138.2,89.9 L143.1,91.4 L148.0,92.8 L152.9,94.1 L157.8,95.3 L162.8,96.5 L167.7,97.6 L172.6,98.7 L177.5,99.7 L182.4,100.7 L187.3,101.6 L192.2,102.4 L197.2,103.2 L202.1,104.0 L207.0,104.8 L211.9,105.4 L216.8,106.1 L221.8,106.7 L226.7,107.3 L231.6,107.9 L236.5,108.4 L241.4,108.9 L246.3,109.4 L251.2,109.8 L256.2,110.2 L261.1,110.6 L266.0,111.0 L270.9,111.3 L275.8,111.7 L280.8,112.0 L285.7,112.3 L290.6,112.6 L295.5,112.8 L300.4,113.1 L305.3,113.3 L310.2,113.5 L315.2,113.7 L320.1,113.9 L325.0,114.1\"/><path class=\"ax2\" d=\"M177.5,12 L177.5,145\"/><text class=\"tx\" x=\"181.5\" y=\"22\" text-anchor=\"start\">500 trees<\/text><text class=\"tx\" x=\"323\" y=\"79.5\" text-anchor=\"end\">lr 0.1<\/text><text class=\"tx g\" x=\"323\" y=\"129.75\" text-anchor=\"end\">lr 0.05<\/text><\/svg><figcaption>Half the learning rate needs about twice the trees to reach its minimum<\/figcaption><\/figure>"}, {"id": "gbm-05", "sub": "Tree structure", "difficulty": "Hard", "title": "num_leaves vs max_depth in LightGBM", "prompt": "Moving an XGBoost model with max_depth = 8 to LightGBM, the AI suggests settings to get \"the same complexity.\"", "ai": "LightGBM grows leaf-wise, so set **num_leaves** $= 2^8 = 256$ with max_depth = −1. A depth-8 tree has 256 leaves, so that's exactly the same complexity as the XGBoost depth-8 trees.", "verdict": "wrong", "bug": "Leaf-wise trees with 2^depth leaves are much deeper/more complex", "fix": "`num_leaves` $\\ll 2^{\\text{max\\_depth}}$ (e.g. ~100), plus max_depth and min_data_in_leaf as guards; tune num_leaves with early stopping.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "A leaf budget isn't a depth budget. A greedy grower spends all its leaves digging one deep hole.", "mech": "Leaf-wise growth keeps splitting the most promising leaf, so 256 leaves can form a very deep, lopsided tree.", "breaks": "That's powerful on big data and overfits on small data. Keep num_leaves well under $2^{\\text{depth}}$.", "contrast": "A depth-wise tree of depth 8 rarely uses all 256 leaves anyway.", "details": "LightGBM's tuning docs warn that setting $\\text{num\\_leaves} = 2^{\\text{max\\_depth}}$ can overfit. A leaf-wise tree keeps splitting whichever leaf has the largest loss reduction, so 256 leaves can form a much deeper, lopsided tree than a balanced depth-8 tree. In practice depth-wise trees rarely use all $2^d$ leaves either. Keep num_leaves well below $2^{\\text{max\\_depth}}$ (e.g. 70–150 for depth ≈ 8), and set max_depth too and/or min_data_in_leaf.", "why": "Leaf-wise trees with 2^depth leaves are much deeper/more complex", "evis": "| | Depth-wise (XGBoost) | Leaf-wise (LightGBM) |\n|---|---|---|\n| Grows | every node at a level | the single best leaf |\n| Depth 8 | at most 256 leaves, balanced | 256 leaves can be very deep |\n| Risk | underuses leaves | overfits small data |\n| Safer setting | `max_depth = 8` | `num_leaves` ≈ 70 to 150, plus `max_depth` |"}, {"id": "gbm-06", "sub": "Regularization", "difficulty": "Hard", "title": "What lambda does to a leaf", "prompt": "A leaf contains rows with gradient sum $G = -10$ and Hessian sum $H = 5$. What's the XGBoost optimal leaf weight with reg_lambda = 0 vs reg_lambda = 5?", "ai": "$$w^* = \\frac{-G}{H + \\lambda}$$ With $\\lambda = 0$: $w^* = 10/5 =$ **2.0**. With $\\lambda = 5$: $w^* = 10/10 =$ **1.0**. So L2 regularization shrinks leaf values toward 0, more strongly for leaves with a small Hessian sum (few or confident rows).", "verdict": "correct", "fix": "$w^* = -G/(H+\\lambda)$: 2.0 → 1.0", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "L2 on leaves is a skeptic: 'show me more evidence before you shout.'", "mech": "Each leaf's value is its push divided by (evidence + $\\lambda$). Adding $\\lambda$ shrinks leaves with little evidence the most.", "breaks": "It tames leaves built on few or confident rows. Too much $\\lambda$ underfits.", "contrast": "L1 (alpha) can zero out weak leaves entirely.", "details": "That's correct (Chen & Guestrin 2016, eq. 5). $\\lambda$ also appears in the split gain $G^2/(H+\\lambda)$, so it makes splits on small or low-Hessian nodes less attractive. reg_alpha (L1) soft-thresholds G and can set leaf weights exactly to 0.", "why": "Each leaf's value is its push divided by (evidence + λ)."}, {"id": "gbm-07", "sub": "Regularization", "difficulty": "Hard", "title": "min_child_weight meaning", "prompt": "On a heavily imbalanced binary problem (log loss), the AI explains XGBoost's `min_child_weight = 10`.", "ai": "min_child_weight is the minimum **number of rows** in a child. With 10, every leaf must have at least 10 training examples, the same as sklearn's min_samples_leaf.", "verdict": "wrong", "bug": "It's a minimum Hessian sum, not a row count", "fix": "min_child_weight bounds $\\sum h$ (Hessian) in a child; for log loss that's $\\sum p(1-p)$. Equivalent to a row count only for squared error ($h = 1$).", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "min_child_weight counts evidence, not heads.", "mech": "XGBoost requires a minimum amount of 'curvature' (Hessian) in each child. For log loss, confident rows carry almost none.", "breaks": "So on imbalanced data a leaf of thousands of easy negatives may still be 'too light' to split. Only for squared error does it equal a row count.", "contrast": "sklearn's min_samples_leaf really is a row count.", "details": "XGBoost's docs define it as the minimum sum of instance weight (Hessian) needed in a child. For squared error $h = 1$, so it does equal a row count. For log loss $h = p(1-p)$, which is tiny for rows the model is already confident about. A leaf of 1,000 confidently predicted negatives ($p \\approx 0.01$, $h \\approx 0.0099$) has $\\sum h \\approx 9.9$ and would fail a threshold of 10. On imbalanced data this setting can block splits you might expect, and its effect changes as training goes on.", "why": "It's a minimum Hessian sum, not a row count"}, {"id": "gbm-08", "sub": "Regularization", "difficulty": "Medium", "title": "gamma / min_split_loss", "prompt": "What does XGBoost's `gamma` (min_split_loss) do?", "ai": "A split is kept only if its loss reduction (gain) is larger than gamma. Raising gamma prunes splits that barely help, which makes trees more conservative. Its scale depends on the loss, so there's no universal good value. Tune it relative to typical gain values.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "gamma is the toll for adding a split.", "mech": "A split is only kept if it improves the loss by more than gamma.", "breaks": "Prunes splits that barely help. Its scale depends on the loss and the data size.", "contrast": "Setting gamma = 0 lets any positive-gain split through.", "details": "That's correct. In the paper, γ is the per-leaf complexity penalty γT, so a split must improve the objective by more than γ. Because gain is measured in loss units, the right γ depends on the objective and on the data size.", "why": "A split is only kept if it improves the loss by more than gamma."}, {"id": "gbm-09", "sub": "Regularization", "difficulty": "Medium", "title": "subsample = 0.8", "prompt": "What does `subsample = 0.8` do in XGBoost/LightGBM-style boosting?", "ai": "Each tree is trained on a **bootstrap sample drawn with replacement** that's 80% the size of the data, like a random forest. This decorrelates the trees so the final average has lower variance.", "verdict": "wrong", "bug": "Row subsampling is without replacement and boosting doesn't average", "fix": "Each round uses a random 80% of rows sampled without replacement; acts as regularization + speedup; trees remain additive. (colsample_* does the same for features.)", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Show each relay runner a random 80% of the track so no one memorizes potholes.", "mech": "Each round trains on a random subset of rows, drawn without replacement.", "breaks": "The noise acts as regularization and speeds things up. The trees still add up in sequence; they aren't averaged.", "contrast": "colsample does the same with columns.", "details": "Stochastic gradient boosting (Friedman 2002) draws a fraction of rows **without replacement** for each round. XGBoost's docs say it samples that fraction of the training instances before growing each tree. The trees are still added sequentially, not averaged. The randomness acts as regularization (less overfitting, often better generalization) and speeds up training. LightGBM's bagging_fraction also needs bagging_freq > 0 before it does anything.", "why": "Row subsampling is without replacement and boosting doesn't average"}, {"id": "gbm-10", "sub": "Early stopping", "difficulty": "Medium", "title": "Early stopping on the test set", "prompt": "The AI's training code: `model.fit(X_train, y_train, eval_set=[(X_test, y_test)], early_stopping_rounds=50)` and then it reports `roc_auc(y_test, model.predict_proba(X_test))` as the final generalization estimate.", "ai": "This is good practice: early stopping on the test set picks the number of trees that generalizes best, and then we report the test AUC.", "verdict": "wrong", "bug": "Test set used for model selection → optimistic estimate", "fix": "Split train → (train, valid). Early-stop on valid; report on an untouched test set (or use nested CV).", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "If you pick the number of trees using the final exam, you've seen the exam.", "mech": "Early stopping chooses a hyperparameter (the number of trees). Choosing it on the test set leaks information.", "breaks": "Use a separate validation split, and keep the test set untouched.", "contrast": "Early stopping on a validation set, then reporting test, is fine.", "details": "Early stopping is a hyperparameter search over the number of rounds. Using the test set to choose that number leaks test information into the model, so the reported AUC is biased upward. With noisy metrics or small test sets the bias can be noticeable.", "why": "Test set used for model selection → optimistic estimate"}, {"id": "gbm-11", "sub": "Early stopping", "difficulty": "Medium", "title": "Refit after early stopping", "prompt": "You used 5-fold CV with early stopping, and the best iterations averaged 800. How should you train the final model on all the data?", "ai": "Refit on 100% of the training data with a fixed n_estimators of about 800, maybe slightly more (e.g. $800 \\times \\tfrac{1}{1 - 1/5} \\approx 1000$) since there's 25% more data per fit. You can't early-stop the final fit because there's no held-out data left, so fix the round count using CV.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "CV tells you roughly how many relay runners you need. Then hire the team on all the data.", "mech": "Fix n_estimators from CV (maybe a bit higher for more data) and refit on everything.", "breaks": "The scale-up is a heuristic. Averaging the fold models is another option.", "contrast": "Early-stopping the final fit on training data would be meaningless.", "details": "This is a reasonable, widely used recipe. Scaling up for the larger data size is a heuristic, not a law. Some people keep exactly 800, or average the 5 fold models instead of refitting.", "why": "Fix n_estimators from CV (maybe a bit higher for more data) and refit on everything."}, {"id": "gbm-12", "sub": "XGBoost vs LightGBM vs CatBoost", "difficulty": "Medium", "title": "Histogram split finding", "prompt": "Why is LightGBM's histogram algorithm fast?", "ai": "It buckets each continuous feature into discrete bins (max_bin, default 255) once, up front. To find a split, it builds per-bin gradient/Hessian histograms and scans the bins instead of every sorted value, so the cost is O(#bins) per feature instead of O(#rows). It also gets a child's histogram by subtracting its sibling's histogram from the parent's.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "Sort the values into 255 buckets once, then compare buckets instead of every value.", "mech": "Split finding scans the bins, not the rows, and a sibling's histogram comes free by subtraction.", "breaks": "Much faster, with slight loss of precision.", "contrast": "The exact greedy method scans every sorted value.", "details": "This matches the LightGBM paper and docs. XGBoost's `tree_method='hist'` (the default since 2.0) uses the same idea. Fewer bins is faster and adds some regularization, at the cost of split precision.", "why": "Split finding scans the bins, not the rows, and a sibling's histogram comes free by subtraction."}, {"id": "gbm-13", "sub": "XGBoost vs LightGBM vs CatBoost", "difficulty": "Hard", "title": "How GOSS samples", "prompt": "Explain LightGBM's Gradient-based One-Side Sampling (GOSS).", "ai": "GOSS keeps the rows with large gradients and **drops** the small-gradient rows, since they're already well fit. Training on only the hard examples is faster, and the information gain estimate stays unbiased because small-gradient rows add nothing to it.", "verdict": "wrong", "bug": "Omits random sampling + re-weighting of small-gradient rows", "fix": "Keep top-a% |g| rows, randomly sample b% of the remainder, up-weight those by $(1-a)/b$ in the gain computation.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Study your mistakes closely, skim what you already know, then reweight so the skim counts fairly.", "mech": "GOSS keeps all the large-gradient (poorly fit) rows and a random sample of the rest, then up-weights that sample.", "breaks": "Without the reweighting, the data looks harder than it is and splits are biased.", "contrast": "Plain row subsampling picks rows uniformly at random.", "details": "GOSS keeps the top a×100% of rows by |gradient| and **randomly samples** b×100% of the rest. It then multiplies the sampled small-gradient rows by $(1-a)/b$ when computing gain. Without that reweighting the data distribution shifts and the gain estimate is biased. With it, Ke et al. (2017) show the estimate stays accurate.", "why": "Omits random sampling + re-weighting of small-gradient rows"}, {"id": "gbm-14", "sub": "XGBoost vs LightGBM vs CatBoost", "difficulty": "Hard", "title": "Exclusive Feature Bundling", "prompt": "What problem does LightGBM's Exclusive Feature Bundling (EFB) solve?", "ai": "In high-dimensional sparse data (e.g. one-hot features), many features are almost never nonzero at the same time. EFB bundles these mutually exclusive features into one feature by offsetting their bin ranges, which cuts the number of features histograms are built for. Finding the optimal bundling is NP-hard, so LightGBM uses a greedy graph-coloring approximation that tolerates a small conflict rate.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "Features that are never 'on' at the same time can share one column.", "mech": "EFB packs mutually exclusive sparse features into bundles with offset bins.", "breaks": "Fewer columns to scan. Works when the features really don't overlap much.", "contrast": "Dense, overlapping features can't be bundled.", "details": "That's correct, per Ke et al. (2017). GOSS reduces the number of rows and EFB reduces the number of features.", "why": "EFB packs mutually exclusive sparse features into bundles with offset bins."}, {"id": "gbm-15", "sub": "XGBoost vs LightGBM vs CatBoost", "difficulty": "Hard", "title": "CatBoost ordered boosting", "prompt": "What is CatBoost's \"ordered boosting\" for?", "ai": "Classic GBMs compute each row's gradient with a model that was trained on that same row, which causes **prediction shift**, a form of target leakage. Ordered boosting takes a random permutation and computes each row's residual using a model trained only on the rows before it. CatBoost uses several permutations to reduce variance.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "Don't grade a student with an answer key they studied from.", "mech": "Each row's error is computed by a model that only saw rows before it in a random order.", "breaks": "Removes the optimism ('prediction shift') of judging rows with a model trained on them.", "contrast": "Classic GBMs compute residuals with the same model that trained on the row.", "details": "That matches Prokhorenkova et al. (2018). The same idea of looking only at earlier rows in a permutation is behind CatBoost's ordered target statistics for categorical features.", "why": "Each row's error is computed by a model that only saw rows before it in a random order."}, {"id": "gbm-16", "sub": "Categorical & target encoding", "difficulty": "Hard", "title": "CatBoost and high-cardinality categoricals", "prompt": "You pass a `merchant_id` column (40k levels) to CatBoost as a categorical feature. What does CatBoost do with it by default?", "ai": "CatBoost one-hot encodes every categorical feature, so merchant_id becomes 40,000 binary columns. That's why CatBoost is slow on high-cardinality data, and you should hash it first.", "verdict": "wrong", "bug": "CatBoost uses ordered target statistics; one-hot only for tiny cardinalities", "fix": "High-cardinality cats → ordered target statistics (with prior), computed over random permutations; no 40k-column one-hot.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Encode each row using only earlier students' graded exams.", "mech": "CatBoost turns big categoricals into a smoothed running average of the target over earlier rows in a random order.", "breaks": "No one-hot explosion, and no leakage from a row's own label.", "contrast": "Categories with only a couple of levels do get one-hot encoded.", "details": "CatBoost only one-hot encodes categoricals with at most `one_hot_max_size` levels, which defaults to a small number like 2. Everything else gets **ordered target statistics**: each row's encoding is a smoothed mean of the target over rows with the same category that come *earlier* in a random permutation, plus a prior. This avoids the target leakage of naive mean encoding. It also builds combinations of categorical features greedily.", "why": "CatBoost uses ordered target statistics; one-hot only for tiny cardinalities"}, {"id": "gbm-17", "sub": "Categorical & target encoding", "difficulty": "Medium", "title": "Naive target encoding", "prompt": "For a GBM, the AI target-encodes a high-cardinality `account_id` like this, then trains on train_df:\n`train_df['acct_te'] = train_df.groupby('account_id')['churn'].transform('mean')`", "ai": "That's fine. Target encoding is a standard way to handle high-cardinality categoricals in GBMs, and computing it on the training set (never the test set) avoids leakage.", "verdict": "wrong", "bug": "In-sample target encoding leaks each row's own label", "fix": "Out-of-fold (K-fold) target encoding with smoothing toward the global mean (or CatBoost-style ordered TS); fit encoders inside each CV fold.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "If a row's encoding includes its own answer, the model is reading the answer key.", "mech": "For rare categories, the in-sample mean is basically the row's own label.", "breaks": "Training looks amazing and validation collapses. Encode out-of-fold.", "contrast": "Encoding computed on separate historical data is fine.", "details": "Each row's encoding includes its own label. For rare categories (1–3 rows) the feature nearly equals the target, so the GBM latches onto it. Training AUC looks great while validation collapses. A simulation where account_id has **no** real signal still gives the in-sample encoding a strong correlation with y in training and about 0 on holdout.", "why": "In-sample target encoding leaks each row's own label"}, {"id": "gbm-18", "sub": "Feature importance", "difficulty": "Medium", "title": "Which importance to trust", "prompt": "A stakeholder asks which features \"drive\" churn. The AI pulls XGBoost importances.", "ai": "Use `importance_type='weight'` (split count). Features used in the most splits are the most important, and that ranking tells us which levers causally drive churn.", "verdict": "wrong", "bug": "Split-count importance is biased, and no importance is causal", "fix": "Report mean |SHAP| (or holdout permutation importance), check correlated groups, and frame it as 'what the model relies on', not causal levers.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Split count is how often someone spoke up, not how much they mattered.", "mech": "Continuous and high-cardinality features get more chances to split by luck.", "breaks": "Prefer SHAP or holdout permutation importance, and none of them are causal.", "contrast": "Gain is better than split count, but still not perfect.", "details": "Split counts favor continuous and high-cardinality features, which offer many candidate split points even when each split helps little. Gain is better but can still be inconsistent. SHAP values are consistent and local (Lundberg et al. 2018/2020), and permutation importance on a holdout set is another good option. None of these say what causes churn. They describe what the model uses, and correlated proxies share or steal credit.", "why": "Split-count importance is biased, and no importance is causal"}, {"id": "gbm-19", "sub": "Feature importance", "difficulty": "Hard", "title": "SHAP with correlated features", "prompt": "Two features, `seats` and `active_users`, have a 0.95 correlation. The AI explains what you'll see in TreeSHAP.", "ai": "Credit can be split between them, or concentrated on whichever one the trees happened to split on, so each one's SHAP importance can look smaller (or arbitrarily lopsided) compared with the pair's combined effect. The path-dependent and interventional variants of TreeSHAP can also differ here. Look at grouped SHAP for the pair, and don't read a low value as \"irrelevant\".", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "Twins split the credit, sometimes unevenly.", "mech": "With correlated features, SHAP credit can go to either twin depending on how the trees split.", "breaks": "Group correlated features and sum their SHAP values.", "contrast": "Independent features get stable SHAP credit.", "details": "That's correct. With correlated features, attribution depends on the model and the SHAP variant. Summing SHAP over correlated groups is a common fix.", "why": "With correlated features, SHAP credit can go to either twin depending on how the trees split."}, {"id": "gbm-20", "sub": "Imbalance & calibration", "difficulty": "Hard", "title": "scale_pos_weight and probabilities", "prompt": "Fraud is 1% of rows. The AI sets `scale_pos_weight = 99` in XGBoost and then uses predict_proba as the fraud probability for expected-loss calculations.", "ai": "scale_pos_weight = neg/pos = 99 balances the classes while keeping predicted probabilities calibrated, so the outputs can go straight into expected-loss math.", "verdict": "wrong", "bug": "Class re-weighting distorts probabilities", "fix": "Either don't reweight (optimize logloss, tune threshold), or recalibrate on a held-out set (Platt/isotonic), or analytically correct odds by the weight factor.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Reweighting the classes moves the 'thermostat' of the probabilities.", "mech": "Making positives 99× heavier makes the model think fraud is about 50% common, so its probabilities inflate.", "breaks": "Fine for ranking, wrong for expected-value math unless you recalibrate.", "contrast": "Without reweighting, log-loss-trained probabilities are usually close to calibrated.", "details": "Up-weighting positives 99× makes the model act as if the prior were about 50%, so predicted probabilities are badly inflated. XGBoost's docs say that if you care about predicting the right probability, you can't re-balance the dataset this way. Weighting can help ranking (AUC), but probabilities need recalibration (or don't reweight at all) before they go into expected-value math.", "why": "Class re-weighting distorts probabilities"}, {"id": "gbm-21", "sub": "Imbalance & calibration", "difficulty": "Medium", "title": "Metric for rare positives", "prompt": "With 0.5% positives, which offline metric should drive model selection for a GBM fraud model reviewed in priority order?", "ai": "PR-AUC (average precision), or precision/recall at the operating capacity (e.g. the top 500 alerts a day). ROC-AUC can look great when positives are rare because the false-positive rate is diluted by the huge number of negatives. Accuracy is useless here.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "When positives are rare, judge the model by its alarm quality.", "mech": "PR-AUC looks at precision versus recall, which is where rare-event performance shows.", "breaks": "ROC's false-positive rate gets diluted by a huge pile of negatives.", "contrast": "With balanced classes, ROC-AUC is fine.", "details": "That's correct. With rare positives, PR curves show performance in the region that matters (Saito & Rehmsmeier 2015). Tying the metric to review capacity is even better.", "why": "PR-AUC looks at precision versus recall, which is where rare-event performance shows."}, {"id": "gbm-22", "sub": "Constraints & tuning", "difficulty": "Medium", "title": "Monotonic constraints", "prompt": "Risk wants predicted default probability to never go **down** as `debt_to_income` goes up. What does the AI suggest?", "ai": "Set a monotone constraint on that feature, e.g. XGBoost `monotone_constraints={'debt_to_income': 1}` (LightGBM `monotone_constraints` with +1). This guarantees the prediction is non-decreasing in debt_to_income when all other features are held fixed. It can cost a little accuracy but makes the model more defensible and robust.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "A guard rail: the prediction can only go one way as this feature rises.", "mech": "The constraint forces predictions to be non-decreasing in debt-to-income, holding the other features fixed.", "breaks": "More defensible, at a small cost in accuracy.", "contrast": "It doesn't force the raw marginal data trend.", "details": "That's correct, and it's the use case the XGBoost and LightGBM docs describe. The guarantee holds with other features fixed (ceteris paribus), not along the raw marginal relationship in the data.", "why": "The constraint forces predictions to be non-decreasing in debt-to-income, holding the other features fixed."}, {"id": "gbm-23", "sub": "Imbalance & calibration", "difficulty": "Medium", "title": "Calibrating a GBM", "prompt": "A GBM's probabilities look over-confident. The AI fits isotonic regression to fix it.", "ai": "Fit `IsotonicRegression` on the model's predictions on the **training set** against y_train, then apply it to new predictions. Isotonic is non-parametric, so it fixes any miscalibration.", "verdict": "wrong", "bug": "Calibrating on the training predictions", "fix": "Fit the calibrator on held-out/OOF predictions; check a reliability diagram and Brier score on a separate test set.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Don't calibrate a scale with the weights it was built on.", "mech": "Training predictions are overconfident, so a calibrator fit on them learns the wrong mapping.", "breaks": "Fit on held-out or out-of-fold predictions.", "contrast": "With lots of held-out data, isotonic is great. With little, use Platt.", "details": "Training-set predictions are over-fit and more extreme than out-of-sample ones, so a calibrator fit on them learns the wrong mapping. Use a held-out calibration set or cross-validated predictions (sklearn `CalibratedClassifierCV` with cv). Isotonic also needs a fair amount of data (with small samples, Platt/sigmoid scaling is safer) and can overfit.", "why": "Calibrating on the training predictions"}, {"id": "gbm-24", "sub": "Constraints & tuning", "difficulty": "Medium", "title": "A sane tuning order", "prompt": "You have limited compute. Outline a GBM tuning strategy.", "ai": "1) Fix a fairly high learning rate (~0.05–0.1) and use early stopping to choose the number of rounds. 2) Tune tree complexity (max_depth/num_leaves, min_child_weight/min_data_in_leaf). 3) Tune sampling (subsample, colsample) and regularization (lambda, alpha, gamma). 4) Lower the learning rate and re-run early stopping for the final model. Use Bayesian optimization or random search over a CV split that matches deployment (time-based if needed), not a full grid.", "verdict": "correct", "fix": "—", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "bug": "", "model": "Rough in the frame, then fine-tune the details.", "mech": "Fix a fast learning rate with early stopping, tune structure, then randomness and penalties, then slow down for the final fit.", "breaks": "Random or Bayesian search beats grids. Features and leakage matter more than tuning.", "contrast": "Grid-searching n_estimators wastes compute; early stopping does it for free.", "details": "This staged approach is standard and appears in community guides and the LightGBM parameter-tuning docs. Random or Bayesian search beats grid search when only a few hyperparameters matter (Bergstra & Bengio 2012).", "why": "Fix a fast learning rate with early stopping, tune structure, then randomness and penalties, then slow down for the final fit."}, {"id": "gbm-25", "sub": "XGBoost vs LightGBM vs CatBoost", "difficulty": "Medium", "title": "Can XGBoost grow leaf-wise?", "prompt": "\"What's the difference in how XGBoost and LightGBM grow trees?\"", "ai": "LightGBM grows leaf-wise (best-first) and XGBoost grows level-wise (depth-wise). XGBoost **cannot** grow trees leaf-wise, which is the main reason LightGBM is more accurate.", "verdict": "wrong", "bug": "XGBoost supports grow_policy='lossguide'", "fix": "Defaults: XGBoost depthwise, LightGBM leaf-wise; XGBoost can do leaf-wise via grow_policy='lossguide'. Neither is universally more accurate.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "XGBoost's default is careful level-by-level growth, but it has a greedy mode too.", "mech": "grow_policy='lossguide' gives leaf-wise growth like LightGBM.", "breaks": "Neither library is universally more accurate. Validate.", "contrast": "LightGBM can be constrained to grow more like depth-wise.", "details": "The defaults are right, but XGBoost has `grow_policy='lossguide'` (with the hist method) for leaf-wise growth, plus max_leaves. Leaf-wise growth also isn't automatically more accurate. It reaches lower loss with the same number of leaves, but it can overfit small data. Differences in speed and accuracy between tuned libraries are usually small and depend on the dataset.", "why": "XGBoost supports grow_policy='lossguide'"}, {"id": "gbm-26", "sub": "Fundamentals", "difficulty": "Medium", "title": "Forecasting a growing trend", "prompt": "Monthly credits grew linearly from 100 to 340 over 24 months. The AI trains a GBM on `month_index` and forecasts month 30.", "ai": "The GBM picked up the upward trend, so it'll predict about 400 for month 30, continuing the line.", "verdict": "wrong", "bug": "Tree ensembles can't extrapolate beyond the training range", "fix": "Prediction ≈ last-leaf value (~340). Model the trend separately (e.g. predict growth/differences) and let the GBM handle residual structure.", "topic": "GBM deep dive", "track": "gbm", "lang": "text", "model": "Trees can only repeat answers they've seen. They can't draw the line further.", "mech": "Past the last split, every future month falls in the last leaf, so the forecast flattens.", "breaks": "Model the trend separately (differences, ratios) and let the GBM learn what's left.", "contrast": "Linear models extrapolate, sometimes too eagerly.", "details": "Tree predictions are piecewise constant. For any month_index beyond the last split, the prediction stays at the value of the last leaf, about 340. GBMs flatten out instead of extrapolating. Detrend first (model differences or ratios), use a linear base learner or linear_tree, or a model built for forecasting.", "why": "Tree ensembles can't extrapolate beyond the training range", "vis": "<figure class=\"vis\"><svg viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"Training data: linear growth 100 to 340 over 24 months\" class=\"chart\"><path class=\"ax\" d=\"M30,10 L30,145 L330,145\"/><text class=\"tx\" x=\"330\" y=\"162\" text-anchor=\"end\">month<\/text><text class=\"tx\" x=\"34\" y=\"14\">credits<\/text><path class=\"ln\" d=\"M30.0,132.5 L39.8,128.3 L49.7,124.2 L59.5,120.0 L69.3,115.8 L79.2,111.7 L89.0,107.5 L98.8,103.3 L108.7,99.2 L118.5,95.0 L128.3,90.8 L138.2,86.7 L148.0,82.5 L157.8,78.3 L167.7,74.2 L177.5,70.0 L187.3,65.8 L197.2,61.7 L207.0,57.5 L216.8,53.3 L226.7,49.2 L236.5,45.0 L246.3,40.8 L256.2,36.7 L266.0,32.5\"/><circle class=\"dot\" cx=\"325\" cy=\"7.5\" r=\"4\"/><text class=\"tx\" x=\"319\" y=\"24.0\" text-anchor=\"end\">month 30?<\/text><\/svg><figcaption>Training data: linear gro
