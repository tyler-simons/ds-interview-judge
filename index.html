<script>
const Q=[{"id": "sql-01", "topic": "SQL", "sub": "Aggregation", "difficulty": "Easy", "title": "Revenue per customer", "prompt": "Using `orders`, return each customer's total revenue from **completed** orders only, highest first.", "ai": "SELECT customer_id, SUM(amount) AS revenue\nFROM orders\nWHERE status = 'completed'\nGROUP BY customer_id\nORDER BY revenue DESC;", "verdict": "correct", "fix": "-- Equivalent alternative (conditional aggregation, then drop zero rows)\nSELECT customer_id, SUM(CASE WHEN status='completed' THEN amount END) AS revenue\nFROM orders GROUP BY customer_id\nHAVING SUM(CASE WHEN status='completed' THEN amount END) IS NOT NULL\nORDER BY revenue DESC;", "lang": "sql", "data": "orders(order_id INTEGER, customer_id INTEGER, amount DECIMAL(10,2), status VARCHAR, order_date DATE)\n order_id  customer_id  amount    status order_date\n        1          101    40.0 completed 2026-01-03\n        2          102    25.5 completed 2026-01-04\n        3          101    60.0  refunded 2026-01-10\n        4          103    90.0 completed 2026-02-01\n        5          102    30.0 completed 2026-02-11\n        6          101    15.0 completed 2026-02-20\n        7          104    55.0 cancelled 2026-03-02", "bug": "", "track": "general", "model": "WHERE is the bouncer at the door; GROUP BY counts only who got in.", "mech": "Rows that aren't 'completed' are turned away before anything is added up, so each customer's total only includes real revenue.", "breaks": "Works because the filter applies before the grouping. It breaks if you filter after aggregating, or if the 'completed' label is unreliable.", "contrast": "If you needed customers with zero completed revenue too, you'd start from the customers table with a LEFT JOIN.", "details": "Filtering in WHERE before grouping is exactly right: refunded/cancelled rows never enter the sum, and customers with no completed orders (104) are correctly absent. Output: 103 → 90.00, 102 → 55.50, 101 → 55.00.", "why": "Rows that aren't 'completed' are turned away before anything is added up, so each customer's total only includes real revenue."}, {"id": "sql-02", "topic": "SQL", "sub": "Aggregation", "difficulty": "Easy", "title": "Daily active users", "prompt": "`logins` has one row per login event (users can log in many times a day). Return DAU: the number of **unique users** per calendar day.", "ai": "SELECT CAST(login_ts AS DATE) AS day, COUNT(*) AS dau\nFROM logins\nGROUP BY 1\nORDER BY 1;", "verdict": "wrong", "bug": "COUNT(*) vs COUNT(DISTINCT)", "fix": "SELECT CAST(login_ts AS DATE) AS day, COUNT(DISTINCT user_id) AS dau\nFROM logins\nGROUP BY 1\nORDER BY 1;", "lang": "sql", "data": "logins(user_id INTEGER, login_ts TIMESTAMP)\n user_id            login_ts\n       1 2026-05-01 08:00:00\n       1 2026-05-01 19:30:00\n       2 2026-05-01 09:10:00\n       3 2026-05-01 12:00:00\n       1 2026-05-02 07:45:00\n       2 2026-05-02 10:00:00\n       2 2026-05-02 22:15:00", "track": "general", "model": "Count people, not footsteps.", "mech": "COUNT(*) counts every login event, so a user who logs in twice counts twice. DAU asks how many distinct people showed up.", "breaks": "Event tables almost always have repeats. COUNT(DISTINCT user_id) is the people counter.", "contrast": "COUNT(*) is right when the question is about activity volume (logins per day), not users.", "details": "COUNT(*) counts login events, not users. User 1 logs in twice on May 1 and user 2 twice on May 2, so the AI returns 4 and 3 instead of 3 and 2.", "why": "COUNT(*) vs COUNT(DISTINCT)"}, {"id": "sql-03", "topic": "SQL", "sub": "Joins", "difficulty": "Easy", "title": "Order counts incl. zero", "prompt": "List **every** customer with their number of orders placed in 2026. Customers with no 2026 orders must appear with 0.", "ai": "SELECT c.customer_id, c.name, COUNT(o.order_id) AS orders_2026\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.customer_id\nWHERE o.order_date >= DATE '2026-01-01'\nGROUP BY c.customer_id, c.name\nORDER BY c.customer_id;", "verdict": "wrong", "bug": "WHERE filter turns LEFT JOIN into INNER JOIN", "fix": "SELECT c.customer_id, c.name, COUNT(o.order_id) AS orders_2026\nFROM customers c\nLEFT JOIN orders o\n  ON o.customer_id = c.customer_id\n AND o.order_date >= DATE '2026-01-01'\nGROUP BY c.customer_id, c.name\nORDER BY c.customer_id;", "lang": "sql", "data": "customers(customer_id INTEGER, name VARCHAR)\n customer_id name\n         101  Ava\n         102  Ben\n         103   Cy\n         104  Dee\n\norders(order_id INTEGER, customer_id INTEGER, amount DECIMAL(10,2), status VARCHAR, order_date DATE)\n order_id  customer_id  amount    status order_date\n        1          101    40.0 completed 2026-01-03\n        2          102    25.5 completed 2026-01-04\n        3          101    60.0  refunded 2026-01-10\n        4          103    90.0 completed 2026-02-01\n        5          102    30.0 completed 2026-02-11\n        6          101    15.0 completed 2026-02-20\n        7          104    55.0 cancelled 2025-12-30", "track": "general", "model": "A LEFT JOIN promises to keep everyone on the left, and WHERE can quietly break that promise.", "mech": "Customers with no matching orders get NULLs. A WHERE condition on the orders table then throws those NULL rows away, which turns the LEFT JOIN back into an INNER JOIN.", "breaks": "Conditions in ON shape the match; conditions in WHERE filter the result. Put conditions on the right-hand table in ON.", "contrast": "A WHERE condition on the *left* table (e.g. only active customers) is fine.", "details": "The filter on the right table sits in WHERE, so rows where `o.order_date` is NULL (no match) or from 2025 are removed after the join. Dee (only a 2025 order) disappears instead of showing 0. Move the date condition into the ON clause.", "why": "WHERE filter turns LEFT JOIN into INNER JOIN"}, {"id": "sql-04", "topic": "SQL", "sub": "Joins", "difficulty": "Easy", "title": "Never purchased", "prompt": "Return the user_ids of users who signed up but have **never** made a purchase.", "ai": "SELECT u.user_id\nFROM users u\nWHERE NOT EXISTS (\n  SELECT 1 FROM purchases p WHERE p.user_id = u.user_id\n)\nORDER BY u.user_id;", "verdict": "correct", "fix": "-- Equivalent LEFT JOIN anti-join\nSELECT u.user_id FROM users u\nLEFT JOIN purchases p ON p.user_id = u.user_id\nWHERE p.purchase_id IS NULL\nORDER BY u.user_id;", "lang": "sql", "data": "purchases(purchase_id INTEGER, user_id INTEGER, amount DECIMAL(8,2))\n purchase_id  user_id  amount\n          10        1    20.0\n          11        1    35.0\n          12        3    12.0\n\nusers(user_id INTEGER, signup_date DATE)\n user_id signup_date\n       1  2026-03-01\n       2  2026-03-02\n       3  2026-03-02\n       4  2026-03-05", "bug": "", "track": "general", "model": "'Never did X' means checking an empty list for each person.", "mech": "NOT EXISTS asks, for each user, whether any matching purchase row exists, and keeps them when none does.", "breaks": "It's safe with NULLs and never duplicates rows. NOT IN breaks if the subquery has a NULL.", "contrast": "A LEFT JOIN … WHERE p.id IS NULL is the other safe anti-join.", "details": "NOT EXISTS is the safest anti-join: it's NULL-safe and doesn't duplicate rows. Returns users 2 and 4.", "why": "NOT EXISTS asks, for each user, whether any matching purchase row exists, and keeps them when none does."}, {"id": "sql-05", "topic": "SQL", "sub": "Aggregation", "difficulty": "Easy", "title": "Repeat customers", "prompt": "Using `orders`, find customers with **2 or more completed** orders, and show how many they have.", "ai": "SELECT customer_id, COUNT(*) AS n_completed\nFROM orders\nWHERE status = 'completed'\nGROUP BY customer_id\nHAVING COUNT(*) >= 2\nORDER BY customer_id;", "verdict": "correct", "fix": "SELECT customer_id, n FROM (\n  SELECT customer_id, SUM(CASE WHEN status='completed' THEN 1 ELSE 0 END) AS n\n  FROM orders GROUP BY customer_id) t\nWHERE n >= 2 ORDER BY customer_id;", "lang": "sql", "data": "orders(order_id INTEGER, customer_id INTEGER, amount DECIMAL(10,2), status VARCHAR, order_date DATE)\n order_id  customer_id  amount    status order_date\n        1          101    40.0 completed 2026-01-03\n        2          102    25.5 completed 2026-01-04\n        3          101    60.0  refunded 2026-01-10\n        4          103    90.0 completed 2026-02-01\n        5          102    30.0 completed 2026-02-11\n        6          101    15.0 completed 2026-02-20\n        7          104    55.0 cancelled 2026-03-02", "bug": "", "track": "general", "model": "WHERE filters people at the door; HAVING filters the groups after they've formed.", "mech": "Only completed orders get counted, then customers with 2 or more are kept.", "breaks": "Works when you want to count only qualifying rows. Breaks if you need 'customers whose total orders ≥2, any status' (move the status check).", "contrast": "COUNT(DISTINCT) only matters if order_id could repeat.", "details": "WHERE filters rows before grouping, HAVING filters groups after. Since order_id is unique, COUNT(*) equals COUNT(DISTINCT order_id). Result: 101 (2), 102 (2).", "why": "Only completed orders get counted, then customers with 2 or more are kept."}, {"id": "sql-06", "topic": "SQL", "sub": "Window functions", "difficulty": "Medium", "title": "Top 3 salary levels", "prompt": "For each department, return all employees whose salary is among the **top 3 distinct salary values** in that department (ties all included).", "ai": "WITH r AS (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS rn\n  FROM employees\n)\nSELECT dept, emp_id, salary FROM r\nWHERE rn <= 3\nORDER BY dept, salary DESC, emp_id;", "verdict": "wrong", "bug": "ROW_NUMBER instead of DENSE_RANK", "fix": "WITH r AS (\n  SELECT *, DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rk\n  FROM employees\n)\nSELECT dept, emp_id, salary FROM r\nWHERE rk <= 3\nORDER BY dept, salary DESC, emp_id;", "lang": "sql", "data": "employees(emp_id INTEGER, dept VARCHAR, salary INTEGER)\n emp_id dept  salary\n      1  eng     200\n      2  eng     180\n      3  eng     180\n      4  eng     150\n      5  eng     120\n      6  ops      90\n      7  ops      85\n      8  ops      70", "track": "general", "model": "Medals vs seat numbers: ties should share a medal.", "mech": "ROW_NUMBER hands out unique seat numbers even to tied salaries, so the top-3 cut drops people who tied. DENSE_RANK gives ties the same rank with no gaps.", "breaks": "Pick the ranking function by asking how ties should be treated.", "contrast": "RANK leaves gaps after ties (1,1,3). That's right when the question means 'top 3 people,' not 'top 3 salary levels.'", "details": "ROW_NUMBER gives tied salaries different numbers, so it returns exactly 3 rows per department. In eng the top 3 *distinct* salaries are 200, 180, 150 → emp 1,2,3,4 should all appear; the AI drops emp 4 (150). DENSE_RANK assigns tied values the same rank without gaps.", "why": "ROW_NUMBER instead of DENSE_RANK"}, {"id": "sql-07", "topic": "SQL", "sub": "Window functions", "difficulty": "Medium", "title": "Month-over-month growth", "prompt": "Compute month-over-month revenue growth as a percentage, rounded to 1 decimal. The first month should be NULL.", "ai": "SELECT month, revenue,\n  ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month))\n        / LAG(revenue) OVER (ORDER BY month), 1) AS mom_pct\nFROM monthly_revenue\nORDER BY month;", "verdict": "correct", "fix": "SELECT a.month, a.revenue, ROUND(100.0*(a.revenue-b.revenue)/b.revenue,1) AS mom_pct\nFROM monthly_revenue a LEFT JOIN monthly_revenue b\n  ON b.month = a.month - INTERVAL 1 MONTH\nORDER BY a.month;", "lang": "sql", "data": "monthly_revenue(month DATE, revenue DECIMAL(12,2))\n     month  revenue\n2026-01-01   1000.0\n2026-02-01   1200.0\n2026-03-01    900.0\n2026-04-01   1350.0", "bug": "", "track": "general", "model": "Growth is today compared to yesterday's baseline.", "mech": "LAG brings last month's value onto this month's row, so you can divide by the previous month.", "breaks": "Breaks if months are missing (LAG grabs the wrong month) or if the baseline is zero.", "contrast": "Dividing by the current month gives a different, wrong number.", "details": "LAG over the month order gives the prior value; dividing by the prior month (not the current) is the right denominator, and the first row is NULL automatically. Results: NULL, 20.0, -25.0, 50.0.", "why": "LAG brings last month's value onto this month's row, so you can divide by the previous month."}, {"id": "sql-08", "topic": "SQL", "sub": "Window functions", "difficulty": "Medium", "title": "7-day rolling average", "prompt": "`daily_signups` has exactly one row per day with no gaps. Return a trailing **7-day** rolling average of signups (today plus the previous 6 days).", "ai": "SELECT day,\n  AVG(signups) OVER (ORDER BY day\n    ROWS BETWEEN 7 PRECEDING AND CURRENT ROW) AS avg_7d\nFROM daily_signups\nORDER BY day;", "verdict": "wrong", "bug": "Off-by-one window frame", "fix": "SELECT day,\n  AVG(signups) OVER (ORDER BY day\n    ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) AS avg_7d\nFROM daily_signups\nORDER BY day;", "lang": "sql", "data": "daily_signups(day DATE, signups INTEGER)\n       day  signups\n2026-06-01       10\n2026-06-02       17\n2026-06-03       24\n2026-06-04       31\n2026-06-05       15\n2026-06-06       22\n2026-06-07       29\n2026-06-08       13\n2026-06-09       20\n2026-06-10       27\n2026-06-11       11\n2026-06-12       18", "track": "general", "model": "A fence with 7 posts covers 7 days. Count the posts, not the gaps.", "mech": "'6 PRECEDING + current row' is 7 rows. '7 PRECEDING' quietly makes it 8.", "breaks": "Off-by-one errors in frames look fine at first and drift later. Also, row frames only equal day frames when there are no gaps in dates.", "contrast": "With gappy dates, use a RANGE / interval frame instead.", "details": "`7 PRECEDING AND CURRENT ROW` covers 8 rows. A 7-day window including today needs `6 PRECEDING`. The values match for the first 7 days and then diverge.", "why": "Off-by-one window frame"}, {"id": "sql-09", "topic": "SQL", "sub": "Window functions", "difficulty": "Medium", "title": "First order per customer", "prompt": "Return each customer's **first** order (earliest order_date; break ties by lowest order_id), any status.", "ai": "SELECT customer_id, order_id, order_date, amount\nFROM (\n  SELECT *, ROW_NUMBER() OVER (\n    PARTITION BY customer_id ORDER BY order_date, order_id) AS rn\n  FROM orders\n) t\nWHERE rn = 1\nORDER BY customer_id;", "verdict": "correct", "fix": "SELECT o.customer_id, o.order_id, o.order_date, o.amount FROM orders o\nWHERE o.order_id = (SELECT MIN(order_id) FROM orders x WHERE x.customer_id=o.customer_id\n  AND x.order_date = (SELECT MIN(order_date) FROM orders y WHERE y.customer_id=o.customer_id))\nORDER BY o.customer_id;", "lang": "sql", "data": "orders(order_id INTEGER, customer_id INTEGER, amount DECIMAL(10,2), status VARCHAR, order_date DATE)\n order_id  customer_id  amount    status order_date\n        1          101    40.0 completed 2026-01-03\n        2          102    25.5 completed 2026-01-04\n        3          101    60.0  refunded 2026-01-10\n        4          103    90.0 completed 2026-02-01\n        5          102    30.0 completed 2026-02-11\n        6          101    15.0 completed 2026-02-20\n        7          104    55.0 cancelled 2026-03-02", "bug": "", "track": "general", "model": "Line everyone up by date and take the first in each line.", "mech": "ROW_NUMBER partitioned by customer and ordered by date and id gives exactly one '1' per customer.", "breaks": "The tiebreaker makes it deterministic. Without it, ties can return a random row.", "contrast": "RANK would return several rows on ties.", "details": "ROW_NUMBER with a deterministic tiebreaker returns exactly one row per customer. Here ROW_NUMBER (not RANK) is right because the question wants one row.", "why": "ROW_NUMBER partitioned by customer and ordered by date and id gives exactly one '1' per customer."}, {"id": "sql-10", "topic": "SQL", "sub": "Subqueries", "difficulty": "Medium", "title": "Users who never referred anyone", "prompt": "`accounts.referrer_id` is the user who referred them (NULL if organic). Return users who have **never referred** anyone.", "ai": "SELECT user_id\nFROM accounts\nWHERE user_id NOT IN (SELECT referrer_id FROM accounts)\nORDER BY user_id;", "verdict": "wrong", "bug": "NOT IN with NULLs", "fix": "SELECT a.user_id FROM accounts a\nWHERE NOT EXISTS (SELECT 1 FROM accounts r WHERE r.referrer_id = a.user_id)\nORDER BY a.user_id;", "lang": "sql", "data": "accounts(user_id INTEGER, referrer_id INTEGER)\n user_id  referrer_id\n       1         <NA>\n       2            1\n       3            1\n       4         <NA>\n       5            3", "track": "general", "model": "NULL is 'I don't know,' and 'not in a list containing unknown' is also unknown.", "mech": "x NOT IN (1, 3, NULL) can't be confirmed true for any x, so every row gets filtered out.", "breaks": "This silent failure is a classic interview trap. Use NOT EXISTS or filter out NULLs.", "contrast": "NOT IN is fine when the column is guaranteed NOT NULL.", "details": "The subquery contains NULLs. `x NOT IN (1, 3, NULL)` evaluates to UNKNOWN for every x, so the query returns **zero rows** instead of users 2, 4, 5. Use NOT EXISTS, or filter NULLs inside the subquery.", "why": "NOT IN with NULLs"}, {"id": "sql-11", "topic": "SQL", "sub": "Joins", "difficulty": "Medium", "title": "Revenue and units per customer", "prompt": "Per customer, return total revenue (sum of `order_total`) and total units (sum of `qty`).", "ai": "SELECT o.customer_id,\n       SUM(o.order_total) AS revenue,\n       SUM(i.qty)         AS units\nFROM orders o\nJOIN order_items i ON i.order_id = o.order_id\nGROUP BY o.customer_id\nORDER BY o.customer_id;", "verdict": "wrong", "bug": "Join fan-out double counts", "fix": "WITH u AS (SELECT order_id, SUM(qty) AS units FROM order_items GROUP BY order_id)\nSELECT o.customer_id, SUM(o.order_total) AS revenue, SUM(u.units) AS units\nFROM orders o LEFT JOIN u ON u.order_id = o.order_id\nGROUP BY o.customer_id\nORDER BY o.customer_id;", "lang": "sql", "data": "orders(order_id INTEGER, customer_id INTEGER, order_total DECIMAL(8,2))\n order_id  customer_id  order_total\n        1            7         50.0\n        2            7         20.0\n        3            8        100.0\n\norder_items(order_id INTEGER, sku VARCHAR, qty INTEGER)\n order_id sku  qty\n        1   A    1\n        1   B    2\n        2   A    1\n        3   C    1\n        3   D    1\n        3   E    3", "track": "general", "model": "Joining a parent to its children photocopies the parent once per child.", "mech": "Each order total gets repeated once per line item, so summing it counts the order several times.", "breaks": "Aggregate each table to the same grain (order level) before joining.", "contrast": "Summing qty from line items is fine; it's the order-level column that inflates.", "details": "Joining to line items repeats each order_total once per item. Customer 7's revenue becomes 50+50+20=120 (true 70), and customer 8 becomes 300 (true 100). Aggregate items to order grain before joining.", "why": "Join fan-out double counts"}, {"id": "sql-12", "topic": "SQL", "sub": "Conditional aggregation", "difficulty": "Medium", "title": "Mobile share by day", "prompt": "For each day, what fraction of sessions were on mobile? Round to 3 decimals.", "ai": "SELECT day,\n  ROUND(AVG(CASE WHEN device = 'mobile' THEN 1.0 ELSE 0.0 END), 3) AS mobile_share\nFROM sessions\nGROUP BY day\nORDER BY day;", "verdict": "correct", "fix": "SELECT day, ROUND(1.0*COUNT(*) FILTER (WHERE device='mobile')/COUNT(*),3) AS mobile_share\nFROM sessions GROUP BY day ORDER BY day;", "lang": "sql", "data": "sessions(session_id INTEGER, day DATE, device VARCHAR)\n session_id        day  device\n          1 2026-07-01  mobile\n          2 2026-07-01 desktop\n          3 2026-07-01  mobile\n          4 2026-07-02 desktop\n          5 2026-07-02  tablet\n          6 2026-07-02  mobile\n          7 2026-07-02 desktop", "bug": "", "track": "general", "model": "The average of a yes/no flag is a percentage.", "mech": "Turn mobile into 1/0 and average per day, and you get the mobile share.", "breaks": "Use 1.0 to avoid integer division in some databases.", "contrast": "SUM(flag)/COUNT(*) is the same thing written out.", "details": "Averaging a 0/1 indicator is a share. Using 1.0/0.0 avoids integer-division trouble in Postgres. Results: 0.667, 0.250.", "why": "Turn mobile into 1/0 and average per day, and you get the mobile share."}, {"id": "sql-13", "topic": "SQL", "sub": "Dates", "difficulty": "Medium", "title": "January payments", "prompt": "`paid_at` is a TIMESTAMP. Return the total amount paid in **January 2026**.", "ai": "SELECT SUM(amount) AS jan_total\nFROM payments\nWHERE paid_at BETWEEN '2026-01-01' AND '2026-01-31';", "verdict": "wrong", "bug": "BETWEEN on timestamps drops the last day", "fix": "SELECT SUM(amount) AS jan_total\nFROM payments\nWHERE paid_at >= TIMESTAMP '2026-01-01'\n  AND paid_at <  TIMESTAMP '2026-02-01';", "lang": "sql", "data": "payments(payment_id INTEGER, paid_at TIMESTAMP, amount DECIMAL(8,2))\n payment_id             paid_at  amount\n          1 2026-01-01 00:05:00    10.0\n          2 2026-01-15 12:00:00    20.0\n          3 2026-01-31 00:00:00    30.0\n          4 2026-01-31 18:42:00    40.0\n          5 2026-02-01 00:00:00    50.0", "track": "general", "model": "A date without a time means midnight, the very start of the day.", "mech": "BETWEEN … '2026-01-31' stops at 00:00 on Jan 31, so payments later that day get dropped.", "breaks": "Half-open ranges (≥ start, < next start) never miss the edge.", "contrast": "For a DATE column (no time), BETWEEN works fine.", "details": "'2026-01-31' is cast to midnight, so anything later on Jan 31 (the 18:42 payment of 40) is excluded: the AI returns 60 instead of 100. Use a half-open range: `>= '2026-01-01' AND < '2026-02-01'`.", "why": "BETWEEN on timestamps drops the last day"}, {"id": "sql-14", "topic": "SQL", "sub": "Window functions", "difficulty": "Medium", "title": "Running spend per customer", "prompt": "For every order, show the customer's cumulative spend up to and including that order (order by date, then order_id).", "ai": "SELECT customer_id, order_id, order_date, amount,\n  SUM(amount) OVER (\n    PARTITION BY customer_id\n    ORDER BY order_date, order_id\n    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_spend\nFROM orders\nORDER BY customer_id, order_date, order_id;", "verdict": "correct", "fix": "SELECT o.customer_id, o.order_id, o.order_date, o.amount,\n  (SELECT SUM(x.amount) FROM orders x WHERE x.customer_id=o.customer_id\n     AND (x.order_date < o.order_date OR (x.order_date=o.order_date AND x.order_id<=o.order_id))) AS running_spend\nFROM orders o ORDER BY 1,3,2;", "lang": "sql", "data": "orders(order_id INTEGER, customer_id INTEGER, amount DECIMAL(10,2), status VARCHAR, order_date DATE)\n order_id  customer_id  amount    status order_date\n        1          101    40.0 completed 2026-01-03\n        2          102    25.5 completed 2026-01-04\n        3          101    60.0  refunded 2026-01-10\n        4          103    90.0 completed 2026-02-01\n        5          102    30.0 completed 2026-02-11\n        6          101    15.0 completed 2026-02-20\n        7          104    55.0 cancelled 2026-03-02", "bug": "", "track": "general", "model": "A running total is a snowball rolling down each customer's timeline.", "mech": "SUM over a window partitioned by customer, with an explicit row-by-row frame, adds each order to everything before it.", "breaks": "ROWS keeps same-date orders separate. The default RANGE frame lumps ties together.", "contrast": "Without PARTITION BY, the snowball would roll across all customers.", "details": "Partitioning by customer and using an explicit ROWS frame gives a true running total, even if two orders share a date (the default RANGE frame would lump ties together).", "why": "SUM over a window partitioned by customer, with an explicit row-by-row frame, adds each order to everything before it."}, {"id": "sql-15", "topic": "SQL", "sub": "Window functions", "difficulty": "Medium", "title": "Second-highest salary", "prompt": "Return the **second-highest distinct** salary in each department (NULL departments not needed).", "ai": "SELECT DISTINCT dept, salary\nFROM (\n  SELECT dept, salary,\n         DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rk\n  FROM employees\n) t\nWHERE rk = 2\nORDER BY dept;", "verdict": "correct", "fix": "SELECT dept, MAX(salary) AS salary FROM employees e\nWHERE salary < (SELECT MAX(salary) FROM employees x WHERE x.dept=e.dept)\nGROUP BY dept ORDER BY dept;", "lang": "sql", "data": "employees(emp_id INTEGER, dept VARCHAR, salary INTEGER)\n emp_id dept  salary\n      1  eng     200\n      2  eng     180\n      3  eng     180\n      4  eng     150\n      5  eng     120\n      6  ops      90\n      7  ops      85\n      8  ops      70", "bug": "", "track": "general", "model": "The silver medal goes to the second-best *score*, not the second-best person.", "mech": "DENSE_RANK lets tied salaries share rank 1, so rank 2 is the next distinct salary.", "breaks": "DISTINCT removes the duplicates when several people share the silver salary.", "contrast": "ROW_NUMBER = 2 would return someone tied for first.", "details": "DENSE_RANK makes tied salaries share rank 1 and the next distinct value rank 2. DISTINCT collapses ties at rank 2 (eng has two people at 180). Results: eng 180, ops 85.", "why": "DENSE_RANK lets tied salaries share rank 1, so rank 2 is the next distinct salary."}, {"id": "sql-16", "topic": "SQL", "sub": "Gaps & islands", "difficulty": "Hard", "title": "Longest activity streak", "prompt": "`activity` may contain duplicate rows for the same user and day. Return each user's **longest streak of consecutive active days**.", "ai": "WITH g AS (\n  SELECT user_id, active_date,\n         active_date - CAST(ROW_NUMBER() OVER (\n             PARTITION BY user_id ORDER BY active_date) AS INT) AS grp\n  FROM activity\n)\nSELECT user_id, MAX(len) AS longest_streak\nFROM (SELECT user_id, grp, COUNT(DISTINCT active_date) AS len\n      FROM g GROUP BY user_id, grp) s\nGROUP BY user_id\nORDER BY user_id;", "verdict": "wrong", "bug": "Didn't dedupe before ROW_NUMBER", "fix": "WITH d AS (SELECT DISTINCT user_id, active_date FROM activity),\ng AS (SELECT user_id, active_date,\n        active_date - CAST(ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY active_date) AS INT) AS grp\n      FROM d)\nSELECT user_id, MAX(len) AS longest_streak\nFROM (SELECT user_id, grp, COUNT(*) AS len FROM g GROUP BY user_id, grp) s\nGROUP BY user_id ORDER BY user_id;", "lang": "sql", "data": "activity(user_id INTEGER, active_date DATE)\n user_id active_date\n       1  2026-08-01\n       1  2026-08-02\n       1  2026-08-02\n       1  2026-08-03\n       1  2026-08-06\n       2  2026-08-01\n       2  2026-08-03\n       2  2026-08-04", "track": "general", "model": "Consecutive days minus a counter stays constant, until the streak breaks.", "mech": "Number each user's days 1, 2, 3… and subtract that from the date. Consecutive days share the same result, which acts as a group id.", "breaks": "It only works if each day appears once. A duplicate shifts the counter and splits the streak.", "contrast": "Dedupe first, and the trick is reliable.", "details": "The date-minus-row-number trick only works if each date appears once. User 1's duplicate Aug 2 row bumps the row number, so Aug 3 lands in a different group and the streak reads 2 instead of 3. Deduplicate first (SELECT DISTINCT), then number the rows.", "why": "Didn't dedupe before ROW_NUMBER"}, {"id": "sql-17", "topic": "SQL", "sub": "Cohorts / retention", "difficulty": "Hard", "title": "Day-7 retention by cohort", "prompt": "Day-7 retention = share of a signup-date cohort that had any event **exactly 7 days** after signup. Return it per signup_date, rounded to 3 decimals; cohorts with zero retained users must show 0.", "ai": "SELECT s.signup_date,\n  ROUND(COUNT(DISTINCT e.user_id) * 1.0 / COUNT(DISTINCT s.user_id), 3) AS d7_retention\nFROM signups s\nLEFT JOIN events e\n  ON e.user_id = s.user_id\n AND e.event_date = s.signup_date + 7\nGROUP BY s.signup_date\nORDER BY s.signup_date;", "verdict": "correct", "fix": "SELECT signup_date, ROUND(AVG(r),3) AS d7_retention FROM (\n  SELECT s.signup_date, CASE WHEN EXISTS (SELECT 1 FROM events e WHERE e.user_id=s.user_id\n     AND e.event_date = s.signup_date + 7) THEN 1.0 ELSE 0.0 END AS r FROM signups s) t\nGROUP BY 1 ORDER BY 1;", "lang": "sql", "data": "events(user_id INTEGER, event_date DATE)\n user_id event_date\n       1 2026-09-08\n       1 2026-09-08\n       2 2026-09-07\n       3 2026-09-08\n       4 2026-09-09\n       5 2026-09-03\n\nsignups(user_id INTEGER, signup_date DATE)\n user_id signup_date\n       1  2026-09-01\n       2  2026-09-01\n       3  2026-09-01\n       4  2026-09-02\n       5  2026-09-02", "bug": "", "track": "general", "model": "Keep the whole class in the denominator, and only count who came back on day 7.", "mech": "With the day-7 condition in the LEFT JOIN's ON, every signup stays, and only qualifying returns are matched.", "breaks": "Putting the condition in WHERE would drop non-returners and inflate retention.", "contrast": "COUNT(DISTINCT) protects against duplicate events.", "details": "The day-7 condition is in the LEFT JOIN's ON clause, so every signup stays in the denominator. COUNT(DISTINCT) handles user 1's duplicate events. Results: Sept 1 → 2/3 = 0.667 (user 2 came back on day 6, which doesn't count), Sept 2 → 1/2 = 0.5.", "why": "With the day-7 condition in the LEFT JOIN's ON, every signup stays, and only qualifying returns are matched."}, {"id": "sql-18", "topic": "SQL", "sub": "Funnels", "difficulty": "Hard", "title": "Cart → purchase conversion", "prompt": "Among users who added to cart, what share made a purchase **after** their first add_to_cart? Round to 2 decimals.", "ai": "WITH carts AS (SELECT DISTINCT user_id FROM funnel WHERE event='add_to_cart'),\nbuys AS (SELECT DISTINCT user_id FROM funnel WHERE event='purchase')\nSELECT ROUND(COUNT(b.user_id) * 1.0 / COUNT(c.user_id), 2) AS conv\nFROM carts c LEFT JOIN buys b ON b.user_id = c.user_id;", "verdict": "wrong", "bug": "Ignores event ordering", "fix": "WITH c AS (SELECT user_id, MIN(ts) AS cart_ts FROM funnel WHERE event='add_to_cart' GROUP BY user_id)\nSELECT ROUND(AVG(CASE WHEN EXISTS (SELECT 1 FROM funnel f WHERE f.user_id=c.user_id\n   AND f.event='purchase' AND f.ts > c.cart_ts) THEN 1.0 ELSE 0.0 END), 2) AS conv\nFROM c;", "lang": "sql", "data": "funnel(user_id INTEGER, event VARCHAR, ts TIMESTAMP)\n user_id       event                  ts\n       1 add_to_cart 2026-04-01 10:00:00\n       1    purchase 2026-04-01 10:05:00\n       2 add_to_cart 2026-04-01 11:00:00\n       3    purchase 2026-04-01 09:00:00\n       3 add_to_cart 2026-04-01 12:00:00\n       4 add_to_cart 2026-04-02 08:00:00\n       4    purchase 2026-04-02 09:00:00", "track": "general", "model": "A funnel is a story told in order. Buying before carting isn't the cart→purchase story.", "mech": "The AI counts any purchase, even one that happened before the cart event.", "breaks": "Funnels need event ordering by timestamp per user.", "contrast": "If the question had been 'carted and ever purchased,' order wouldn't matter.", "details": "The AI counts any purchase, including one that happened **before** the cart event. User 3 bought at 09:00 and added to cart at 12:00, so they shouldn't count. AI: 3/4 = 0.75, correct: 2/4 = 0.50.", "why": "Ignores event ordering"}, {"id": "sql-19", "topic": "SQL", "sub": "Window functions", "difficulty": "Hard", "title": "Latest status on every row", "prompt": "For each row in `status_log`, add a column `current_status` showing the user's **most recent** status overall.", "ai": "SELECT user_id, ts, status,\n  LAST_VALUE(status) OVER (PARTITION BY user_id ORDER BY ts) AS current_status\nFROM status_log\nORDER BY user_id, ts;", "verdict": "wrong", "bug": "Default window frame with LAST_VALUE", "fix": "SELECT user_id, ts, status,\n  LAST_VALUE(status) OVER (PARTITION BY user_id ORDER BY ts\n    ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS current_status\nFROM status_log\nORDER BY user_id, ts;", "lang": "sql", "data": "status_log(user_id INTEGER, ts TIMESTAMP, status VARCHAR)\n user_id         ts  status\n       1 2026-01-01   trial\n       1 2026-01-15    paid\n       1 2026-03-01 churned\n       2 2026-02-01   trial\n       2 2026-02-20    paid", "track": "general", "model": "LAST_VALUE only sees as far as the default window lets it, which is up to the current row.", "mech": "With ORDER BY, the window ends at the current row, so the 'last' value is the row itself.", "breaks": "Extend the frame to UNBOUNDED FOLLOWING, or flip the order and use FIRST_VALUE.", "contrast": "FIRST_VALUE with the default frame works because the start is unbounded.", "details": "With ORDER BY, the default frame is `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`, so LAST_VALUE just returns the current row's status. Extend the frame to UNBOUNDED FOLLOWING, or use FIRST_VALUE with ORDER BY ts DESC.", "why": "Default window frame with LAST_VALUE"}, {"id": "sql-20", "topic": "SQL", "sub": "Aggregation", "difficulty": "Hard", "title": "Median delivery time", "prompt": "Return the **median** delivery time per city (interpolate for an even count). Postgres/DuckDB syntax.", "ai": "SELECT city,\n  PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY minutes) AS median_minutes\nFROM deliveries\nGROUP BY city\nORDER BY city;", "verdict": "correct", "fix": "WITH r AS (SELECT city, minutes, ROW_NUMBER() OVER (PARTITION BY city ORDER BY minutes) rn,\n  COUNT(*) OVER (PARTITION BY city) n FROM deliveries)\nSELECT city, AVG(minutes) AS median_minutes FROM r\nWHERE rn IN (FLOOR((n+1)/2.0), CEIL((n+1)/2.0)) GROUP BY city ORDER BY city;", "lang": "sql", "data": "deliveries(delivery_id INTEGER, city VARCHAR, minutes INTEGER)\n delivery_id city  minutes\n           1   SF       22\n           2   SF       35\n           3   SF       28\n           4   SF       90\n           5   LA       30\n           6   LA       40\n           7   LA       25", "bug": "", "track": "general", "model": "The median is the middle person in line, so one giant at the end doesn't move them.", "mech": "PERCENTILE_CONT(0.5) sorts the values and interpolates between the two middle ones when the count is even.", "breaks": "Robust to outliers, which is why it's often a better 'typical' value than the mean for delivery times.", "contrast": "PERCENTILE_DISC returns an actual observed value instead of interpolating.", "details": "PERCENTILE_CONT interpolates between the two middle values. SF has (22, 28, 35, 90), so the median is 31.5, and the 90-minute outlier doesn't pull it up the way AVG (43.75) would. LA = 30.", "why": "PERCENTILE_CONT(0.5) sorts the values and interpolates between the two middle ones when the count is even."}, {"id": "pd-01", "topic": "pandas", "sub": "groupby", "difficulty": "Easy", "title": "Revenue by store", "prompt": "Return a DataFrame of total revenue per store, sorted from highest to lowest, with columns `store`, `revenue`.", "ai": "result = (sales.groupby(\"store\", as_index=False)[\"revenue\"].sum()\n                 .sort_values(\"revenue\", ascending=False)\n                 .reset_index(drop=True))", "verdict": "correct", "fix": "result = (sales.pivot_table(index=\"store\", values=\"revenue\", aggfunc=\"sum\")\n          .reset_index().sort_values(\"revenue\", ascending=False).reset_index(drop=True))", "lang": "python", "data": "import pandas as pd\nsales = pd.DataFrame({\n  \"store\":   [\"A\",\"A\",\"B\",\"B\",\"C\",\"C\",\"A\"],\n  \"product\": [\"tea\",\"coffee\",\"tea\",\"cake\",\"coffee\",\"cake\",\"tea\"],\n  \"revenue\": [12.0, 30.0, 8.0, 15.0, 22.0, 9.0, 5.0],\n})", "bug": "", "track": "general", "model": "Split, apply, combine.", "mech": "Group by store, sum revenue, and sort descending. as_index=False keeps store as a column.", "breaks": "Straightforward. Watch out for NaN keys, which groupby drops by default.", "contrast": "sort_values(ascending=True) would flip the order.", "details": "`as_index=False` keeps store as a column, sum aggregates, and the sort is descending. Results: A 47, B 23, C 31 → A, C, B.", "why": "Group by store, sum revenue, and sort descending."}, {"id": "pd-02", "topic": "pandas", "sub": "merge", "difficulty": "Easy", "title": "Tickets per user (incl. zero)", "prompt": "Return every user with their support ticket count (0 if none): columns `user_id`, `plan`, `n_tickets`, sorted by user_id.", "ai": "counts = tickets.groupby(\"user_id\").size().rename(\"n_tickets\").reset_index()\nresult = (users.merge(counts, on=\"user_id\")\n               .sort_values(\"user_id\").reset_index(drop=True))", "verdict": "wrong", "bug": "Inner merge drops users", "fix": "counts = tickets.groupby(\"user_id\").size().rename(\"n_tickets\").reset_index()\nresult = (users.merge(counts, on=\"user_id\", how=\"left\")\n               .fillna({\"n_tickets\": 0}).astype({\"n_tickets\": int})\n               .sort_values(\"user_id\").reset_index(drop=True))", "lang": "python", "data": "import pandas as pd\nusers = pd.DataFrame({\"user_id\":[1,2,3,4], \"plan\":[\"free\",\"pro\",\"free\",\"pro\"]})\ntickets = pd.DataFrame({\"ticket_id\":[10,11,12], \"user_id\":[1,1,3]})", "track": "general", "model": "An inner merge is a party where you need a +1 to get in.", "mech": "Users without tickets have no match, so the default inner merge drops them.", "breaks": "Use how='left' and fill the missing counts with 0.", "contrast": "An inner merge is right when you only want users who have tickets.", "details": "`merge` defaults to `how='inner'`, so users 2 and 4 (no tickets) disappear. Use `how='left'` and fill the missing counts with 0.", "why": "Inner merge drops users"}, {"id": "pd-03", "topic": "pandas", "sub": "groupby", "difficulty": "Easy", "title": "Unique users by country", "prompt": "Count **unique users** per country. Return a Series indexed by country.", "ai": "result = events.groupby(\"country\")[\"user_id\"].nunique()", "verdict": "correct", "fix": "result = events.drop_duplicates([\"country\",\"user_id\"]).groupby(\"country\").size().rename(\"user_id\")", "lang": "python", "data": "import pandas as pd\nevents = pd.DataFrame({\n  \"user_id\": [1,1,2,3,3,3,4],\n  \"country\": [\"US\",\"US\",\"US\",\"CA\",\"CA\",\"CA\",\"CA\"],\n  \"event\":   [\"view\",\"click\",\"view\",\"view\",\"view\",\"buy\",\"view\"],\n})", "bug": "", "track": "general", "model": "Count people, not events.", "mech": "nunique counts distinct user_ids per country.", "breaks": "size() and count() count rows (events).", "contrast": "value_counts on deduped (country, user) pairs gives the same result.", "details": "`nunique` counts distinct user_ids per group: CA 2, US 2. Using `.size()` or `.count()` would count events (4 and 3).", "why": "nunique counts distinct user_ids per country."}, {"id": "pd-04", "topic": "pandas", "sub": "time series", "difficulty": "Medium", "title": "Trailing 7-day order sum", "prompt": "Days with no orders are missing from `daily`. Compute a trailing **7-calendar-day** sum of orders for each row.", "ai": "result = daily[\"orders\"].rolling(7, min_periods=1).sum()", "verdict": "wrong", "bug": "Row-based window over gappy dates", "fix": "result = daily[\"orders\"].rolling(\"7D\").sum()", "lang": "python", "data": "import pandas as pd\ndaily = pd.DataFrame({\n  \"date\": pd.to_datetime([\"2026-03-01\",\"2026-03-02\",\"2026-03-03\",\"2026-03-06\",\n                          \"2026-03-07\",\"2026-03-08\",\"2026-03-09\",\"2026-03-10\"]),\n  \"orders\": [10, 12, 9, 20, 18, 15, 11, 14],\n}).set_index(\"date\")   # note: days with zero orders are simply missing", "track": "general", "model": "A 7-row window isn't a 7-day window when days are missing.", "mech": "rolling(7) looks back 7 rows. With gaps, that can span more than 7 calendar days.", "breaks": "With a datetime index, rolling('7D') looks back by time.", "contrast": "With no gaps, the two are the same.", "details": "`rolling(7)` uses the last 7 **rows**, not 7 days. Because Mar 4–5 are missing, the window on Mar 9 reaches back to Mar 2 (8 calendar days). Use a time-based window `rolling('7D')`, or reindex to fill missing days with 0.", "why": "Row-based window over gappy dates"}, {"id": "pd-05", "topic": "pandas", "sub": "transform", "difficulty": "Medium", "title": "Share of store revenue", "prompt": "Add a column `share` to `sales`: each row's revenue as a fraction of its **store's** total revenue.", "ai": "result = sales.assign(\n    share=sales[\"revenue\"] / sales.groupby(\"store\")[\"revenue\"].transform(\"sum\"))", "verdict": "correct", "fix": "tot = sales.groupby(\"store\")[\"revenue\"].sum().rename(\"tot\")\nm = sales.join(tot, on=\"store\")\nresult = sales.assign(share=m[\"revenue\"]/m[\"tot\"])", "lang": "python", "data": "import pandas as pd\nsales = pd.DataFrame({\n  \"store\":   [\"A\",\"A\",\"B\",\"B\",\"C\",\"C\",\"A\"],\n  \"product\": [\"tea\",\"coffee\",\"tea\",\"cake\",\"coffee\",\"cake\",\"tea\"],\n  \"revenue\": [12.0, 30.0, 8.0, 15.0, 22.0, 9.0, 5.0],\n})", "bug": "", "track": "general", "model": "transform broadcasts the group answer back to every member.", "mech": "groupby('store').transform('sum') gives each row its store's total, so dividing lines up row by row.", "breaks": "agg would collapse to one row per store and misalign.", "contrast": "For one group-level number per store, use agg.", "details": "`transform('sum')` broadcasts each store total back to row shape, so the division lines up by index. For store A the shares are 12/47, 30/47, and 5/47.", "why": "groupby('store').transform('sum') gives each row its store's total, so dividing lines up row by row."}, {"id": "pd-06", "topic": "pandas", "sub": "missing data", "difficulty": "Medium", "title": "Average rating per movie", "prompt": "NaN means the user hasn't rated the movie. Return the average rating per movie **among users who rated it**.", "ai": "result = ratings.fillna({\"rating\": 0}).groupby(\"movie\")[\"rating\"].mean()", "verdict": "wrong", "bug": "Treating missing as zero", "fix": "result = ratings.groupby(\"movie\")[\"rating\"].mean()", "lang": "python", "data": "import pandas as pd, numpy as np\nratings = pd.DataFrame({\n  \"movie\":  [\"M1\",\"M1\",\"M1\",\"M2\",\"M2\",\"M2\"],\n  \"user\":   [1,2,3,1,2,3],\n  \"rating\": [4.0, np.nan, 5.0, 3.0, 2.0, np.nan],   # NaN = user didn't rate\n})", "track": "general", "model": "Missing isn't zero. Someone who didn't vote didn't give you 0 stars.", "mech": "fillna(0) invents 0-star votes and drags the averages down.", "breaks": "mean() already skips NaN.", "contrast": "fillna(0) is right when NaN really means zero, like no sales.", "details": "Filling NaN with 0 counts non-raters as 0-star votes: M1 becomes 3.0 instead of 4.5. pandas' `mean()` already skips NaN, so just drop the fillna.", "why": "Treating missing as zero"}, {"id": "pd-07", "topic": "pandas", "sub": "pivot", "difficulty": "Medium", "title": "Users per country × event", "prompt": "Build a table with countries as rows, event types as columns, and the number of **unique users** in each cell (0 where none).", "ai": "result = events.pivot_table(index=\"country\", columns=\"event\",\n                            values=\"user_id\", aggfunc=\"nunique\", fill_value=0)", "verdict": "correct", "fix": "result = (events.drop_duplicates().groupby([\"country\",\"event\"])[\"user_id\"].nunique()\n          .unstack(fill_value=0))", "lang": "python", "data": "import pandas as pd\nevents = pd.DataFrame({\n  \"user_id\": [1,1,2,3,3,3,4],\n  \"country\": [\"US\",\"US\",\"US\",\"CA\",\"CA\",\"CA\",\"CA\"],\n  \"event\":   [\"view\",\"click\",\"view\",\"view\",\"view\",\"buy\",\"view\"],\n})", "bug": "", "track": "general", "model": "A pivot table is a grid of mini group-bys.", "mech": "aggfunc='nunique' counts distinct users in each country×event cell, and fill_value fills empty cells.", "breaks": "Using count would count events, not users.", "contrast": "crosstab on deduped data gives the same result.", "details": "`aggfunc='nunique'` counts distinct users per cell, and `fill_value=0` handles empty combinations (e.g. US × buy). CA × view = 2 (users 3 and 4), even though there are 3 view events.", "why": "aggfunc='nunique' counts distinct users in each country×event cell, and fill_value fills empty cells."}, {"id": "pd-08", "topic": "pandas", "sub": "groupby + shift", "difficulty": "Medium", "title": "Days since previous order", "prompt": "For each order, compute days since **that same user's** previous order (NaN for a user's first order).", "ai": "result = orders.assign(days_since_prev=orders[\"order_date\"].diff().dt.days)", "verdict": "wrong", "bug": "diff() without groupby leaks across users", "fix": "result = orders.assign(days_since_prev=orders.groupby(\"user_id\")[\"order_date\"].diff().dt.days)", "lang": "python", "data": "import pandas as pd\norders = pd.DataFrame({\n  \"user_id\": [1, 2, 1, 2, 1, 3],\n  \"order_date\": pd.to_datetime([\"2026-01-01\",\"2026-01-03\",\"2026-01-10\",\n                                \"2026-01-04\",\"2026-01-12\",\"2026-01-05\"]),\n}).sort_values([\"user_id\",\"order_date\"]).reset_index(drop=True)", "track": "general", "model": "Time between visits only makes sense within one person's diary.", "mech": "diff() without groupby compares a user's first order to the previous user's last order.", "breaks": "groupby('user_id').diff() restarts for each user.", "contrast": "Sort by user and date first, or the diffs are meaningless.", "details": "`diff()` runs down the whole frame, so each user's first order gets compared with the previous user's last order. For example, user 2's first order shows -9 days instead of NaN. Use `groupby('user_id')['order_date'].diff()`.", "why": "diff() without groupby leaks across users"}, {"id": "pd-09", "topic": "pandas", "sub": "groupby", "difficulty": "Hard", "title": "Each user's top product", "prompt": "For each user, return the product with the highest **total** quantity (sum across rows). Return a DataFrame with `user_id`, `product`, `qty`, sorted by user_id.", "ai": "tot = purchases.groupby([\"user_id\",\"product\"], as_index=False)[\"qty\"].sum()\nresult = (tot.loc[tot.groupby(\"user_id\")[\"qty\"].idxmax()]\n             .sort_values(\"user_id\").reset_index(drop=True))", "verdict": "correct", "fix": "tot = purchases.groupby([\"user_id\",\"product\"], as_index=False)[\"qty\"].sum()\nresult = (tot.sort_values([\"user_id\",\"qty\"], ascending=[True,False])\n             .drop_duplicates(\"user_id\").reset_index(drop=True))", "lang": "python", "data": "import pandas as pd\npurchases = pd.DataFrame({\n  \"user_id\": [1,1,1,2,2,3],\n  \"product\": [\"socks\",\"hat\",\"socks\",\"mug\",\"mug\",\"pen\"],\n  \"qty\":     [2, 1, 3, 1, 4, 1],\n})", "bug": "", "track": "general", "model": "Total first, then pick the champion.", "mech": "Sum quantities per user×product, then idxmax picks each user's biggest product.", "breaks": "Doing idxmax on raw rows picks the biggest single row, not the biggest total.", "contrast": "nlargest(1) per group works too.", "details": "It aggregates to the user × product level first (socks = 5 for user 1), then uses idxmax to pick the row with the most per user. Applying idxmax to raw rows would be the classic mistake.", "why": "Sum quantities per user×product, then idxmax picks each user's biggest product."}, {"id": "pd-10", "topic": "pandas", "sub": "feature engineering", "difficulty": "Hard", "title": "Prior-average feature (no leakage)", "prompt": "For a fraud model, create the feature `prior_avg`: the mean of the user's **previous** transaction amounts (NaN for a user's first transaction). It must not use the current or future rows.", "ai": "result = txn.assign(\n    prior_avg=txn.groupby(\"user_id\")[\"amount\"].transform(lambda s: s.expanding().mean()))", "verdict": "wrong", "bug": "Feature leakage: includes the current row", "fix": "result = txn.assign(\n    prior_avg=txn.groupby(\"user_id\")[\"amount\"].transform(lambda s: s.shift().expanding().mean()))", "lang": "python", "data": "import pandas as pd\ntxn = pd.DataFrame({\n  \"user_id\": [1,1,1,1,2,2,2],\n  \"amount\":  [20, 30, 100, 25, 50, 40, 45],\n})   # rows already in time order within each user", "track": "general", "model": "A feature must only use information that existed before the moment you predict.", "mech": "expanding().mean() includes the current transaction, so the feature contains the thing you're trying to judge.", "breaks": "shift(1) before expanding fixes it. Leaked features look great in training and fail in production.", "contrast": "Including the current row is fine for descriptive stats, not for features that predict it.", "details": "`expanding().mean()` includes the current transaction, so the feature leaks the amount it's meant to score. A \\$100 spike shows a prior average of 50 instead of 25, which makes anomalies look less anomalous in training than they will at serving time. The first row should be NaN, not the amount itself. Shift by one within each user before averaging.", "why": "Feature leakage: includes the current row"}, {"id": "st-01", "topic": "Stats & probability", "sub": "Probability", "difficulty": "Easy", "title": "At least one six", "prompt": "You roll a fair die 4 times. What is the probability of getting **at least one 6**?", "ai": "Count the ways it fails: $P(\\text{no 6 in one roll}) = \\tfrac{5}{6}$, so $P(\\text{no 6 in 4 rolls}) = (\\tfrac{5}{6})^4 \\approx 0.482$. Therefore $P(\\text{at least one 6}) = 1 - 0.482 \\approx$ **0.518**.", "verdict": "correct", "fix": "$$1 - \\left(\\tfrac{5}{6}\\right)^4 = \\tfrac{671}{1296} \\approx 0.518$$", "lang": "text", "bug": "", "track": "general", "model": "For 'at least one,' count the ways it fails completely.", "mech": "The chance of no six in four rolls is easy to compute, and everything else has at least one six.", "breaks": "The complement avoids double-counting overlaps. Adding 1/6 four times counts some outcomes twice.", "contrast": "For 'exactly one,' you'd count arrangements instead.", "details": "The complement rule is the cleanest approach. A common trap is adding $4 \\times \\tfrac{1}{6} = 0.667$, which double-counts overlapping outcomes.", "why": "The chance of no six in four rolls is easy to compute, and everything else has at least one six."}, {"id": "st-02", "topic": "Stats & probability", "sub": "Inference", "difficulty": "Easy", "title": "What does p = 0.03 mean?", "prompt": "A test of whether a new onboarding flow changes activation returns p = 0.03. A PM asks what that means. Evaluate the AI's explanation.", "ai": "It means there is a 3% chance that the null hypothesis is true. In other words, we are 97% confident the new onboarding flow really changes activation.", "verdict": "wrong", "bug": "p-value ≠ P(null is true)", "fix": "If the new flow truly had no effect, we'd see a difference at least this large about 3% of the time. That's unlikely enough to reject 'no effect' at α = 0.05, but it doesn't tell us the probability that the effect is real or how big it is. Look at the confidence interval for that.", "lang": "text", "track": "general", "model": "A p-value asks 'how weird is this data if nothing's going on?', not 'how likely is it that nothing's going on?'", "mech": "It's computed assuming no effect, so it can't tell you the probability that there's no effect.", "breaks": "Turning it around needs a prior (Bayes). Confusing the two directions is the most common stats interview trap.", "contrast": "'If there were no effect, we'd see a gap this big about 3% of the time' is correct.", "details": "A p-value is P(data at least this extreme | H0 is true), not P(H0 | data). Turning it into the probability that the null is true needs a prior, which is Bayes, and \"97% confident the effect is real\" is the same mistake.", "why": "p-value ≠ P(null is true)"}, {"id": "st-03", "topic": "Stats & probability", "sub": "Confidence intervals", "difficulty": "Easy", "title": "95% CI for a mean", "prompt": "A sample of n = 100 delivery times has mean 50 min and sample SD 10 min. Give an approximate 95% confidence interval for the mean.", "ai": "$SE = 10/\\sqrt{100} = 1$, so $CI = 50 \\pm 1.96 \\times 1 =$ **[48.04, 51.96]** minutes. (The t critical value with 99 df is 1.984, giving [48.02, 51.98], which is nearly identical.)", "verdict": "correct", "fix": "[48.04, 51.96] (z) or [48.02, 51.98] (t, 99 df)", "lang": "text", "bug": "", "track": "general", "model": "Averages wobble much less than individuals.", "mech": "The uncertainty of the mean shrinks with the square root of the sample size, so the CI uses $SD/\\sqrt{n}$, not SD.", "breaks": "Using the raw SD gives a range for single deliveries, not for the average.", "contrast": "A prediction interval for one new delivery should be wide (about ±20 min).", "details": "The CI uses the standard error, $SD/\\sqrt{n}$, not the SD. A common slip is $50 \\pm 1.96 \\times 10$, which is a range for individual deliveries (a prediction-style interval), not for the mean.", "why": "The uncertainty of the mean shrinks with the square root of the sample size, so the CI uses SD/√n, not SD."}, {"id": "st-04", "topic": "Stats & probability", "sub": "Bayes", "difficulty": "Medium", "title": "Fraud alert precision", "prompt": "1% of transactions are fraud. A detector flags 95% of fraud and also flags 5% of legitimate transactions. Given a flag, what's the probability the transaction is fraud?", "ai": "The detector is 95% accurate at catching fraud, so a flagged transaction is fraud with probability **95%**.", "verdict": "wrong", "bug": "Base-rate neglect (confuses P(flag|fraud) with P(fraud|flag))", "fix": "$$P(\\text{fraud}\\mid\\text{flag}) = \\frac{0.95 \\times 0.01}{0.95 \\times 0.01 + 0.05 \\times 0.99} = \\frac{0.0095}{0.059} \\approx 16.1\\%$$", "lang": "text", "track": "general", "model": "A rare event plus a noisy detector means most alarms are false.", "mech": "Legit transactions are 99× more common, so even a 5% false-alarm rate on them swamps the true catches.", "breaks": "Always start from the base rate. The detector's hit rate is P(flag | fraud), which isn't what you need.", "contrast": "When fraud is common, say 50%, the flag really would be about 95% reliable.", "details": "It ignores the 1% base rate. Most flags come from the huge pool of legitimate transactions.", "why": "Base-rate neglect (confuses P(flag|fraud) with P(fraud|flag))", "vis": "| Per 10,000 transactions | Flagged | Not flagged |\n|---|---:|---:|\n| Fraud (100) | 95 | 5 |\n| Legit (9,900) | 495 | 9,405 |"}, {"id": "st-05", "topic": "Stats & probability", "sub": "Expectation", "difficulty": "Medium", "title": "Two heads in a row", "prompt": "Flip a fair coin until you get two heads in a row. What's the expected number of flips?", "ai": "Let $E$ = expected flips from scratch and $E_1$ = expected flips when the last flip was H. $$E = 1 + \\tfrac12 E_1 + \\tfrac12 E, \\qquad E_1 = 1 + \\tfrac12 \\cdot 0 + \\tfrac12 E$$ Solving: $E = 2 + E_1$ and $E_1 = 1 + E/2$, so $E = 3 + E/2$, giving **E = 6**.", "verdict": "correct", "fix": "E = 6", "lang": "text", "bug": "", "track": "general", "model": "Think in states: how many heads in a row do I have right now?", "mech": "Write the expected remaining flips from each state, solve the small system, and you get 6.", "breaks": "The state approach handles any 'pattern' waiting-time puzzle.", "contrast": "Waiting for HT (instead of HH) takes 4 on average, because a failure doesn't fully reset you.", "details": "The Markov-chain setup is the standard technique, and simulation confirms 6.", "why": "Write the expected remaining flips from each state, solve the small system, and you get 6."}, {"id": "st-06", "topic": "Stats & probability", "sub": "Simpson's paradox", "difficulty": "Medium", "title": "Which support channel resolves better?", "prompt": "Resolution rates:\n• Chat: easy tickets 180/200 (90%), hard tickets 20/50 (40%), **total 200/250 = 80%**\n• Phone: easy tickets 48/50 (96%), hard tickets 90/200 (45%), **total 138/250 = 55%**\nWhich channel resolves tickets better?", "ai": "Chat resolves 80% of tickets vs 55% for phone, a 25-point gap on equal volumes. Chat is clearly the better channel and we should route more traffic to it.", "verdict": "wrong", "bug": "Simpson's paradox", "fix": "Compare within difficulty, or standardize to a common mix. At a 50/50 easy/hard mix: chat 65%, phone 70.5%. Phone is better. Routing hard tickets to chat would probably lower overall resolution.", "lang": "text", "track": "general", "model": "A lurking variable can flip a comparison when groups have different mixes.", "mech": "Phone gets most of the hard tickets, so its overall rate looks worse, even though it wins within each difficulty.", "breaks": "Compare like with like (stratify) when the mix differs and the mix drives the outcome.", "contrast": "If the mixes were the same, the overall and within-group comparisons would agree.", "details": "Phone wins in **both** strata (96% vs 90% on easy, 45% vs 40% on hard). Its overall rate is lower only because it gets mostly hard tickets. Ticket difficulty confounds the comparison.", "why": "Simpson's paradox"}, {"id": "st-07", "topic": "Stats & probability", "sub": "Standard error", "difficulty": "Medium", "title": "SE of a conversion rate", "prompt": "400 visitors, 40 conversions. What's the standard error of the conversion rate, and an approximate 95% CI?", "ai": "$\\hat p = 0.10$, so $SE = \\sqrt{\\hat p(1-\\hat p)/n} = \\sqrt{0.09/400} =$ **0.015**. 95% CI $\\approx 0.10 \\pm 1.96 \\times 0.015 =$ **[0.071, 0.129]**.", "verdict": "correct", "fix": "SE = 0.015; CI ≈ [0.071, 0.129]", "lang": "text", "bug": "", "track": "general", "model": "A proportion is just an average of 0s and 1s, so its wobble is $\\sqrt{p(1-p)/n}$.", "mech": "With n = 400 and p = 0.1, the SE is 0.015, and the normal-approximation interval is fine.", "breaks": "It breaks for small n or p near 0/1. Use Wilson there.", "contrast": "Wilson recenters and stays inside [0,1].", "details": "This is the Wald interval, which is fine at n = 400 with p = 0.1 (np = 40 > 10). A Wilson interval, about [0.074, 0.133], is a bit better for small n or extreme p.", "why": "With n = 400 and p = 0.1, the SE is 0.015, and the normal-approximation interval is fine."}, {"id": "st-08", "topic": "Stats & probability", "sub": "Probability", "difficulty": "Hard", "title": "Shared birthday in a team of 23", "prompt": "In a team of 23 people (365 equally likely birthdays), what's the probability that at least two share a birthday?", "ai": "There are $\\binom{23}{2} = 253$ pairs, each matching with probability $1/365$, so $P \\approx 253/365 \\approx$ **0.693**.", "verdict": "wrong", "bug": "Union bound treated as exact probability", "fix": "$$P = 1 - \\prod_{k=0}^{22} \\frac{365-k}{365} \\approx 0.507$$ (The Poisson approximation $1 - e^{-253/365} \\approx 0.50$ is also close.)", "lang": "text", "track": "general", "model": "Adding overlapping chances counts the overlaps twice.", "mech": "Summing pair probabilities is an upper bound, not the probability, and it can exceed 1.", "breaks": "Use the complement: the chance everyone is different.", "contrast": "For tiny probabilities, the union bound is a decent approximation.", "details": "Adding pair probabilities counts overlapping events more than once (it's an upper bound and can exceed 1 for larger groups). Use the complement: everyone distinct.", "why": "Union bound treated as exact probability"}, {"id": "st-09", "topic": "Stats & probability", "sub": "Variance", "difficulty": "Hard", "title": "Variance of a sum", "prompt": "X has variance 1, Y has variance 4, and $\\operatorname{corr}(X, Y) = 0.5$. What is $\\operatorname{Var}(X + Y)$ and $\\operatorname{Var}(X - Y)$?", "ai": "$\\operatorname{Cov} = \\rho\\,\\sigma_x\\sigma_y = 0.5 \\times 1 \\times 2 = 1$.\n\n$$\\operatorname{Var}(X+Y) = 1 + 4 + 2(1) = 7 \\qquad \\operatorname{Var}(X-Y) = 1 + 4 - 2(1) = 3$$\n\nSo **7** and **3**.", "verdict": "correct", "fix": "7 and 3", "lang": "text", "bug": "", "track": "general", "model": "Things that move together make their sum swing more, and their difference swing less.", "mech": "Variance of a sum adds the covariance twice. For a difference, it subtracts it.", "breaks": "This is why comparing a user to their own pre-period (CUPED, paired tests) cuts noise.", "contrast": "For independent variables, the covariance term is 0.", "details": "The covariance term enters with a + sign for sums and a − sign for differences. A common error is adding variances as if X and Y were independent (5 for both). This is also why positively correlated pre/post metrics give lower-variance differences, the intuition behind CUPED.", "why": "Variance of a sum adds the covariance twice."}, {"id": "ab-01", "topic": "A/B testing", "sub": "Peeking", "difficulty": "Easy", "title": "Stop when it's significant?", "prompt": "A PM proposes checking the experiment's p-value every morning and shipping as soon as it dips below 0.05. Evaluate the AI's response.", "ai": "That's a good, efficient plan. A p-value below 0.05 is significant whenever you observe it, and stopping early saves traffic and gets the win out faster.", "verdict": "wrong", "bug": "Peeking inflates false positives", "fix": "Fix the sample size and duration in advance with a power analysis and analyze once. If you need early stopping, use a sequential method (alpha spending like O'Brien–Fleming, or always-valid / mSPRT p-values).", "lang": "text", "track": "general", "model": "Every peek is another lottery ticket for noise.", "mech": "Checking daily and stopping at the first p < 0.05 gives chance many tries, so the false-positive rate rises far above 5%.", "breaks": "Fix the sample size in advance, or use sequential methods built for peeking.", "contrast": "Looking without stopping on it (just monitoring for bugs) is fine.", "details": "Each look is another chance for noise to cross 0.05. With daily looks over a few weeks, the real false-positive rate can be 20–30%, not 5%.", "why": "Peeking inflates false positives", "evis": "<figure class=\"vis\"><svg viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"Under no effect, a daily p-value wanders and will dip below 0.05 by chance\" class=\"chart\"><path class=\"ax\" d=\"M30,10 L30,145 L330,145\"/><text class=\"tx\" x=\"330\" y=\"162\" text-anchor=\"end\">days<\/text><text class=\"tx\" x=\"34\" y=\"14\">p-value<\/text><path class=\"ax2\" d=\"M30,132.5 L330,132.5\"/><text class=\"tx\" x=\"326\" y=\"128.5\" text-anchor=\"end\">0.05<\/text><path class=\"ln\" d=\"M30.0,82.5 L44.8,41.7 L59.5,61.4 L74.2,109.7 L89.0,116.3 L103.8,74.5 L118.5,46.7 L133.2,71.4 L148.0,110.2 L162.8,107.2 L177.5,69.3 L192.2,52.6 L207.0,79.3 L221.8,108.9 L236.5,99.1 L251.2,66.4 L266.0,58.7 L280.8,85.2 L295.5,106.2 L310.2,92.2 L325.0,65.4\"/><circle class=\"dot\" cx=\"133.25\" cy=\"71.44478345964225\" r=\"4\"/><\/svg><figcaption>Under no effect, a daily p-value wanders and will dip below 0.05 by chance<\/figcaption><\/figure>"}, {"id": "ab-02", "topic": "A/B testing", "sub": "Design", "difficulty": "Easy", "title": "Randomization unit for checkout", "prompt": "We're testing a redesigned checkout page. Should we randomize by pageview, session, or user? Evaluate the AI's recommendation.", "ai": "Randomize by **user** (logged-in ID, falling back to a persistent device ID). Users often revisit checkout across sessions, and pageview- or session-level randomization would show the same person both designs, which contaminates the comparison and creates an inconsistent experience. Analyze at the user level too, or use the delta method if the metric is per-session.", "verdict": "correct", "fix": "—", "lang": "text", "bug": "", "track": "general", "model": "Randomize at the level where people experience the change.", "mech": "Randomize per user and analyze per user, so each user sees one consistent checkout.", "breaks": "Session-level randomization splits users and violates independence.", "contrast": "Cluster randomization (by store or city) is needed when users influence each other.", "details": "The randomization unit should match how the treatment is experienced, and the analysis unit should match the randomization unit. Both points are covered.", "why": "Randomize per user and analyze per user, so each user sees one consistent checkout."}, {"id": "ab-03", "topic": "A/B testing", "sub": "Power", "difficulty": "Medium", "title": "Sample size per arm", "prompt": "Baseline conversion is 10%. We want to detect an absolute lift of 1 percentage point (10% → 11%), two-sided $\\alpha = 0.05$, 80% power. Roughly how many users per arm?", "ai": "$$n \\approx \\frac{(z_{0.975} + z_{0.8})^2\\,[p_1(1-p_1) + p_2(1-p_2)]}{\\delta^2} = \\frac{(1.96 + 0.84)^2 \\times 0.1879}{0.01^2}$$ That's about **14,700 users per arm**.", "verdict": "correct", "fix": "≈ 14.7k per arm (statsmodels' arcsine method gives ≈ 14.75k)", "lang": "text", "bug": "", "track": "general", "model": "Sample size is noise ÷ signal, squared.", "mech": "The required n grows with variance and with $1/\\text{effect}^2$. For 10%→11%, that's about 14k per arm.", "breaks": "Mixing up absolute and relative lifts changes n by 100×.", "contrast": "A 1% relative lift (10%→10.1%) needs far more users.", "details": "This is the standard two-proportion formula. A common mistake is treating 1pp as a 1% *relative* lift (10% → 10.1%), which needs about 100× more users.", "why": "The required n grows with variance and with 1/effect²."}, {"id": "ab-04", "topic": "A/B testing", "sub": "Sample ratio mismatch", "difficulty": "Medium", "title": "50/50 split came in 50,800 vs 49,200", "prompt": "A test configured as 50/50 ended with 50,800 users in control and 49,200 in treatment. Treatment shows a significant lift. Evaluate the AI's read.", "ai": "A 1.6% difference in group sizes is normal random variation for a test this large and won't bias the result. The lift is significant, so we can trust it and ship.", "verdict": "wrong", "bug": "Ignores sample ratio mismatch (SRM)", "fix": "Treat the result as untrustworthy until the SRM is explained: check assignment logs, triggering conditions, bot filters, and crashes by arm and segment. Rerun after fixing.", "lang": "text", "track": "general", "model": "If a fair coin comes up 50,800 vs 49,200, the coin is rigged.", "mech": "At this scale, a 50/50 split should be much closer, so the chi-square p is tiny.", "breaks": "SRM means something broke in assignment or logging, and every metric is suspect.", "contrast": "A 1,600 gap on a few thousand users could be chance.", "details": "A chi-square test against 50/50 gives $\\chi^2 = 25.6$, $p \\approx 4 \\times 10^{-7}$. At this scale, a 1,600-user gap is not chance. SRM usually means broken assignment, bot filtering, redirects, or logging loss that differs by arm, and that can bias every metric.", "why": "Ignores sample ratio mismatch (SRM)", "vis": "| Arm | Expected | Observed | Gap |\n|---|---:|---:|---:|\n| Control | 50,000 | 50,800 | +800 |\n| Treatment | 50,000 | 49,200 | −800 |"}, {"id": "ab-05", "topic": "A/B testing", "sub": "Multiple testing", "difficulty": "Medium", "title": "1 of 20 metrics moved", "prompt": "An experiment tracked 20 metrics. The primary metric is flat; one secondary metric (time on settings page) is up with p = 0.04. Evaluate the AI's summary.", "ai": "We found a statistically significant improvement in time on the settings page (p = 0.04). Recommend launching based on this win.", "verdict": "wrong", "bug": "Multiple comparisons / cherry-picking", "fix": "Report the primary result as null. Treat the secondary bump as a hypothesis, correct for multiplicity (Bonferroni would need p < 0.0025, or use Benjamini–Hochberg), and only launch if a confirmatory test supports it, along with a reason the metric matters.", "lang": "text", "track": "general", "model": "Check enough metrics and one will 'move' by luck.", "mech": "20 tests at 5% gives about a 64% chance of at least one false positive.", "breaks": "Pre-register a primary metric, then correct the rest.", "contrast": "With one pre-registered primary metric, 5% really is 5%.", "details": "With 20 independent metrics at $\\alpha = 0.05$, you expect about 1 false positive even if nothing changed. $P(\\text{at least one}) = 1 - 0.95^{20} \\approx 64\\%$. And the pre-registered primary metric is flat.", "why": "Multiple comparisons / cherry-picking"}, {"id": "ab-06", "topic": "A/B testing", "sub": "Hypothesis tests", "difficulty": "Medium", "title": "Is a 10% → 11% lift significant?", "prompt": "Control: 1,000 conversions of 10,000. Treatment: 1,100 of 10,000. Is the difference significant at α = 0.05 (two-sided)?", "ai": "Pooled $p = 0.105$, so $SE = \\sqrt{0.105 \\times 0.895 \\times \\tfrac{2}{10000}} \\approx 0.00434$ and $z = 0.01 / 0.00434 \\approx$ **2.31**, $p \\approx$ **0.021**. Yes, significant at 0.05. 95% CI for the lift ≈ [0.15pp, 1.85pp].", "verdict": "correct", "fix": "z ≈ 2.31, p ≈ 0.021", "lang": "text", "bug": "", "track": "general", "model": "A z-test asks whether the gap is big compared to how much it would wobble by chance.", "mech": "Use the pooled SE for the test and the unpooled SE for the CI. The CI excluding 0 matches p < 0.05.", "breaks": "This is the standard large-sample approach. Breaks for tiny samples.", "contrast": "A chi-square test on the 2×2 table gives the same answer.", "details": "The pooled SE is used for the test and the unpooled SE (≈ 0.00436) for the CI, which is the textbook pairing. The CI excludes 0, consistent with p < 0.05.", "why": "Use the pooled SE for the test and the unpooled SE for the CI.", "vis": "| Arm | Users | Conversions | Rate |\n|---|---:|---:|---:|\n| Control | 10,000 | 1,000 | 10.0% |\n| Treatment | 10,000 | 1,100 | 11.0% |"}, {"id": "ab-07", "topic": "A/B testing", "sub": "Variance", "difficulty": "Hard", "title": "CTR test randomized by user", "prompt": "We randomize by user and measure click-through rate = clicks / pageviews. Treatment CTR 5.2% on 1.2M pageviews; control 5.0% on 1.2M pageviews (≈ 60k users per arm). Evaluate the AI's analysis.", "ai": "Treat each pageview as a Bernoulli trial: $$SE = \\sqrt{p(1-p)\\left(\\tfrac{1}{n_1} + \\tfrac{1}{n_2}\\right)}$$ with $n = 1.2\\text{M}$ per arm gives $z \\approx 7.0$. That's overwhelmingly significant.", "verdict": "wrong", "bug": "Unit of analysis ≠ unit of randomization", "fix": "Compute per-user clicks and pageviews, then the variance of the ratio of means with the delta method (or bootstrap over users). The real z is usually much smaller and may not be significant.", "lang": "text", "track": "general", "model": "Ten pageviews from one person are one voice, not ten.", "mech": "Users randomize, but pageviews are analyzed as if independent, so the variance is understated.", "breaks": "Use the delta method or a user-level bootstrap.", "contrast": "If you randomized pageviews, pageview-level analysis would be OK.", "details": "Pageviews from the same user are correlated, so they're not independent trials. Treating 1.2M pageviews as independent understates the variance, often by a lot, because heavy users dominate. Since this is a ratio metric randomized by user, you need the delta method or a user-level bootstrap or cluster-robust SE.", "why": "Unit of analysis ≠ unit of randomization"}, {"id": "ab-08", "topic": "A/B testing", "sub": "Variance reduction", "difficulty": "Hard", "title": "How much does CUPED help?", "prompt": "Using pre-experiment spend as a CUPED covariate, the correlation between pre-period and in-experiment spend is 0.6. How much variance reduction should we expect, and what does that mean for sample size?", "ai": "CUPED's adjusted metric $Y - \\theta(X - \\bar X)$, with $\\theta = \\operatorname{Cov}(X,Y)/\\operatorname{Var}(X)$, has variance $\\operatorname{Var}(Y)(1 - \\rho^2)$. With $\\rho = 0.6$, variance falls by **36%**, so for the same power you need about 64% of the original sample, roughly a 1.56× effective traffic boost.", "verdict": "correct", "fix": "36% variance reduction → ~0.64× sample size", "lang": "text", "bug": "", "track": "general", "model": "Subtract the part of the metric you could have predicted before the test.", "mech": "Pre-period behavior explains part of the noise. Removing it shrinks the variance by the correlation squared.", "breaks": "The covariate has to come from before treatment.", "contrast": "With zero correlation, CUPED does nothing.", "details": "The variance factor is $1 - \\rho^2$, and required n scales linearly with variance. The covariate has to be measured before treatment, so treatment can't affect it.", "why": "Pre-period behavior explains part of the noise."}, {"id": "ab-09", "topic": "A/B testing", "sub": "Triggering / selection", "difficulty": "Hard", "title": "Comparing feature users to control", "prompt": "A new 'Smart Reply' button was shown to treatment. The AI compares treatment users **who clicked Smart Reply** to **all** control users and finds they send 40% more messages. Evaluate.", "ai": "Users who used Smart Reply send 40% more messages than control, so Smart Reply drives a 40% increase in messaging. Strong launch case.", "verdict": "wrong", "bug": "Conditioning on a post-treatment behavior", "fix": "Compare all treatment users with all control users (intent-to-treat). To focus on people who could have seen the button, trigger the same way in both arms (e.g. users who opened a thread where the button would appear), and log a counterfactual exposure in control. Then estimate the effect on compliers with an IV/CACE estimator if needed.", "lang": "text", "track": "general", "model": "Comparing people who chose to click breaks the randomization.", "mech": "Clickers are self-selected, more engaged users, so they differ from the start.", "breaks": "Compare everyone assigned to each arm (intent-to-treat), or the triggered population defined identically in both arms.", "contrast": "Triggering analysis is fine if the same trigger rule applies in control (counterfactual logging).", "details": "Clicking is chosen by the user and happens after treatment. Heavy messagers are more likely to click, so this compares engaged users against everyone, and randomization no longer protects the comparison.", "why": "Conditioning on a post-treatment behavior"}, {"id": "pm-01", "topic": "Product & metrics", "sub": "Engagement", "difficulty": "Easy", "title": "Stickiness", "prompt": "An app has average DAU of 300k and MAU of 1.2M. What's its stickiness, and how should we read it?", "ai": "Stickiness = DAU/MAU = 300k / 1.2M = **25%**: the average monthly user is active on about 7–8 days a month (0.25 × 30). That's healthy for many consumer apps (≈ 20% is often called good), but compare it with your category: messaging apps sit far higher, while travel apps are naturally low.", "verdict": "correct", "fix": "25%", "lang": "text", "bug": "", "track": "general", "model": "Stickiness = how many days a month the typical user shows up.", "mech": "DAU/MAU of 0.3 means a monthly user is active about 9 days a month.", "breaks": "Benchmarks vary a lot by category.", "contrast": "For a weekly-use product, WAU/MAU fits better.", "details": "Both the ratio and the days-per-month reading are correct, and the answer rightly adds that benchmarks depend on category.", "why": "DAU/MAU of 0.3 means a monthly user is active about 9 days a month."}, {"id": "pm-02", "topic": "Product & metrics", "sub": "Metric drop", "difficulty": "Medium", "title": "Weekly orders dropped 12%", "prompt": "Weekly orders on a food-delivery app fell 12% week over week. Evaluate the AI's diagnosis plan.", "ai": "A 12% drop is most likely caused by a competitor promotion. I'd immediately launch a counter-promo with 20% off to win the customers back, then monitor whether orders recover.", "verdict": "wrong", "bug": "Jumps to a cause without diagnosis", "fix": "1) Validate: logging or pipeline changes, timezone or partial-week issues, a definition change. 2) Seasonality: holidays, weather, last year's same week. 3) Decompose: orders = visitors × conversion × orders per buyer, and see which term moved. 4) Segment by platform/app version, city, new vs returning, restaurant supply, and acquisition channel. 5) Check internal changes such as releases, pricing, fees, and outages, plus external ones like a competitor. Then act on the specific cause.", "lang": "text", "track": "general", "model": "Before diagnosing the patient, check that the thermometer works.", "mech": "Rule out data problems, then slice by time, platform, region, and cohort to find where the drop lives.", "breaks": "Jumping to a cause skips the evidence.", "contrast": "If you already know a release broke checkout, start there.", "details": "It picks a cause and an expensive fix with no evidence. A strong answer first rules out data problems, then narrows down where the drop is happening before forming hypotheses.", "why": "Jumps to a cause without diagnosis"}, {"id": "pm-03", "topic": "Product & metrics", "sub": "Metric design", "difficulty": "Medium", "title": "Success metrics for a 'Save for later' feature", "prompt": "An e-commerce app is adding 'Save for later' in the cart. Propose a primary metric and guardrails. Evaluate the AI's answer.", "ai": "**Goal:** recover purchase intent that today ends in cart abandonment. **Primary:** purchases per user within 14 days (cap
