ment test.", "topic": "Causal inference", "track": "causal", "difficulty": "Expert", "lang": "text", "bug": "ATT applies to the kind of accounts that chose to adopt; non-adopters (ATU) likely gain less"}, {"id": "x-ci-11", "sub": "Sensitivity analysis", "title": "Reading Γ = 1.8", "prompt": "**Setup:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. Accounts adopt at different times. You estimate the effect of adoption on monthly compute credits using matched controls (GenMatch) on lagged credits and firmographics, then compare post-adoption credits. A Rosenbaum sensitivity analysis on the matched pairs says the result stays significant up to **Γ = 1.8**.", "ai": "It means that if an unobserved confounder made one account in a matched pair up to 1.8 times as likely (in odds) to adopt as its match, the conclusion of a positive effect would still hold at the 5% level. Beyond 1.8, it could be explained away. Whether 1.8 is reassuring depends on context: compare it with how much the strongest observed covariates shift adoption odds.", "verdict": "correct", "why": "Correct interpretation of Γ as the hidden-bias odds ratio the result can tolerate", "model": "Γ is how crooked the coin flip inside each pair can be before your finding could be a fluke of hidden bias.", "mech": "In a perfectly matched pair, each account should be equally likely to have adopted (odds 1). Γ bounds how far hidden differences could push that, and the test asks whether the result survives the worst case at that bound.", "breaks": "Γ isn't the effect size, and a high Γ isn't proof; it only says how strong unobserved bias would need to be.", "contrast": "'Γ = 1.8 means the effect is 1.8× larger than the bias' is a common misreading.", "details": "Within pair, $\\frac{1}{\\Gamma} \\le \\frac{\\pi_i/(1-\\pi_i)}{\\pi_j/(1-\\pi_j)} \\le \\Gamma$.", "fix": "—", "topic": "Causal inference", "track": "causal", "difficulty": "Expert", "lang": "text", "bug": ""}, {"id": "x-ci-12", "sub": "Sensitivity analysis", "title": "A clean placebo date", "prompt": "**Setup:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. Accounts adopt at different times. You estimate the effect of adoption on monthly compute credits using matched controls (GenMatch) on lagged credits and firmographics, then compare post-adoption credits. You rerun the full pipeline with a fake adoption date 6 months earlier for every adopter. The placebo effect is +4 credits (CI −30 to +38).", "ai": "The placebo is null, which shows matched controls and adopters weren't diverging before adoption. That rules out unobserved confounding, so the main estimate is unbiased.", "verdict": "wrong", "why": "A null placebo supports pre-period comparability but can't rule out confounders that change at the same time as adoption", "flaws": ["Can't detect shocks timed with adoption", "Placebo window should come after adoption", "A null placebo means the true effect is zero", "Placebo tests only work with randomized data"], "model": "A placebo is a smoke detector for things that were already burning. It can't hear a fire that starts the same day.", "mech": "If accounts adopt CodePilot because they're kicking off a big new data platform build, credits jump for that reason too, starting at adoption. There's no divergence 6 months earlier, so the placebo passes while the estimate still includes the project's credits.", "breaks": "Combine with negative-control outcomes, sensitivity analysis (Γ or E-values), and if possible measures of concurrent events (new warehouses, hiring).", "contrast": "'The placebo supports no pre-existing divergence' is a fair conclusion.", "details": "Placebo-in-time tests the identifying assumption over a window where the effect is known to be zero; it's informative about time-stable confounding, not time-varying shocks at adoption.", "fix": "Report the placebo as supportive, then add sensitivity analysis and checks on concurrent changes (e.g., new warehouses created in the adoption month).", "topic": "Causal inference", "track": "causal", "difficulty": "Expert", "lang": "text", "bug": "A null placebo supports pre-period comparability but can't rule out confounders that change at the same time as adoption"}, {"id": "x-ci-13", "sub": "Inference after matching", "title": "Clustering at the wrong level", "prompt": "**Setup:** Nimbus Cloud (fictional) launched *CodePilot*, an AI coding assistant. Accounts adopt at different times. You estimate the effect of adoption on monthly compute credits using matched controls (GenMatch) on lagged credits and firmographics, then compare post-adoption credits. CodePilot is turned on by an **org admin**, so all accounts in an org adopt together. You have 9,000 accounts in 1,400 orgs and a monthly panel.", "ai": "Use cluster-robust standard errors clustered by **account**, since we observe each account repeatedly and its months are correlated. That gives SE = 21 and a tight CI.", "verdict": "wrong", "why": "Treatment is assigned at the org level, so errors must be clustered by org; account clustering overstates precision", "flaws": ["Cluster by org, where treatment is assigned", "Should cluster by month to handle shocks", "Clustering is unnecessary after matching", "HC1 robust SEs are enough without clusters"], "model": "You have as many independent experiments as independent decisions. Here, the org admin made the decision.", "mech": "Accounts in an org share the adoption decision and many shocks (budgets, migrations). Their outcomes move together, so they're not independent pieces of evidence. With ~1,400 orgs (and fewer adopting ones), the true SE is larger.", "breaks": "Clustering at the assignment level is the safe default (Abadie et al. 2023). With few clusters (< 30–50 treated), use wild cluster bootstrap.", "contrast": "If adoption were decided account by account with no shared shocks, account-level clustering would be right.", "details": "Ignoring within-org correlation ρ inflates precision by roughly the design effect 1 + (m−1)ρ, where m is accounts per org.", "fix": "Cluster by org (and check with a wild cluster bootstrap); consider analyzing at the org level.", "topic": "Causal inference", "track": "causal", "difficulty": "Expert", "lang": "text", "bug": "Treatment is assigned at the org level, so errors must be clustered by org; account clustering overstates precision"}];

// HONEST NOTE: this is a casual gate on a public static site, NOT real security.
// It keeps strangers who find the link out of the app UI. The questions and code are
// public, and anyone with devtools can bypass it. Only a salted PBKDF2-SHA256 hash of
// the passcode lives here, never the passcode. Once entered, this device is remembered.
const GATE={salt:'ee8ecba849374033f8c9258211fbeece',iter:210000,hash:'50e1cda68eda2b778639c7ba7888554a5df678796b58599e8c29925590d5618f',len:6},GKEY='dsjudge_device_ok';
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pbk(code){const salt=new Uint8Array(GATE.salt.match(/../g).map(x=>parseInt(x,16)));

 return hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:GATE.iter},k,256))}
let L={buf:'',busy:false,msg:'',err:false,fails:0};
const LOCKSVG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
function gateOpen(){document.documentElement.classList.add('locked');$('#main').innerHTML='';drawLock()}
function drawLock(){let dots='';for(let i=0;i<GATE.len;i++)dots+=`<i class="${i<L.buf.length?'on':''}"></i>`;
 let keys='';for(const d of '123456789')keys+=`<button data-d="${d}" aria-label="${d}">${d}</button>`;
 keys+=`<span class="blank"></span><button data-d="0" aria-label="0">0</button><button class="txt" id="lkDel" aria-label="Delete">Delete</button>`;
 $('#lock').innerHTML=`<div class="lk-ico">${LOCKSVG}</div><h1>Enter passcode</h1><p class="lk-sub ${L.err?'err':''}" aria-live="polite">${esc(L.msg||'Private practice app. You only need to do this once on this device.')}</p>
 <div class="lk-dots" id="lkDots" aria-hidden="true">${dots}</div><input id="lkIn" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Passcode digits"><div class="lk-pad">${keys}</div>`;
 $('#lock').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>lockKey(b.dataset.d));$('#lkDel').onclick=()=>{L.buf=L.buf.slice(0,-1);drawLock()};
 const inp=$('#lkIn');inp.oninput=()=>{for(const ch of inp.value.replace(/\D/g,''))lockKey(ch);inp.value=''}}
document.addEventListener('keydown',e=>{if(!document.documentElement.classList.contains('locked')||e.target.id==='lkIn')return;if(/^\d$/.test(e.key)){e.preventDefault();lockKey(e.key)}else if(e.key==='Backspace'){L.buf=L.buf.slice(0,-1);drawLock()}});
function lockKey(d){if(L.busy||L.buf.length>=GATE.len)return;L.buf+=d;L.err=false;L.msg='';drawLock();if(L.buf.length===GATE.len)setTimeout(lockSubmit,90)}
async function lockSubmit(){L.busy=true;const ok=(await pbk(L.buf))===GATE.hash;L.busy=false;
 if(ok){localStorage.setItem(GKEY,'1');$('#lkDots').classList.add('ok');setTimeout(()=>{document.documentElement.classList.remove('locked');$('#lock').innerHTML='';boot()},150);return}
